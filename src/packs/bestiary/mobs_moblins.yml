  biography: '<p><strong>Needs restat:</strong> numbers predate the published rules and may be misleading.</p><p><strong>Missing:</strong> Level, Size, stat scores, Move, Floor (sets DR), attacks</p><p><em>Sharp-dressed and ready to run a protection ring, these little gangsters are not to be trifled with, lest you take a long walk off a short pier.</em></p><p>These goblin variants are surprisingly well dressed, and tend to be better organized than the usual ilk. Low-level Moblins are armed with broken bottles and slings, while higher-level Moblin Bosses may be armed with Tiny Tommy Guns.  They are often found in territorial wars with their arch enemies the Yakuza.</p><hr><p><em>Source: BanzaiZAP. From <a href="https://pointmongo.com/browse/mobs/moblins">Point Mongo</a>.</em></p>'
