  biography: '<p><em>Not a Furby. A carnivorous, multi-legged, acid-spitting pack predator that only looks like one.</em></p><p>If you grew up at any point in the mid 90’s or early 00’s, then you might know what this adorable little creature is called. If you guessed Furby…you’re Wrong! Your planet actually made a toy similar to this creature and branded it with a name so full of consumerism that you still reference it in pop culture today! This is a Furbe. Yes, they’re different. Furbe’s are carnivorous, multi-legged, Acid spitting, pack predators found primarily around the Mantid Star System. Isn’t it fun to learn?</p><table><tbody><tr><th>Floor</th><td>1</td></tr></tbody></table><hr><p><em>Source: Community submission — Crawler Shap. From <a href="https://pointmongo.com/browse/mobs/furbe">Point Mongo</a>.</em></p>'
