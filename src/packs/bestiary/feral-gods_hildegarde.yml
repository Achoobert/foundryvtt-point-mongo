  biography: '<p><strong>Missing:</strong> Level, Size, stat scores, Move, Floor (sets DR), attacks</p><p><em>A titanic, formerly peaceful Giant Sloth banished to the Nothing, now hungry enough to threaten entire cities on release.</em></p><p>The Feral Giant Sloth Hildegarde was once a peaceful Giant Sloth, who lived her life doing what sloths do best: eating and sleeping. Unfortunately for those where she lived, calling her ''Giant'' is a bit of a misnomer. Hildegarde here is actually titanous, as tall as a score of buildings with an appetite to match. Fun fact!: Did you know that a Sloth only needs to defecate once a week and when they...ahem...go, they lose a third of their body weight? Anyhow, for reasons completely and entirely unrelated, Hildegarde was banished to the Nothing. Upon release from the Nothing, Hildegarde will be hungry...</p><hr><p><em>Source: Community submission — JackWreckem (Crawler #36320). From <a href="https://pointmongo.com/browse/feral-gods/hildegarde">Point Mongo</a>.</em></p>'
