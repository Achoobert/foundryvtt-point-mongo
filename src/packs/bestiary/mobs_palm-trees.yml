  biography: '<p><em>Mobile, sentient Huge palm trees with a giant slapping hand in place of leaves — friendly to vegans, dangerous to everyone else.</em></p><p>Vegans love them, non vegans should be terrified of them. These are not your Caribbean destination picture perfect shade creating plants. They have a flexible trunk and instead of leaves, there is a giant hand, yes a giant hand and the end. Depending on the age and length of the palm tree, they can either smack you to the ground or grab you and throw you with force to a distant location. Vegans though, get a pat on the head and perhaps a palm nut that can be consumed for buffs. These palm trees are not stationary and can migrate by crawling. In this form they are limited to slaps and smacks.</p><p>Resistant to slashing and blunt weapons</p><p>Vulnerable to fire</p><table><tbody><tr><th>Floor</th><td>3</td></tr></tbody></table><hr><p><em>Source: Community submission — Otoun (Crawler #1427). From <a href="https://pointmongo.com/browse/mobs/palm-trees">Point Mongo</a>.</em></p>'
