  biography: '<p><em>A towering, pastel-wrapped Large mob with too many mitten-covered arms, obsessed with ''protecting'' you from everything, forever.</em></p><p>Mob Threat: Suffocating (literally and emotionally). A towering, soft-bodied figure in cheerful pastel fabric with unnaturally elastic, padded-mitten-equipped arms and a permanently over-wide smile. Carries a coffin-sized diaper bag endlessly producing juice boxes, wet wipes, and guilt. She doesn’t want to destroy you — she wants to protect you, from everything, forever, including yourself.</p><table><tbody><tr><th>Floor</th><td>4</td></tr></tbody></table><hr><p><em>Source: Community submission — Shawn (Crawler #—). From <a href="https://pointmongo.com/browse/mobs/mother-smother">Point Mongo</a>.</em></p>'
