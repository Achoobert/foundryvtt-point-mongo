  biography: '<p><strong>Needs restat:</strong> numbers predate the published rules and may be misleading.</p><p><strong>Missing:</strong> Level, stat scores, Floor (sets DR), attacks</p><p><em>A Large Neighborhood Boss that keeps fighting after losing limbs, absorbing crawler body parts and throwing them back.</em></p><p><strong>Type:</strong> Monstrosity (Neighborhood Boss) · <strong>Size:</strong> Large · <strong>HD:</strong> 2/level · <strong>AC:</strong> 4 · <strong>Move:</strong> 10''/round</p><p>Attacks: Charge 1d12, Smash 1d20-x (x = body parts lost since the fight began). Consume (after killing a crawler, absorbs a random body part, gaining new — familiar-looking — limbs). Throw (once below 25% HP, and every 5% after, launches an absorbed body part at the nearest crawler for damage equal to that part''s original owner''s highest stat). A double-decker-bus-sized mutated potato head that keeps coming no matter how many pieces are cut or blown off.</p><hr><p><em>Source: Community submission — The Royal Grumble (Crawler #9002). From <a href="https://pointmongo.com/browse/bosses/giant-mutated-potato-head">Point Mongo</a>.</em></p>'
