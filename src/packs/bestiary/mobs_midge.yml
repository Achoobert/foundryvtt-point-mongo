  biography: '<p><em>Pudgy red demon cherubs, the cannon fodder of Sheol: harmless alone, which is why they never arrive alone.</em></p><p>Short, portly, red skinned demons, sporting nubs of horns, Midges occupy the lowest rung of the hierarchy of Sheol.   Resembling demonic cherubs, they are the canon fodder of the Hells.  Midges are created by the spirits of the damned, specifically those consigned to eternal torture for incredibly minor spiritual transgressions.  The fate of these little bastards will make you reconsider not holding the elevator door, or not helping that old lady cross the street that one time.  Relatively harmless alone, they almost always travel in packs, and can often be found in swarms.</p><p>They are immune to all fire and fire based attacks, including Sheol Fire.</p><table><tbody><tr><th>Floor</th><td>1</td></tr></tbody></table><hr><p><em>Source: Community submission — DeaDPaN79. From <a href="https://pointmongo.com/browse/mobs/midge">Point Mongo</a>.</em></p>'
