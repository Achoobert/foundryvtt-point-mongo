  biography: '<p><strong>Missing:</strong> Level, stat scores, Floor (sets DR), attacks</p><p><em>A Huge, level 25 Giganotosaurus Neighborhood Boss — a failed amusement-park attraction that reclaimed its place atop the food chain.</em></p><p>Giganotosaurus Lv.25 Gigi was one of many groundbreaking experiments done by scientists in the hopes that he would one day become a deeply loved attraction at an amusement park! What the scientists didn''t bet on was that reviving one of the largest terrestrial predators discovered by you meat bags would have consequences. Gigi tore through that park and then some, reclaiming his birthright at the top of the food chain! Way to go, Gigi! Smush Bite Tail Smack/Melee Attack Rush Attack Frenzy-reduces damage but lowers INT Intimidating Roar-taunt skill that lowers attack stats for a short time Passive: Apex: gives user +1 to highest stat for every target with lower same stat, in this case +1 to strength for every strength stat lower than his.</p><hr><p><em>Source: Community submission — MaxAvalon (Crawler #2825). From <a href="https://pointmongo.com/browse/bosses/gigi-bloodmaw">Point Mongo</a>.</em></p>'
