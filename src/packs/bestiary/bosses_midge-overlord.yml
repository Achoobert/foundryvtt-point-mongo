  biography: '<p><em>A four-foot, morbidly obese demon commander who drives swarms of Midges forward at the point of a hell-forged trident.</em></p><p>Midge Overlord''s command the Legions of lessor demons in the armies of Sheol.  The nadir of the commanders of Hells forces, the Overlords are scions of sloth and gluttony.  Towering over their minions, Midge Overlords stand 4'' tall, and their mottled red frames are morbidly obese.  They drive their forces onward at the point of their hell forged tridents.</p><p>They are immune to all fire and fire based attacks, including Sheol Fire.</p><table><tbody><tr><th>Floor</th><td>1</td></tr></tbody></table><hr><p><em>Source: Community submission — DeaDPaN79. From <a href="https://pointmongo.com/browse/bosses/midge-overlord">Point Mongo</a>.</em></p>'
