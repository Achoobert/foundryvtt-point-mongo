system:
  biography: '<p><em>A carpet-cleaning Neighborhood Boss (from Columbus, not Cleveland) whose acid steamer wand and leaky chemical tank can turn the whole room into a fireball.</em></p><p>Introducing the Cleveland Steamer himself! Bob Miller was a cleaning technician based out of Cleveland, but he wasn’t even from Cleveland - the Cleveland Steamer was from Columbus! Bob specialized in cleaning people’s carpets and drapes, even when they didn’t match!</p><p>Resistance: Acid (protective jumpsuit)</p><p>Notes:  If an attack with piercing damage punctures the chemical tank on his back (enough damage to lose a Health Bar slot), the chemical will begin leaking with a spray and the tank will lose some pressure (reducing his Cone reach to 10ft). Once the tank has leaked for one round, the air in the room will be saturated enough that any fire damage or open flame will ignite the area for 1d8 fire damage to everyone in the room; every additional round that passes will add 1d8 fire damage to any such explosion. The explosion will be 20ft Blast +20ft Splash, centered on him, and everyone caught in the Blast+Splash radius must make Evade check (Blast radius fail=full damage and Burned, success=half damage and not Burned; Splash radius fail=half damage and not Burned, success=damage halved again and not Burned).</p><table><tbody><tr><th>Floor</th><td>1</td></tr></tbody></table><hr><p><em>Source: Community submission — SuperBob. From <a href="https://pointmongo.com/browse/bosses/the-cleveland-steamer">Point Mongo</a>.</em></p>'
