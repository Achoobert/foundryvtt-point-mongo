  biography: '<p><em>A suit-wearing goblin crime boss who leads the Moblins, wields Tommy the Gun, and uses his own minions as shields.</em></p><p>The Mobfather is a surprisingly large goblin, and run the Moblins and their war against the Yakuza. He is dressed in a fine three-piece pinstriped suit, and wields Tommy the Gun, an automatic weapon. He is always accompanied by moblins and can use them as meat-shields: he has a Interrupt Action that forces the Catcher ability on the nearest Moblin. A good tactic would to be to waste all nearby Moblins before attacking the Mobfather directly.</p><p>He desperately loves Fermented Yak Milk, and will negotiate for it.</p><table><tbody><tr><th>Floor</th><td>2</td></tr></tbody></table><hr><p><em>Source: Community submission — BanzaiZAP. From <a href="https://pointmongo.com/browse/bosses/mobfather">Point Mongo</a>.</em></p>'
