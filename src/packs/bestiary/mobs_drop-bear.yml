  biography: '<p><em>Fluffy Australian ambushers that drop from the ceiling onto your head, and puke toxic eucalyptus when you hit them back.</em></p><p>Don''t let the fluffy ears and vacant expression fool you. These vicious Australian bastards lurk on ceilings, waiting to drop onto unsuspecting crawlers and sink their filthy teeth into their skulls. Bludgeoning damage triggers their natural defence mechanism: violently puking a torrent of toxic, half-digested eucalyptus over anything unfortunate enough to be nearby.</p><table><tbody><tr><th>Floor</th><td>1</td></tr></tbody></table><hr><p><em>Source: Community submission — Connor MT Dargan. From <a href="https://pointmongo.com/browse/mobs/drop-bear">Point Mongo</a>.</em></p>'
