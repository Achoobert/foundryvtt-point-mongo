  biography: '<p><em>A Neighborhood boss known as Burnface: drug lord of the Bad Llamas, spitting lava and flanked by chemically unpredictable bodyguards.</em></p><p>This neighborhood boss is also know as Burnface. Tony is the drug lord of the Bad Llamas. He keeps a hoard of his best Bad Llamas around him as he loves testing out the sweetest shit in town.</p><p>Any llama in his boss room is likely to have a random crazy effect attached to them as they are always trying out some cutting edge magical meth.</p><p>Ex: can fly 10 feet off the ground, but has a -5 to hit as they cope with their lack of gravity.</p><table><tbody><tr><th>Floor</th><td>1</td></tr></tbody></table><hr><p><em>Source: Community submission — PurpleSnorlax. From <a href="https://pointmongo.com/browse/bosses/tony-monllama">Point Mongo</a>.</em></p>'
