  biography: '<p><em>A bronze money-golem with gold where its health should be. Every hit it takes spills coin on the floor, and every hit it lands takes coin off you.</em></p><p>"This green statue like creature is actually a sentient bronze Golem which holds bags of money, wants more money and its drive is also to kill the little guy. And guess what crawler, your always the little guy. Instead of HP, it has gold as its hit points. For every gold lost, it will drop that gold on the floor.</p><p>It starts with 150 gold in its Bank.</p><p>Capital capitalism stands at 10 meters tall (32.8 ft) and is a sturdy statue that also strikes like a hammer that pushes those into poverty.</p><table><tbody><tr><th>Floor</th><td>3</td></tr></tbody></table><hr><p><em>Source: Community submission — Alex (Crawler #1736). From <a href="https://pointmongo.com/browse/bosses/capital-capitalism">Point Mongo</a>.</em></p>'
