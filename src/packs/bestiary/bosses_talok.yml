system:
  biography: '<p><em>A three-headed demon let out of the Nothing, twice as angry as its clutchmate and untouchable by anything that isn''t magic.</em></p><p>Access to all spells at Level 15</p><p>Released from the Nothing by The Gate of the Feral Gods, Talok is a Feral Chimera Demon. Standing 30'' tall, this heavily muscled, bipedal, bat winged demon has 3 heads like the creature of legend: A flame breathing Lion, a madness inducing Goat, and an acid spitting snake. It walks on cloven hooves, and has two clawed arms which also allows it to wield It''s massive morning star. It''s Feral nature doubles its rage and destructive capability.</p><p>All Chimera Demons are Immune to all Elemental attacks and all non-magical physical attacks.</p><p>I''m Melting Debuff: Crawlers afflicted will suffer 3d4+F dmg /round until the acid is removed, or they are a steaming puddle.</p><p>Talok''s clutchmate Varnath can be found elsewhere in the Dungeon as a City Boss, and if the two were ever to meet, they would attempt to kill each other on sight.</p><table><tbody><tr><th>Floor</th><td>5</td></tr><tr><th>Elite</th><td>Yes (acts once per crawler)</td></tr></tbody></table><hr><p><em>Source: Community submission — DeaDPaN79 (Crawler #1945). From <a href="https://pointmongo.com/browse/bosses/talok">Point Mongo</a>.</em></p>'
