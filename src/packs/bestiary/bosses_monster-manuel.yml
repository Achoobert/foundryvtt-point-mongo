  biography: '<p><strong>Needs restat:</strong> numbers predate the published rules and may be misleading.</p><p><strong>Missing:</strong> Level, stat scores, Floor (sets DR), attacks</p><p><em>A small, hidden Neighborhood Boss in a library that spawns a paper monster from itself every minute and flees when found.</em></p><p><strong>Boss room:</strong> A Library</p><p><strong>Description:</strong> Hidden somewhere in this maze is the Monster Manuel. Find him before his pages find you.</p><p><strong>Boss abilities:</strong> He is hidden in the maze. Every minute a paper monster spawns and begins to move through the maze. When found he is a book with a face on the spine and legs. As the players approach the book bursts open and a monster tears itself out of the book.</p><p>The book will spawn a monster every minute this is his one and only spell . As the players deal with the monster the book will run away and hide.</p><p>Abilities - Hide in plain sight, gives him a high chance of being overlooked while on a bookshelf. Evade, The monsters that come from him are the 2D monsters similar to the ink creatures that Signet had as tattoos. If the players manage to kill the Monster Manuel without completely destroying his pages they can use the rest of the pages(or a set amount - 2d8x3) as summons.</p><hr><p><em>Source: Community submission — Christopher Wingenbach (Crawler #10902). From <a href="https://pointmongo.com/browse/bosses/monster-manuel">Point Mongo</a>.</em></p>'
