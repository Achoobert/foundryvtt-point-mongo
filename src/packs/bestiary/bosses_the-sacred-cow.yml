  biography: '<p><em>The leader of the Yakuza: a massive yak in saffron robes who fights with brass knuckles, martial strikes and tramples.</em></p><p>The leader of the Yakuza, the Sacred Cow is a massive yak in saffron robes. It wields a pair of brass knuckles: Thoughts and Prayers. It uses martial attacks and tramples to fight the crawlers and is usually accompanied by several members of the Yakuza. While the Sacred Cow is indeed a mighty fighter, its powers are enhanced by the Prayer Discs that the Yakuza DJs are spinning, filing the chamber with scratching chants. Stopping the discs from spinning will significantly reduce the Cow''s DR and damage (half STR and CON).</p><p>If the party can negotiate with the yak, they would be willing to sell Fermented Yak Milk.</p><table><tbody><tr><th>Floor</th><td>2</td></tr></tbody></table><hr><p><em>Source: Community submission — BanzaiZAP. From <a href="https://pointmongo.com/browse/bosses/the-sacred-cow">Point Mongo</a>.</em></p>'
