  biography: '<p><em>Medium, aggressive horse-headed humanoids who favor cowboy gear and often travel in herds on the 3rd floor''s Western-themed regions.</em></p><p>This bipedal equine race of carnivores appear as heavily muscled humanoid creatures with a head closely resembling a horse whose mouth is filled with sharp fangs. Their bodies are covered in a soft coat and mane that can widely vary in coloration. Aggressive, and quick to anger, Equitaur''s are often found on the 3rd floor of the World Dungeon, where they populate regions that emulate the American West. Equitars have been known to sport western gear - cowboy hats, boots with spurs, chaps, shirts with dangly fringe, and are fond of carrying 6 shooter revolvers, and single action rifles. On lower floors there are rumours of Equitaur gangs of "Street Toughs" in leather jackets, and spiked mohawks in their manes, but this is unconfirmed. Equitaur''s often travel in herds, with both genders being equally vicious.</p><table><tbody><tr><th>Floor</th><td>3</td></tr></tbody></table><hr><p><em>Source: Community submission — DeaDPaN79 (Crawler #1945). From <a href="https://pointmongo.com/browse/mobs/equitaur">Point Mongo</a>.</em></p>'
