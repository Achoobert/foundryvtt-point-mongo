system:
  biography: '<p><em>A camouflaged, acid-based ooze that grows and splits with each meal, dangerous mainly because you rarely see it coming.</em></p><p>This sneaky little sucker is often used as a janitor mob on the early dungeon levels. Able to blend into their environment with astonishing ease, these unthinking scavengers share the camouflage abilities of earth creatures like the Earth octopus or chameleon. They are drawn by light, heat, and sound on their quest for food. They grow in size with every meal, and upon reaching level 10 they often split into two separate level 5 mobs. If the environment can sustain them, they can reportedly attain vast sizes over time. Their attack is acid based, and can eat through standard leather armor. The real danger is stepping directly into the center of a large mimic slime without ever realizing it was there. Barefoot crawlers are their favourite snack in the dungeon. They can also travel on walls and ceilings to drop from above for an unwelcome surprise.</p><table><tbody><tr><th>Floor</th><td>2</td></tr></tbody></table><hr><p><em>Source: Community submission — DeaDPaN79 (Crawler #1945). From <a href="https://pointmongo.com/browse/mobs/mimic-slime">Point Mongo</a>.</em></p>'
