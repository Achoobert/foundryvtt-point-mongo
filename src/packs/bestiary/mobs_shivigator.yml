  biography: '<p><em>A radioactive gator from Gator Creek Estates with knives for arms and teeth, scales tough enough for DR 2, and a bad habit fed by the Nope Ropes.</em></p><p>Mutated by the radioactive waste around Gator Creek Estates, this vicious reptilian murder machine has built-in knives for arms and teeth. The Shivigators want to become the leaders of the borough, but they''re hooked on the ecstasy made by the Nope Ropes, mutated boa constrictors, and their leader, MC Constrictor. The borough is known as the Everblades because of the razor wire-like plants that grow in this marshy area of the first floor. Their tough scales give them DR 2.</p><p>(P.S. Don''t attempt to pet the Shivigator. It has no sense of friendship or personal space, nor does it know the difference between a handshake and an amputation.)</p><table><tbody><tr><th>Floor</th><td>1</td></tr></tbody></table><hr><p><em>Source: Community submission — VertaHex. From <a href="https://pointmongo.com/browse/mobs/shivigator">Point Mongo</a>.</em></p>'
