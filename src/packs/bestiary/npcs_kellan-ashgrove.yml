  biography: '<p><strong>Missing:</strong> Level, Size, stat scores, Move, Floor (sets DR), attacks</p><p><em>A once-renowned half-elf bard fallen from favor, blaming a broken lute for his troubles and using Charm magic to rope crawlers into retrieving a fabled replacement.</em></p><p><strong>Level:</strong> 50 · <strong>Race:</strong> Half-Elf · <strong>Class:</strong> Bard · <strong>Tunnel Show Title:</strong> The Price of a Song</p><p>A once-renowned half-elf bard who has fallen out of favor with the elven high court, Kellan has fallen on hard times, relegated to performing in small and medium settlements after a misstep at court. He blames all his troubles on his current instrument: a badly damaged, un-tuneable lute. Kellan''s bardic magic leans heavily on Charm spells, which he''ll use to coerce the party into venturing into dangerous territory to retrieve a fabled musical instrument of great power.</p><table><tbody><tr><th>Elite</th><td>Yes (acts once per crawler)</td></tr></tbody></table><hr><p><em>Source: Community submission — DeaDPaN79 (Crawler #1945). From <a href="https://pointmongo.com/browse/npcs/kellan-ashgrove">Point Mongo</a>.</em></p>'
