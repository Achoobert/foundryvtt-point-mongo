system:
  biography: '<p><em>A chaotic Petite gremlin that swaps places with party members and mobs mid-combat, capturable as a wearable button.</em></p><p>A minion of the goddess Eris that switches places with a randomly rolled party member or mob (75% chance). On a natural 1 it also swaps equipment and clothes; on a natural 20 it transfers 1d4 of its stolen loot to that crawler. If captured (reduced to 5% HP, immobilized, and shamed with a show of social outrage), it transforms into a wearable button that can swap places with a chosen target, skip normal looting order, or grant one-time entry to the Desperado Club (25% chance to disappear after each use).</p><table><tbody><tr><th>Floor</th><td>1</td></tr></tbody></table><hr><p><em>Source: Community submission — K8 (Crawler #71). From <a href="https://pointmongo.com/browse/mobs/the-queue-jumper">Point Mongo</a>.</em></p>'
