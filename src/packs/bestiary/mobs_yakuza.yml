  biography: '<p><strong>Needs restat:</strong> numbers predate the published rules and may be misleading.</p><p><strong>Missing:</strong> Level, Size, stat scores, Move, Floor (sets DR), attacks</p><p><em>Dangerous and uniform, these Yak-based gangsters will use their expertise in cloven-based melee combat to protect their territory from other gangs. Though they know a good business opportunity when they see one.</em></p><p>These furry oxen have learned the Mystic Martial Arts and have decided to use their powers for Bad. Low-level Yakuza rely on their Mystic Martial Arts in melee, but higher level Yakuza can have psychic attacks backing up their punches. They are often at war with the Moblins, but have recently been found selling Fermented Milk to Moblin Bootleggers.</p><hr><p><em>Source: BanzaiZAP. From <a href="https://pointmongo.com/browse/mobs/yakuza">Point Mongo</a>.</em></p>'
