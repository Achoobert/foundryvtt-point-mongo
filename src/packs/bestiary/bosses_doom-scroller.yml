  biography: '<p><strong>Needs restat:</strong> numbers predate the published rules and may be misleading.</p><p><strong>Missing:</strong> Level, stat scores, Floor (sets DR), attacks</p><p><em>A deliberately easy, low-threat Neighborhood Boss designed as an XP trap: it revives itself for diminishing rewards.</em></p><p><strong>Type:</strong> Creature (Neighborhood Boss) · <strong>Size:</strong> Small · <strong>HD:</strong> 1/level · <strong>AC:</strong> 10 · <strong>Move:</strong> 20''/round · <strong>DMG:</strong> 1</p><p>Low AC, high HP, laughably weak attack — deliberately easy. After each kill a "revive" option appears to farm more XP; first kill grants 1d4 XP, every kill after that is rolled with disadvantage, tempting crawlers to waste time chasing diminishing returns while the floor timer counts down. Boss room: a bedroom or bathroom.</p><hr><p><em>Source: Community submission — Ian O''H (Crawler #4207). From <a href="https://pointmongo.com/browse/bosses/doom-scroller">Point Mongo</a>.</em></p>'
