  biography: '<p><strong>Missing:</strong> Level, stat scores, Move, Floor (sets DR), attacks</p><p><em>Heavily armored orc musicians who wage war through weaponized symphonies from trombone cannons and bagpipe flamethrowers.</em></p><p>The Orcestra are heavily armored orc musicians who wage war through weaponized symphonies. Each member carries an instrument modified into a brutal battlefield tool — trombone cannons, bagpipe flamethrowers, violin bows strung with razor wire, and drum kits that create shockwaves powerful enough to crack castle walls. They travel from kingdom to kingdom in a massive black war wagon called The Tour Bus of Doom, demanding tribute before performing their “final concert.” Their attacks grow stronger the longer they stay in rhythm, forcing adventurers to interrupt songs before the Orcestra reaches its devastating finishing move: The Fortissmash. Bards consider them a disgrace to music. Orcs consider them legends. Everyone else just hopes they don’t ask for an encore.</p><hr><p><em>Source: Community submission — Kyton786 (Crawler #11890). From <a href="https://pointmongo.com/browse/mobs/orcestra">Point Mongo</a>.</em></p>'
