  biography: '<p><strong>Missing:</strong> Level, Size, stat scores, Move, Floor (sets DR), attacks</p><p><em>A Monty Python-style Black Knight who resurrects fully intact every 3 days unless the party keeps a dismembered piece of him with them.</em></p><p><strong>Level:</strong> 50 · <strong>Class:</strong> Hedge Knight</p><p>The party will face and defeat him easily early on, but he doesn''t stay down — after 3 days he resurrects on whatever floor the party is on and continues to hunt them until they figure out his true weakness. The Black Knight from Monty Python and the Holy Grail, but worse, since he comes back with all his appendages once more intact.</p><p>The real trick to defeating him for good: each party member needs to keep one of his dismembered appendages in their inventory. Failing to do so means he''ll keep coming, hunting the party relentlessly until its members are dead or leave the dungeon. After all — "''Tis but a flesh wound!"</p><table><tbody><tr><th>Elite</th><td>Yes (acts once per crawler)</td></tr></tbody></table><hr><p><em>Source: Community submission — Brenden Harden (Crawler #12193). From <a href="https://pointmongo.com/browse/mobs/the-black-knight">Point Mongo</a>.</em></p>'
