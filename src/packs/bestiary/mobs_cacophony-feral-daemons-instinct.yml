system:
  biography: '<p><em>Insect-like Discordants of Instinct: the violent kind, from a demonic cosmology built on music.</em></p><p>Legends of Avantris came up with a cosmology based in Music. Demons there are called Discordants, and are divided in 4 kinds: Instinct (Insect like and violent), Thrill (Demonic Clowns with extreme emotional states), Progress (Cyborg-like and cold, devoid of emotions) and Entropy (Undeath and decay).</p><p>I am using those concepts in Feral creatures, insane demons thrown into the Nothing and devolving even more down these paths. This is the entrance for an Instinct Lesser Daemon.</p><table><tbody><tr><th>Floor</th><td>8</td></tr></tbody></table><hr><p><em>Source: Community submission — Gabe M. From <a href="https://pointmongo.com/browse/mobs/cacophony-feral-daemons-instinct">Point Mongo</a>.</em></p>'
