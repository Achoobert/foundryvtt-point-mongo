  biography: '<p><em>A pizza-loving mutant turtle who bowls through crawlers in its shell and vanishes in a puff of smoke.</em></p><p>Deep beneath the city, four baby turtles and their rat minder were drenched in a toxic ooze that mutated them and transformed them into humanoid beasts capable of incredible acts of strength and dexterity. So what do these mutated reptiles do? Eat pizza and protect the city from the shadow, of course!</p><p>Weapon Skills: Bō Staff (Quarterstaff), Katana (Longsword), Sai (Dagger), Nunchaku (Improvised Weapons)</p><p>Skills: Balance, Catcher, Dodge, Double Tap, Driving, Dumpster Diving, Endurance, Escape Artist, Fabricate, Gear Head, Hide In Shadows, Light On Your Feet, Perception, Stealth, Tactics, Throwing, Taunt (Rank 5 in each)</p><table><tbody><tr><th>Floor</th><td>1</td></tr></tbody></table><hr><p><em>Source: Community submission — BlessedPsycho, Crawler #26,933. From <a href="https://pointmongo.com/browse/bosses/turtle-ninja">Point Mongo</a>.</em></p>'
