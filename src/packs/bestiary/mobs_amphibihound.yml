system:
  biography: '<p><strong>Missing:</strong> Level, Floor (sets DR)</p><p><em>A mastiff-sized bullfrog with a bark like a bomb, a sticky tongue and a habit of laughing at anyone who gets hurt, its own pack included.</em></p><p>These sadistic creatures would be much worse to deal with if they didn''t have terrible personalities. Once they notice someone in their area they will croak this ribbit bark hybrid that goes off like a bomb if you are too close, but will also let everyone in the neighborhood know that something is happening. If they see anyone get hurt they will stare and laugh at them including their own, giving their prey a chance to get away. Because some of their prey do get away fairly often, they try to swallow things hole. These Bullfrogs with the body and size of mastiffs, are fast and very strong. Amphibihounds can be found on most levels of the dungeon, after floor 6 they don''t get stronger but then become alarm pets for stronger Hunting type Mobs.</p><hr><p><em>Source: Community submission — Bastionjack. From <a href="https://pointmongo.com/browse/mobs/amphibihound">Point Mongo</a>.</em></p>'
