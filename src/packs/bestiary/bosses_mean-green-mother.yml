      damageType: poison
      range: 15ft Burst radius
      effect: Any crawler who fails to Evade gains the Poisoned Debuff.
    - name: Vine Eruption
      toHit: ''
      damage: 3d8+5
      damageType: poison
      range: 20' ft
      effect: Bursting thorn-covered vines shoot up out of the floor in a 20-foot zone. Affected grid tiles become difficult terrain.
    - name: Feed Me! (Swallowed)
      toHit: ''
      damage: ''
      damageType: ''
      range: ''
      effect: The Mean Green Mother swallows the crawler whole. Crawlers receive the Swallowed Debuff. When a Crawler escapes the Mean Green Mother, or when the plant dies, affected crawlers may remove the Swallowed debuff.
    - name: Secret Desires
      toHit: ''
      damage: N/A
      damageType: ''
      range: 100' ft/20' ft blast radius
      effect: The Mean Green Mother offers the crawler whatever they most desire. Crawlers make a CHA Check vs DC 15+F or they gain the Mesmerized Debuff.
