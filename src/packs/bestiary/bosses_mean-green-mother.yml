system:
  biography: '<p><em>A carnivorous plant from outer space and elite Borough Boss that bites, entangles and swallows crawlers whole, then tempts the rest with their heart''s desire.</em></p><p>Now, in all fairness, there are PLENTY of carnivorous plants in the galaxy that I could’ve chosen from. Hundreds, in fact. But this Mean Green Mother From Outer Space? How could I pass up a chance to bring him into the dungeon? Are you kidding me?! Now there’s a creature with some BITE!</p><p>This is one of the great movie monsters of your 20th century. That bloodlust! That manipulation – so obvious, yet so subtle at the same time! It just sends shivers down my spine! And I don’t even have a physical body!</p><p>This level 20 herbaceous carnivore is out for blood, and you lot sure do look mighty tasty! Better watch out for those thorns!!</p><p>Notes: Fast-Growing—Heals 1 HB slot at the end of each round.</p><p>Loot</p><p>- Not-Hard-To-Come-By Plant Food (Potion) (x2)</p><p>- Spellbook: Vine Eruption</p><p>- Brawndo (x5)</p><p>Loot Box for highest damage dealer:</p><p>- Enchanted Leather Jacket of the Skid Row Dentist (Patch Jacket)</p><p>- Upgrade Pin of the Teasing Pod (Enamel Pin)</p><table><tbody><tr><th>Floor</th><td>2</td></tr><tr><th>Elite</th><td>Yes (acts once per crawler)</td></tr></tbody></table><hr><p><em>Source: Community submission — BlessedPsycho, Crawler #26,933. From <a href="https://pointmongo.com/browse/bosses/mean-green-mother">Point Mongo</a>.</em></p>'
