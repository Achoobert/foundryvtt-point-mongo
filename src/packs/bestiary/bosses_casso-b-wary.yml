  biography: '<p><em>A guitar-shredding cassowary boss who rips off songs and crawlers alike, and gets faster as it nears death.</em></p><p>This towering, eight-foot-tall borderline dinosaur from the outback is a cassowary!</p><p>With razor-sharp talons, a bloodstained electric guitar, and absolutely will be playing off every song it rips off as its own.</p><p>Casso B. Wary charges into battle playing face-melting guitar solos, using his enormous claws to shred unfortunate crawlers into bloody ribbons. Nobody knows where the guitar came from, how he''s playing it without hands, or why every successful disembowelment is accompanied by a perfectly timed power chord.</p><table><tbody><tr><th>Floor</th><td>1</td></tr></tbody></table><hr><p><em>Source: Community submission — Connor MT Dargan. From <a href="https://pointmongo.com/browse/bosses/casso-b-wary">Point Mongo</a>.</em></p>'
