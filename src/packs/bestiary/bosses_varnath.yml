  biography: '<p><em>A shock trooper of the Legions of Sheol: three heads, a morning star, and nothing but magic will touch it.</em></p><p>Varnath is a Chimera Demon of the 15th Floor. These massive demons are often used as Shock Troops of the Legions of Sheol.  Standing 30'' tall, this heavily muscled, bipedal, bat winged demon has 3 heads like the creature of legend: A flame breathing Lion, a madness inducing Goat, and an acid spitting snake. It walks on cloven hooves, and has two clawed arms which also allows it to wield It''s massive morning star.</p><p>Its feral clutchmate Talok. once banished to the Nothing, is now is found elsewhere in the Dungeon as a Floor Boss — if the two ever meet, they will try to kill each other on sight.</p><p>Access to all spells at Level 15</p><p>All Chimera Demons are Immune to all Elemental attacks and all non-magical physical attacks.</p><p>I''m Melting Debuff: Crawlers afflicted will suffer 3d4+F dmg /round until the acid is removed, or they are a steaming puddle.</p><table><tbody><tr><th>Floor</th><td>15</td></tr><tr><th>Elite</th><td>Yes (acts once per crawler)</td></tr></tbody></table><hr><p><em>Source: Community submission — DeaDPaN79 (Crawler #1945). From <a href="https://pointmongo.com/browse/bosses/varnath">Point Mongo</a>.</em></p>'
