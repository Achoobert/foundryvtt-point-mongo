  description: '<p><em>A classic raging barbarian: Rage, a spread of physical skills, and resistance to bludgeoning, piercing and slashing, but half the mana.</em></p><p>This is a very simple one. Just a classic raging barbarian.</p><p><strong>Stat bonuses</strong></p><ul><li>+3 Strength</li><li>+2 Constitution</li></ul><p><strong>Skill bonuses</strong></p><ul><li>+2 to a Melee or Unarmed STR attack of your choice</li></ul><p><strong>Benefits</strong></p><ul><li>+1 to Endurance, Double Tap, Jumping, Running and Intimidate. <em>(extreme)</em></li><li>Rage Benefit <em>(major)</em></li><li>Resistance to Bludgeoning <em>(epic)</em></li><li>Resistance to Piercing <em>(epic)</em></li><li>Resistance to Slashing <em>(epic)</em></li></ul><p><strong>Detriments</strong></p><ul><li>Can only have up to half your mana point total <em>(2 pt)</em></li><li>May not use Dex Ranged attacks <em>(2 pt)</em></li></ul><hr><p><em>Source: Community submission — Gabe M. From <a href="https://pointmongo.com/browse/classes/mindless-zerker">Point Mongo</a>.</em></p>'
