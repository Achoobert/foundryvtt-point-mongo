system:
  description: '<p><strong>Missing:</strong> Build Point tiers on each benefit</p><p><em>An Earth Arcanist who tears souls from the freshly dead and forges them into objects, poisoning himself if he hoards too many.</em></p><p>The dead have unfinished business. Unfortunately for them you have a hammer.</p><p>From hopping umbrella monsters to self playing lutes that give life advice, the Tsukumogami Smith practices the ancient and sacred art of removing the “in” from “inanimate.”</p><p>Fresh souls are best: warm, confused, and still arguing with the recent change in circumstances. A Tsukumogami Smith tears these wailing spirits from their former owners, stores them inside their own body, and eventually hammers them into weapons, tools, furniture, cookware, or whatever other object seems funniest at the time.</p><p>The resulting creations are intelligent, temperamental, and occasionally useful. They remember fragments of their former lives, develop intense opinions about their new purpose, and generally resent the asshole who stuffed them into a chamber pot.</p><p>A skilled Tsukumogami Smith can create an object that is powerful, loyal, or sane. Pick one.</p><table><tbody><tr><th>Prerequisites</th><td>Enter the dungeon with one sentimental object and keep it protected until the 3rd floor.</td></tr><tr><th>Rank 20</th><td>Arcane</td></tr><tr><th>Build points</th><td>30</td></tr></tbody></table><p><strong>Stat bonuses</strong></p><ul><li>+6 INT</li></ul><p><strong>Skill bonuses</strong></p><ul><li>+2 Soul Collector and Drain Life spells</li><li>+3 to the Smithing and Arcane skills</li><li>+2 Salvage Skill</li><li>+1 Spirit Wrangler Skill (INT)</li><li>+1 Soul Reservoir Passive</li></ul><p><strong>Benefits</strong></p><ul><li>One Tier-1 Crafting Table of your choice <em>(minor)</em></li><li>Soul Binding: As an Action, you may attempt to tear the soul from a creature that died less than one minute ago. Make a Spirit Wrangler (INT) Check with Difficulty equal to 10 plus the difference between your Level and the deceased creature’s Level. On Success, the soul is dragged—usually screaming, swearing, or demanding to speak with a manager—into your Soul Reservoir. <em>(major)</em></li><li>Soul Forging: You may attempt to infuse a captured soul into an inanimate object. Make a standard Arcane (INT) Check. An appropriate Arcanist Table may augment this Check. On Success, the soul is bound into the object and the object becomes a soul-forged creation. Mark Soul Reservoir for Advancement. On Fail, the soul escapes the object. Make a Salvage Check to catch and reabsorb it before it flees. <em>(moderate)</em></li><li>Soul Anchor: You can spend a soul from your Soul Reservoir to gain +1 DR for 1 hour. <em>(minor)</em></li><li>Soul Burst: As part of an Attack Action with a Spell you can consume any number of souls from your reservoir to add that many d4s to the spell''s damage on one target. <em>(moderate)</em></li><li>Custom Skills: Soul Reservoir - You may store a number of captured souls equal to your Rank in this Skill. Stored souls remain inside you until expended, forged into objects, or released by another effect. Spirit Wrangler - Does absolutely nothing on its own! Is the governing skill for the Tsukumogami abilities.</li></ul><p><strong>Detriments</strong></p><ul><li>Soul Poisoning: <em>(2 pt)</em></li><li>Your squishy fragile body is not a hotel for dead people! After each 30-hour day count the souls remaining in your Soul Reservoir: 0-4: Nothing. 5-9: 1 stack of Soul Poisoning. 10-14: 2 stacks. 15+: 3 stacks.Each stack of Soul Poisoning imposes a cumulative -1 to all Skill Checks. Additional debuffs are unlocked at a certain threshold: 5: You are Shit-Faced. 10: You have The Taint. 15: You are dead. Not only are you dead but you explode in spectacular fashion dealing 12d6 necrotic in a 50ft Blast. Anyone who survives this gets The Taint until their next long rest. This attack uses your Intelligence against everyone''s Evade. All unlocked debuffs go away after a long rest so long as you are below the required stacks... except dead, but you did that to yourself. Additionally every time a soul is spent on an ability, spell, or check it takes one stack of Soul Poisoning with it.</li></ul><hr><p><em>Source: Community submission — Kron. From <a href="https://pointmongo.com/browse/classes/tsukumogami-smith">Point Mongo</a>.</em></p>'
