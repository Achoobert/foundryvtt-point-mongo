name: Urban Ninja
type: class
img: icons/svg/combat.svg
folder: vdVnXkhQ0bcs7QUZ
system:
  description: '<p><em>A Rogue/Ranger who learned the sword from YouTube and fights on a skateboard, with a robot dog made of nanites at their side.</em></p><p>While others partied and had premarital relations, you studied the sword, through countless hours of YouTube videos and Anime Playlists. Good news! You can now look back at your parents and say, “All of those hours spent behind a screen instead of finding a job were worth it!” ...that is…uh...if they’re still around. Urban Ninjas are just like your stereotypical ninja from all of those aforementioned videos, if they went through a Radicalization Ray of the early 90’s and slammed right into the wall of a Cyberpunk Factory. Far out!</p><p><strong>Denjutsu.</strong> Although the direction translation of Denjutsu is ‘Electric Technique’, Denjutsu focuses on using technology and cybernetic abilities to enhance your deadly ninja skills. You gain +2 to the Steam Fog Spell (Confusing Fog) or +2 to the Force Field Generator Spell (Wisp Armor). You also gain a +1 to the Lightning Shuriken Spell (Shock Treatment)</p><p><strong>Ninjutsu.</strong> Sun Tzu once said “All warfare is based on deception. Hence, when able to attack, we must seem unable; when using our forces, we must appear inactive.” I’m not sure what that has to do with fighting a 15-foot-tall, flesh rendition of the Pixar lamp, but it feels like it totally fits the situation…you know? Gain +1 to the Detect Trap, Dodge, Escape Artist, Hide in Shadows, and Stealth Utility Skills.</p><p><strong>Taijutsu.</strong> A bit of a history lesson, ninja’s during the feudal days of Japan didn’t dress in all black and carry massive, burdensome swords. They actually dressed in common everyday clothing to blend into communities better and wielded much simpler tools like gardening instruments. To keep in the tradition of these brave and noble people, you gain a +1 to the Club, Dagger, Bow, Javelin, Shuriken, and Slingshot Attack Skills.</p><table><tbody><tr><th>DR</th><td>0</td></tr><tr><th>Prerequisites</th><td>Skateboarding +3, Stealth +3</td></tr><tr><th>Crafting table</th><td>n/a</td></tr><tr><th>Rank 20</th><td>Skateboarding, Dodge</td></tr><tr><th>Bonus box</th><td>Earth Hobby Box</td></tr><tr><th>Build points</th><td>30</td></tr></tbody></table><p><strong>Stat bonuses</strong></p><ul><li>+5 Dexterity</li><li>+3 Intelligence</li></ul><p><strong>Skill bonuses</strong></p><ul><li>+2 Steam Fog or Force Field Generator Spell Skills</li><li>+1 Lightning Shuriken Spell (Reflavored Shock Treatment)</li><li>+1 Detect Trap, Dodge, Skateboarding, Stealth and Hide in Shadows Utility Skills</li><li>+1 club, Dagger, Bow, Javelin, Shuriken, and Slingshot Attack Skills</li></ul><p><strong>Benefits</strong></p><ul><li>Cybernetic Naniken. Your Cybernetic Naniken is a small robotic animal, usually a dog, consisted mostly out of nanites. Once it is fully grown, these nanites can alter their primary mode of transportation, taking on new shapes. Now you may be asking, how do robotic nanites grow, if they’re not alive? Well, my answer to you, buddy boy, is to Mind your Own Business! Cybernetic Naniken, Level 1 · Temperament: Calm · Robot · HP: 1(100%) · Evade: +1 · Speed: 20+S · DR: 0 · STR 2(+1) / INT 1(+1) / CON 2(+1) / DEX 2(+1) / CHA 1(+1) · Slice Attack: D20+F+STR to hit, 1D4+STR Slashing · Skill Rank = Floor Level (F) · When bonded, gain the following abilities: Increased Speed: Move is increased to 60 · Living Shield: Gain the Catcher Skill · Level 15: Environmental Adaptation: 1/day gain either Swim or Burrow with Move of 30, or Flight or Jump with Move 50. <em>(major)</em></li><li>Ride the Wall. Tony Hawk, Rodney Mullen, the Teenage Mutant Ninja Turtles. Each one of these great skateboarding legends has achieved unimaginable heights of talent, skill, and technical fortitude. Luckily the Borant Corporation was able to upload the tremendous effort of all of these legends into a class option so that you don’t need to bother about pesky things like practicing. While riding a Skateboard, Hoverboard or Similar Vehicle, gain Climb with Move of the vehicle. <em>(major)</em></li><li>Lost Arts of the Radical Dude. Although popular on Earth, what you humans call skateboarding has been around in the galactic syndicate long before your tiny rock of a planet was seeded. The most cowabunga of all of them was a Porsuk by the name of Ferikk Fast Wheels whose inventions of the the Mid-Air Vector Shift and the Zero-Friction Darkslide with an Intermediate Slope Spin helped the Bopcas turn the tide in their favor during the Genocide of Opulom 12. The Skateboarding and Dodge Utility Skills can be raised to Rank 20. <em>(moderate)</em></li></ul><p><strong>Detriments</strong></p><ul><li>Jelly Legs. Remember when I said that it was a good thing that you didn’t have to worry about practicing? Well because you skipped that part, your inferior legs are unable to function normally off of your vehicle. You have Disadvantage on all Movement related skills whenever not piloting a Skateboard, Hoverboard or similar vehicle. Harsh dude. <em>(2 pt)</em></li></ul><hr><p><em>Source: Community submission — Crawler Shap. From <a href="https://pointmongo.com/browse/classes/urban-ninja">Point Mongo</a>.</em></p>'
