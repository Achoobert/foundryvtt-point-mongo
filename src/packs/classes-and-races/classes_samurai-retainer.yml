  description: '<p><em>Dexterity-based Fighter focused on precision swordsmanship, counterattacks, and controlled movement.</em></p><p>You have been trained at a very early age to focus on discipline, precision, duty, and decisive action. While not a master in your art yet, you show great potential, and your training has been paying off in your daily life. You''re not the wild brawler or battlefield showoff, you''re someone with an actual purpose, and honestly that''s more than be said for most who''ve wandered in the Dungeon.</p><table><tbody><tr><th>DR</th><td>2</td></tr><tr><th>Prerequisites</th><td>You must have +5 in any Edged Weapon Skill, and higher Dexterity than your Strength by the time you reach Floor 3.</td></tr><tr><th>Bonus box</th><td>Silver Earth Box</td></tr></tbody></table><p><strong>Stat bonuses</strong></p><ul><li>+3 Dexterity</li><li>+2 Constitution</li><li>+2 Strength</li></ul><p><strong>Skill bonuses</strong></p><ul><li>+2 Iaijutsu Draw Skill</li><li>+2 Perfect Cut Skill</li><li>+2 Counterstroke Spell</li></ul><p><strong>Benefits</strong></p><ul><li>You can swap CON with DEX for determining your Health Bar values <em>(major)</em></li><li>At the end of each floor, add 1 to your Skill Advancement Checks for any Sword-based Skills <em>(moderate)</em></li><li>All Sword-based Skills may be raised to Rank 20 <em>(moderate)</em></li></ul><hr><p><em>Source: Community submission — JackWreckem (Crawler #36320). From <a href="https://pointmongo.com/browse/classes/samurai-retainer">Point Mongo</a>.</em></p>'
