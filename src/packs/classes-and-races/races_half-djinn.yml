system:
  description: '<p><em>Forest-genie hybrids who hover over rough ground, shrug off Charisma, and grant one crawler a wish each scene.</em></p><p>Half-Djinns are common amongst the Hunting Grounds and other forested levels of Dungeon Crawler World. Nobody knows for certain why there are so many hybrid Djinns out there, but one theory suggests that a rather ill-timed expletive is the cause of the population explosion. It is posited that a person in control of a Djinn’s lamp and the resulting three wishes once exclaimed, “Fuck this forest” or “Fuck this level” or “Fuck you all” or some iteration thereof, and the enslaved genie took that as a challenge. As a result, thousands of half-Djinn, half-forest creatures roam the dungeon. Only a few are intelligent. Only a few are sane. They are all dangerous little fuckers.</p><table><tbody><tr><th>Size</th><td>Medium (4)</td></tr></tbody></table><p><strong>Stat bonuses</strong></p><ul><li>+9 to split as you please between Str, Dex, Con and Cha</li></ul><p><strong>Skill bonuses</strong></p><ul><li>+2 to Arcane</li></ul><p><strong>Benefits</strong></p><ul><li>Hovering: May traverse difficult terrains without penalties or making any checks <em>(major)</em></li><li>Charisma bonuses don''t work on half-djinns <em>(major)</em></li><li>Wish: Provide a significant Bonus (up to 4 pts) to a fellow crawler once per scene <em>(major)</em></li><li>A Natural attack, related to the forest creature you are an offshoot from. (1d8 Str or Dex. S, P or B dmg. Rank only increases by Floor) <em>(major)</em></li></ul><hr><p><em>Source: Community submission — Gabe M. From <a href="https://pointmongo.com/browse/races/half-djinn">Point Mongo</a>.</em></p>'
