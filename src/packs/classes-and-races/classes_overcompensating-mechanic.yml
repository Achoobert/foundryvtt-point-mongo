name: Overcompensating Mechanic
type: class
img: icons/svg/combat.svg
folder: vdVnXkhQ0bcs7QUZ
system:
  description: '<p><em>Finally, all those years of building Gundam figurines are about to pay off. With this class, you will descend into battle equipped with a custom-built Mech that you will pour your blood, sweat, and most definitely tears into.</em></p><p><strong>Class Type:</strong> Fighter. This is an Earth Class. Prerequisite: Size Medium (4) or Smaller. Some crawlers compensate for physical shortcomings with exercise, martial training, expensive cars, or aggressively mentioning how much they can bench. You chose hydraulics. An Overcompensating Mechanic specialises in building a custom suit of powered armour, walker, battle rig, or completely unnecessary fucking mech. Your Class provides the chassis and enough technical knowledge to keep it moving. Weapons, armour, magical upgrades, cup holders, and the suspiciously large red button labelled DO NOT PRESS are your responsibility. Your biological body may be weak, small, slow, squishy, or simply disappointing. None of that matters once you''re sitting inside five tons of reinforced metal. Probably. +4 Intelligence, +3 Gear Head Skill, +3 Engineering Skill, +2 Smithing Skill, +1 Salvage Skill, Silver Earth Box, with guaranteed Earth Hobby Potion. Goddamn Mech: You gain a custom Size Large (5) Construct chassis. Treat it as a Utility Pet for its basic statistics, Health Bar progression, and Special Abilities, except as modified below. The mech begins with normal Level-1 Pet Stats and gains +4 additional Stat Points, divided between Strength, Constitution, Dexterity, and Charisma. Its Intelligence remains 1.  Choose two Utility Pet Special Abilities when the chassis is created. These represent built-in systems such as enhanced propulsion, sensors, alternative movement systems, or specialised armour. Utility Pets normally receive two Special Abilities. There Is No Dog In Here: The mech is not an independent creature. It takes no Actions of its own and cannot move, Attack, activate systems, or otherwise act without a pilot. While operating it, you spend your own Actions to control the chassis. The mech does not inherit your personal Skills, Dodge bonuses, Step, movement abilities, or other biological benefits unless a feature specifically says otherwise. Size Does Matter: Your mech''s Level equals your permanent Gear Head Rank, ignoring temporary bonuses from gear, Spells, or other effects. Whenever your permanent Gear Head Rank increases, advance the mech as though it had gained enough Pet Levels to reach that Level, including normal Pet Stat increases and Health Bar progression. Any mech ability that would normally have Rank = Floor Number instead uses Rank = your permanent Gear Head Rank. Pets normally gain three Stat Points per Level, increase their Health Bar as they Level, and ordinarily use Floor Number as the Rank of their abilities. At Gear Head 15, the mech may gain a normal Pet Level-15 benefit, suitably reflavoured as a major chassis upgrade. I Built It, I Can Drive It: Use Gear Head instead of Driving, Riding, or another vehicle-control Skill when operating your own mech. You may also use Gear Head instead of Repair when repairing your own mech. This substitution applies only to your personal chassis. Knowing exactly which panel to kick on your own death machine does not suddenly make you qualified to repair everyone else''s equipment. Gear Head normally governs custom engines and vehicles, while vehicle upgrades divide naturally between Smithing for armour, Engineering for mounted weapons, and Gear Head for speed and vehicle modifications. Mech Weapons: The chassis has no inherent Weapon Skill. Weapons must be built, purchased, looted, or installed onto the mech. When attacking with a mech-mounted or mech-equipped weapon: Use Gear Head Rank as the Attack Skill Rank. Use either your Intelligence Mod or Dexterity Mod, chosen when the weapon is installed. Use the weapon''s normal damage dice, damage type, range, upgrades, and other effects. Mounted Weapons are normally constructed using Engineering. Separate Loadout: Your equipment and the mech''s equipment are separate. ARmour, weapons, DR, Stat Bonuses, and other equipment worn by the pilot do not automatically affect the chassis. Equipment installed on the chassis does not automatically affect the pilot. Bonuses to your Intelligence, Dexterity, or Gear Head still apply when you personally make a Check using those values. Mana Interface: While piloting the mech, a Spell with Range: Self may target either you or the mech. It never affects both from a single casting. Healing, regeneration, resurrection, biological transformations, and effects that specifically require a living target cannot affect the mech. Construct: The mech is machinery rather than a living creature. It cannot benefit from ordinary healing magic, Healing Potions, biological Regeneration, food, rest, or similar effects. Damage to the chassis must normally be repaired. Effects that specifically require biology do not affect the chassis, but may still affect the pilot. Mech Carrier: Your Class provides a magical carrier capable of storing the unoccupied chassis in your Inventory. Deploying the mech during combat costs 1 Action and requires enough open space for a Size-5 creature. Entering or exiting a stationary mech costs 10 feet of Move. Magical pet carriers already provide a rules precedent for otherwise impossible Inventory storage, and entering a stationary vehicle normally costs 10 feet of Move. Occupant: The mech protects you, but does not magically remove you from reality. Attacks may target either the chassis or the pilot when circumstances allow. Area effects and effects capable of reaching the pilot may affect them normally. The ordinary vehicle rules likewise permit attacks against either a vehicle or its occupants. Catastrophic Failure: When the mech reaches 0% Health Bar, the chassis is wrecked and explodes. Because it is Size 5, the pilot takes: 5d6+F Fire Damage. The mech''s DR does not reduce this damage. This follows the normal vehicle-destruction rule. A destroyed mech leaves behind its Mech Core. Given suitable materials and facilities, an Overcompensating Mechanic can construct a replacement chassis around the recovered core. Exact time and material requirements are determined by the GM based on the damage and available crafting facilities. System AI NOtes: New Class Select: Overcompensating Mechanic. Oh. Oh, I see. Your body wasn''t good enough, so you''ve decided to build another body around it. A much larger body. With armour. And guns. There are several recognized psychological terms for this behavior. I''m going to ignore all of them because this has tremendous ratings potential. Please install an ejection seat. Or don''t. Actually, don''t.</p><table><tbody><tr><th>Prerequisites</th><td>Size Medium (4) or smaller.</td></tr><tr><th>Bonus box</th><td>Silver Earth Box, with a guaranteed Earth Hobby Potion.</td></tr><tr><th>Build points</th><td>30</td></tr></tbody></table><p><strong>Stat bonuses</strong></p><ul><li>+4 Intelligence</li></ul><p><strong>Skill bonuses</strong></p><ul><li>+3 Gear Head</li><li>+3 Engineering</li><li>+2 Smithing</li><li>+1 Salvage</li></ul><p><strong>Benefits</strong></p><ul><li>Goddamn Mech: a custom Size Large (5) Construct chassis, treated as a Utility Pet, with +4 Stat Points and two Utility Pet Special Abilities. (taken twice) <em>(major)</em></li><li>Size Does Matter: the mech''s Level equals your permanent Gear Head Rank, and advances with it. <em>(moderate)</em></li><li>I Built It, I Can Drive It: use Gear Head in place of Driving, Riding or Repair on your own chassis. <em>(moderate)</em></li><li>Mech Carrier: a magical carrier that stores the unoccupied chassis in your Inventory. <em>(minor)</em></li></ul><p><strong>Detriments</strong></p><ul><li>There Is No Dog In Here: the mech takes no Actions of its own and does not inherit your Skills, Dodge bonuses, Step or movement abilities. <em>(2 pt)</em></li><li>Construct: the mech cannot be healed by magic, potions, regeneration, food or rest -- it must be repaired. <em>(2 pt)</em></li><li>Catastrophic Failure: at 0% Health Bar the chassis explodes, dealing 5d6+F Fire damage to the pilot, unreduced by its DR. <em>(1 pt)</em></li></ul><hr><p><em>Source: TheSharp. From <a href="https://pointmongo.com/browse/classes/overcompensating-mechanic">Point Mongo</a>.</em></p>'
