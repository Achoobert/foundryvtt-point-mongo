  description: '<p><em>Small, hairless, expendable laborers of the Syndicate: quick, sneaky and sharp-eared, but easily frightened.</em></p><p>Not to be confused with the Rat-kin common in the early dungeon floors, the ratlings are a species of small, hairless humanoids with beady eyes, keen hearing, and sharp teeth. Their utility has long been recognized by The Syndicate since the colonization of their home world some thousands of cycles ago. Now a species recognized and integrated into the Syndicate, they are often utilized by larger systems governments for dangerous manual labor, orbital manufacturing, and scouting uninhabited planets owing to the ease with which they are replaced.</p><table><tbody><tr><th>Size</th><td>Petite (3)</td></tr></tbody></table><p><strong>Stat bonuses</strong></p><ul><li>+4 dexterity</li><li>-2 strength</li><li>+1 intelligence</li></ul><p><strong>Skill bonuses</strong></p><ul><li>+3 hide in shadows</li><li>+3 move silently</li><li>+2 night vision</li></ul><p><strong>Benefits</strong></p><ul><li>low light vision <em>(minor)</em></li><li>can fit through spaces as if they were small creatures <em>(minor)</em></li><li>advantage on perception checks involving sight or hearing <em>(moderate)</em></li><li>stealth skills grow 10% faster <em>(major)</em></li></ul><p><strong>Detriments</strong></p><ul><li>cowardly - disadvantage on saves against fear effects <em>(2 pt)</em></li></ul><hr><p><em>Source: Community submission — Blankgood. From <a href="https://pointmongo.com/browse/races/ratling">Point Mongo</a>.</em></p>'
