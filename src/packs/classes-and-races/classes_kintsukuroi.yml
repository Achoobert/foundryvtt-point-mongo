system:
  description: '<p><strong>Missing:</strong> Build Point tiers on each benefit</p><p><em>A Barbarian attrition class that deliberately fights near collapse, recording each survived lethal blow as a Golden Scar.</em></p><p>A front-line attrition specialist who deliberately fights near collapse and is permanently reshaped by surviving lethal blows. The crawler gains access to the Cockroach Skill, advances it faster, and records every survival as a ''Golden Scar'' with a specific Buff and Debuff.</p><table><tbody><tr><th>DR</th><td>1</td></tr><tr><th>Prerequisites</th><td>Must have dropped to 0% HB at least once before class selection</td></tr><tr><th>Build points</th><td>32</td></tr></tbody></table><p><strong>Stat bonuses</strong></p><ul><li>+6 Strength</li><li>+3 Constitution</li></ul><p><strong>Skill bonuses</strong></p><ul><li>+2 Endurance</li><li>+1 Intimidate</li><li>+1 Cockroach</li></ul><p><strong>Benefits</strong></p><ul><li>Rage: Your melee attacks deal +1 damage for each Health Bar slot you have lost (major)</li><li>Cockroach Advancement: Advantage on Skill Advancement Checks for the Cockroach Skill. You may continue to mark the Cockroach Skill for advancement up to level 10. (moderate)</li><li>Golden Scar: When the Cockroach Skill succeeds against a hostile Attack that would drop you to 0% Health Bar, gain one Golden Scar matched to that Attack. Each Scar carries its listed Buff and Debuff. You can hold 3 Golden Scars; gaining a fourth replaces your oldest Scar. A Scar lasts until replaced. (epic)</li><li>Scar Table:</li><li>Damage Type | Buff | Debuff | Scar Appearance</li><li>Common:</li><li>Bludgeoning | +2 DR | -5 Move | Golden dents creating deep grooves in your skull, ribs, and limbs.</li><li>Fire | Your first successful attack each round does an extra +1d4 Fire Damage. | If you take an Action during a Combat round but deal no damage, lose 1 Health Bar slot at the end of that round. This cannot trigger Cockroach. | Cracks web across the skin filled with gold that glows softly and moves as if still molten.</li><li>Piercing | Your first Attack each round has Advantage | The first attack targeting you each round has Advantage | Needle-thin golden points where the body was penetrated.</li><li>Poison | The first creature to lose at least 1 HB slot to your Attack each round gains the Poisoned Debuff until the end of its next turn | Your maximum health is reduced by 1 HB slot | Sickly green/black veins trapped inside translucent channels of gold.</li><li>Slashing | All of your Attacks deal +2 Damage | You have -2 DR | Long smooth seams of gold divide the body into sections. A helpful guide if you get caught by a butcher.</li><li>Uncommon:</li><li>Acid | Once per round the damage of one of your attacks is considered Armor-Piercing | -2 DR | Pitted gold gashes that ooze smoking yellow fluid which permanently stains your clothes, just yours.</li><li>Electric | Once per round after a successful Attack take a 10ft Step without spending an Action | If you end a turn in combat without moving at least 10 ft, lost 1 Health Bar slot | Branching golden filaments beneath the skin.</li><li>Force | Once per round after hitting a target push or pull it by 5 feet | Any involuntary Move applied to you moves you an extra 10 feet | Concentric rings of gold hover slightly above the original wound.</li><li>Holy | Once per combat, as an Interrupt, prevent yourself or an ally within 30ft from losing 1d4 Health Bar slots. | Vulnerability to Necrotic damage | Brilliant golden script scrawled around the injury usually taking the form of religious verses reminding you not to masturbate.</li><li>Ice | The first target damaged by your Attack each round suffers -10 Move until the end of its next turn | Vulnerability to bludgeoning | Pale-gold cracks spiderweb out whenever the site of the injury is pressed as though the flesh is brittle</li><li>Necrotic | Once per round whenever your Attack causes the target to lose at least 2 HB slots, heal for 1 | Healing from every other source is reduced by 1 HB slot | Tarnished gold veins pulse through blacked flesh, the eyes of corpses swivel to follow you</li><li>Psychic | Once per round choose a creature you can see, your next Attack or Opposed Skill Check against it has Advantage | The creature''s next Attack or Opposed Skill Check against you also has Advantage, the link is only broken when both bonuses resolve or the scene ends | A golden fracture crosses the skull and over one eye.</li><li>Sonic | Once per round one successful Attack you make gains +5ft Splash | You have disadvantage on Stealth Checks | Golden ripple patterns circle your throat and ears, attacks that hit you produce a different musical note depending on location.</li></ul><p><strong>Detriments</strong></p><ul><li>Scar Vulnerability - Accumulate debuffs through each scar you acquire. <em>(2 pt)</em></li></ul><hr><p><em>Source: Community submission — Kron. From <a href="https://pointmongo.com/browse/classes/kintsukuroi">Point Mongo</a>.</em></p>'
