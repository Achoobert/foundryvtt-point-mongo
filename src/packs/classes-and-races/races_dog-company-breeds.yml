  description: '<p><em>A Dog-only race for companion breeds, all Charisma and comfort, whose presence can steady allies against fear and mind control.</em></p><p>Company breed dogs have a long history with humans, providing comfort and stability for the wild anxious human mind.</p><table><tbody><tr><th>Size</th><td>1-4</td></tr><tr><th>Prerequisites</th><td>This limited Race is only available to crawlers who are already a Dog</td></tr></tbody></table><p><strong>Stat bonuses</strong></p><ul><li>+5 Charisma</li><li>+3 Intelligence</li></ul><p><strong>Skill bonuses</strong></p><ul><li>+1 Bite Attack</li><li>+2 Good First Impression</li><li>+2 Persuasion</li><li>+1 Acute Ears</li></ul><p><strong>Benefits</strong></p><ul><li>Advantage on Scent based rolls (1 pts) <em>(minor)</em></li><li>Advantage on Charisma checks made to influence Human and Human-like creatures <em>(minor)</em></li><li>Once per day, allies in line of sight might ignore one Fear or Mind Control effect. <em>(major)</em></li></ul><p><strong>Detriments</strong></p><ul><li>Minor: -2 Strength</li><li>Minor: Disadvantage on all Social Skills to hide its emotions</li></ul><hr><p><em>Source: Community submission — Gabe M. From <a href="https://pointmongo.com/browse/races/dog-company-breeds">Point Mongo</a>.</em></p>'
