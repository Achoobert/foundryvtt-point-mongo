  description: '<p><em>A sexless, humourless race carved from sentient glaciers: heavy Constitution, immune to cold, and badly vulnerable to fire.</em></p><p>Unlike the Igneous, whose creation was intended for the Dungeon, Glacials are an actual race of people, native to an isolated ice planet in a fringe system. It is said that Glacials are not born, they are carved from Sentient Glaciers, as a means for that glacier to experiment other worlds and places.</p><p>Probably why they are so devoid of humor. Sexless species tend to be that way, I wonder why</p><table><tbody><tr><th>DR</th><td>3</td></tr><tr><th>Build points</th><td>25</td></tr></tbody></table><p><strong>Stat bonuses</strong></p><ul><li>+5 Constitution</li><li>+2 Strength</li><li>+2 Dexterity</li></ul><p><strong>Skill bonuses</strong></p><ul><li>+1 Endurance</li><li>+1 Frost Scar</li></ul><p><strong>Benefits</strong></p><ul><li>Slides: Step +5 <em>(major)</em></li><li>Once per day may grow spikes all over its body that last for one scene. any hand to hand attack deals an additional 1d6 dmg. Anyone Holding a Glacial also take that damage at the cleanup phase <em>(moderate)</em></li><li>Doesn''t need to Breathe. Have no Immunity against inhaled toxins. <em>(moderate)</em></li><li>Immunity to Cold damage <em>(epic)</em></li></ul><p><strong>Detriments</strong></p><ul><li>Vulnerability to Fire Damage <em>(3 pt)</em></li><li>+1 mana cost to all Fire Spells <em>(1 pt)</em></li></ul><hr><p><em>Source: Community submission — Gabe M. From <a href="https://pointmongo.com/browse/races/glacial">Point Mongo</a>.</em></p>'
