name: Viking Raider
type: class
img: icons/svg/combat.svg
folder: vdVnXkhQ0bcs7QUZ
system:
  description: '<p><em>Constitution-based Barbarian class built for brutal melee combat, pillaging, and going berserk.</em></p><p>You are the kind of person who foregoes dressing up in armor or corsets at the Ren Faire and instead don the ancient furs of your Viking ancestors (or so the DNA website claimed, anyhow) despite it being 90+ degrees outside. It gives you a sort of power, a sort of calling, to want to travel out and do as the Vikings did; drink heavily, smash things, steal stuff. ''No'' is also something that isn''t in your vocabulary, and like you did in your toddler years, when you''re denied what you want to do, you have the ability to just go completely apeshit. Go forth, Viking Raider, ruin someone''s day just like you ruined that toy section in the store when you were two.</p><table><tbody><tr><th>DR</th><td>0</td></tr><tr><th>Crafting table</th><td>None</td></tr><tr><th>Bonus box</th><td>Silver Earth Box</td></tr><tr><th>Build points</th><td>30</td></tr></tbody></table><p><strong>Stat bonuses</strong></p><ul><li>+3 Constitution</li><li>+3 Strength</li></ul><p><strong>Skill bonuses</strong></p><ul><li>+3 Berserk Spell</li><li>+3 Shield Crash Skill</li><li>+3 Pillage Skill</li><li>+2 Terrifying Shout Spell</li></ul><p><strong>Benefits</strong></p><ul><li>Gains access to the Desperado Club <em>(minor)</em></li><li>Gain resistance to Ice damage <em>(moderate)</em></li></ul><p><strong>Detriments</strong></p><ul><li>-2 Intelligence <em>(1 pt)</em></li></ul><hr><p><em>Source: Community submission — JackWreckem (Crawler #36320). From <a href="https://pointmongo.com/browse/classes/viking-raider">Point Mongo</a>.</em></p>'
