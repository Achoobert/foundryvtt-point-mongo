  description: '<p><em>You are already one of the cutest rodents on Earth, why would you ever want to change from that? The Red Squirrel''s racial benefits are here for your viewing pleasure.</em></p><p>Red squirrels are tiny woodland rodents native to Earth, best known for climbing trees, hoarding food, violently shaking their tails at perceived threats, and developing lifelong vendettas against bird feeders. Before the Collapse, most people considered them cute. Those people were fucking idiots. A Red Squirrel crawler is an actual squirrel. Not a squirrel-person. Not a tiny furry humanoid with a waistcoat and a rapier. You have four little squirrel legs, claws, a ridiculous tail, and approximately the same upper-body strength as a damp sandwich. Fortunately, what you lack in physical power you make up for in speed, intelligence, climbing ability, and the evolutionary wisdom to immediately run away from anything that looks remotely dangerous. Which is everything. Prerequisites: This limited Race is only available to crawlers who are already squirrels. Size: Tiny (1); Animal. You are very small. This is occasionally an advantage and frequently a reminder that most of the dungeon could kill you by accidentally sitting down. +7 Dexterity. Squirrels can change direction in midair, sprint along branches barely wider than their paws, and descend trees headfirst. Humans invented parkour and somehow expected applause. +6 Intelligence. You remember hundreds of hidden food caches, solve obstacle problems, manipulate objects, and rapidly adapt to environmental changes. Congratulations. The rodent is smarter than several crawlers currently appearing on the Top Ten list. −2 Strength. You weigh roughly as much as a disappointing sandwich. Manage your expectations. +2 Dodge Skill. Predators have been trying to eat your ancestors for approximately thirty-five million years. Natural selection has conducted extensive field testing. Scamper: +5ft Step. Your default response to danger is to suddenly be somewhere else. At higher Dodge Ranks this combines particularly well with the ancient squirrel martial art known as OH SHIT OH SHIT OH SHIT GO GO GO. Tree Rat. You gain a Climb Movement equal to your normal Move and can automatically climb most surfaces without making a Skill Check unless conditions are unusually difficult. Walls are floors, pipes are roads, curtains are ladders. Your party''s carefully planned route through the dungeon is merely a suggestion. Dungeon Eyes: You can see in total darkness. This is particularly useful while travelling through ventilation shafts, abandoned tunnels, ruined buildings, and other places your party will insist you scout because, and I quote, "You''re small enough to fit." Great teamwork. Distracting Floof: Your enormous tail isn''t merely adorable. It is an evolved predator-confusion device that flicks, twists, and changes direction independently of your body, encouraging attackers to focus on several cubic feet of useless hair rather than the important four hundred grams of squirrel underneath it. Add 1d4 to all Evade Checks. Build for Acorns, not Greatswords. You have Disadvantage on Attack Skill Checks using Strength-based Weapon Skills. Somewhere in the dungeon is probably a squirrel-sized greatsword. You should absolutely not use it. Which means, statistically speaking, you''re eventually going to use it. OH FUCK, A CAT! You are Vulnerable to attacks from Cats and other cat-based creatures and take x2 damage from them. Silver Earth Box, with guaranteed Earth Hobby Potion. Enjoy learning Rank 3 Philately. Build Validation: For the GM, the underlying build is: Benefit - BP, Size Tiny - 3, +7 DEX - 7, +6 INT - 6, +2 Dodge - 4, Distracting Flood: +1d4 Evade - 3, +5ft Step - 3, Climb Movement - 3, Total Darkness Vision - 1, Total: 30. The detriments are: -2 Strength +1 BP, Disadvantage with Strength-based Weapon Skills: +2 BP, Cat Vulnerability +2 BP.</p><table><tbody><tr><th>Size</th><td>Tiny (1)</td></tr><tr><th>Prerequisites</th><td>Only available to crawlers who are already squirrels.</td></tr><tr><th>Bonus box</th><td>Silver Earth Box, with a guaranteed Earth Hobby Potion.</td></tr><tr><th>Build points</th><td>30</td></tr></tbody></table><p><strong>Stat bonuses</strong></p><ul><li>+7 Dexterity</li><li>+6 Intelligence</li></ul><p><strong>Skill bonuses</strong></p><ul><li>+2 Dodge</li></ul><p><strong>Benefits</strong></p><ul><li>Size Tiny (1). <em>(major)</em></li><li>Scamper: +5 ft Step. <em>(major)</em></li><li>Tree Rat: Climb Movement equal to your Move, and you can climb most surfaces without a Skill Check. <em>(major)</em></li><li>Distracting Floof: add 1d4 to all Evade Checks. <em>(major)</em></li><li>Dungeon Eyes: you can see in total darkness. <em>(minor)</em></li></ul><p><strong>Detriments</strong></p><ul><li>-2 Strength. <em>(1 pt)</em></li><li>Disadvantage on Attack Skill Checks using Strength-based Weapon Skills. <em>(2 pt)</em></li><li>Vulnerable to cats and cat-based creatures (x2 damage). <em>(2 pt)</em></li></ul><hr><p><em>Source: TheSharp. From <a href="https://pointmongo.com/browse/races/red-squirrel">Point Mongo</a>.</em></p>'
