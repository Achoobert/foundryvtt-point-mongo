  description: '<p><em>Blade-armed, needle-toothed brutes who trade every scrap of charm for strength, toughness and a very sharp bite.</em></p><p>These ugly bastards combine the brutal efficiency of a meat grinder with looks not even a mother could love so you can Finish Them with style.</p><table><tbody><tr><th>Size</th><td>Medium (4)</td></tr></tbody></table><p><strong>Stat bonuses</strong></p><ul><li>+5 strength</li><li>+5 constitution</li><li>+2 dexterity</li><li>-2 intelligence</li><li>-5 charisma</li></ul><p><strong>Skill bonuses</strong></p><ul><li>+3 to Arm Blades Skill</li><li>+3 to Bite attack skill</li><li>+1 Regeneration</li><li>+5 Slasher skill</li></ul><p><strong>Benefits</strong></p><ul><li>darkvision <em>(minor)</em></li><li>resistance to poison and disease <em>(major)</em></li><li>Iron stomach benefit <em>(extreme)</em></li></ul><p><strong>Detriments</strong></p><ul><li>Charisma capped at 10 <em>(10 pt)</em></li><li>+25% mana cost for all spells <em>(5 pt)</em></li><li>10% slower growth in ranged weapon skills <em>(2 pt)</em></li></ul><hr><p><em>Source: Community submission — Blankgood. From <a href="https://pointmongo.com/browse/races/tarkatan">Point Mongo</a>.</em></p>'
