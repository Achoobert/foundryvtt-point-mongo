system:
  description: '<p><em>A Fighter/Paladin class that settles disputes with a warhammer, backed by Apito, a gift for negotiation and a key to every club in the dungeon.</em></p><p>Why settle disputes in a courtroom when you can deliver a legally binding verdict with a warhammer?</p><p>The Attorney at War combines martial prowess, divine magic, and an infuriating talent for negotiation, making them equally formidable in combat and contractual disputes. With access to every professional and social club, you''ll have plenty of opportunities to network and expose liars. Just remember, your firm answers exclusively to Apito, and divine intervention is considerably more expensive than legal representation.</p><p>Now go plead some motherfuckers GUILTY!</p><table><tbody><tr><th>Prerequisites</th><td>have to have passed the bar exam or watched law and order.</td></tr></tbody></table><p><strong>Stat bonuses</strong></p><ul><li>+2 Strength</li><li>+3 Intelligence</li><li>+2 Constitution</li></ul><p><strong>Skill bonuses</strong></p><ul><li>+1 Second Chance</li><li>+1 Shield</li><li>+1 Wisp Armour</li><li>+5 Warhammer</li><li>+1 Paladin''s Smite</li></ul><p><strong>Benefits</strong></p><ul><li>Order in the Court: +1 to the Diplomacy, Detect Lies, Good First Impression, Lore, and Negotiation Skills. <em>(extreme)</em></li><li>Access to all professional and Social Clubs. <em>(moderate)</em></li></ul><p><strong>Detriments</strong></p><ul><li>Must Worship a Deity (Apito) <em>(1 pt)</em></li></ul><hr><p><em>Source: Community submission — Connor MT Dargan. From <a href="https://pointmongo.com/browse/classes/attorney-at-war">Point Mongo</a>.</em></p>'
