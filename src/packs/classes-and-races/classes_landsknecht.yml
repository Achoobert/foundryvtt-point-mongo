  description: '<p><em>Charisma-based Fighter class built around battlefield presence and oversized two-handed weapons.</em></p><p>The Landsknecht is a flamboyant mercenary built around battlefield presence and martial skill. They specialize in wielding oversized, two-handed weapons, and are no strangers to contract work. These famous 16th century foot soldiers were comprised from anyone, from peasants all the way up to nobility. What this means is that even an average nobody like yourself can afford the opportunity to dress like a painted target in the middle of the battlefield! At least the pay is good.</p><table><tbody><tr><th>DR</th><td>0</td></tr><tr><th>Prerequisites</th><td>Must have 3 or more Popularity and at least one two-handed Weapon Skill at Rank 5 or higher.</td></tr><tr><th>Bonus box</th><td>Silver Earth Box</td></tr><tr><th>Build points</th><td>30</td></tr></tbody></table><p><strong>Stat bonuses</strong></p><ul><li>+4 Charisma</li><li>+3 Dexterity</li><li>+3 Strength</li></ul><p><strong>Skill bonuses</strong></p><ul><li>+2 Cut the Payroll Spell</li><li>+2 Blood Price Spell</li><li>+2 Battlefield Presence Spell</li></ul><p><strong>Benefits</strong></p><ul><li>Can access any Weapon Training Guild <em>(moderate)</em></li><li>Can raise two-handed Weapon Skills to Rank 20 <em>(moderate)</em></li><li>Earn 5% interest of your current gold at the start of each floor <em>(major)</em></li><li>Free room in saferooms <em>(minor)</em></li></ul><hr><p><em>Source: Community submission — JackWreckem (Crawler #36320). From <a href="https://pointmongo.com/browse/classes/landsknecht">Point Mongo</a>.</em></p>'
