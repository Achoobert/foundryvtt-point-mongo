  description: '<p><em>Cannibalistic underground dwellers: quick, sneaky, hard to kill, and unable to eat anything but sapient flesh.</em></p><p>CHUD.  Cannibalistic Humanoid Underground Dweller.</p><p>Let''s be real here, you''re already putting the HUD in CHUD. You don''t necessarily have to eat humans ... just something that''s close enough. You feel right at home in the deep dark underground, and have a insatiable appetite for sapient beings.</p><p>This Race gives you all the tools you could need to become the best little meat gnasher you can be.</p><table><tbody><tr><th>Size</th><td>Petite (3)</td></tr><tr><th>DR</th><td>0</td></tr><tr><th>Prerequisites</th><td>Must be a mentally sick mofo</td></tr></tbody></table><p><strong>Stat bonuses</strong></p><ul><li>+2 Strength</li><li>+5 Dexterity</li><li>+1 Constitution</li><li>-2 Charisma</li></ul><p><strong>Skill bonuses</strong></p><ul><li>+1 Acute Ears</li><li>+1 Ambush</li><li>+1 Dodge</li><li>+1 Escape Artist</li><li>+1 Find Crawler</li><li>+1 Hide in Shadows</li></ul><p><strong>Benefits</strong></p><ul><li>+1 Cockroach Skill <em>(extreme)</em></li><li>Rage (Benefit): Your melee attacks deal +1 damage for each Health Bar slot you have lost. <em>(major)</em></li><li>Add 1d4 to your Evade <em>(major)</em></li></ul><p><strong>Detriments</strong></p><ul><li>Cannibalistic Metabolism: You cannot stomach normal food anymore and must sustain yourself on the flesh of Sapient Humanoid Mobs, or other Crawlers. You lose a Health Slot for every day without consuming the flesh, that can only be regained by consuming. <em>(3 pt)</em></li></ul><hr><p><em>Source: Community submission — Connor MT Dargan. From <a href="https://pointmongo.com/browse/races/c-h-u-d">Point Mongo</a>.</em></p>'
