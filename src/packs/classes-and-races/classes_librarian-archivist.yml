system:
  description: '<p><em>Intelligence-based Arcanist that catalogs spells, tracks monster weaknesses, and combines scrolls into spellbooks.</em></p><p>You are the keeper of the books, the catalogers of spells, and the exact kind of anti-social nerd that gets off seeing spreadsheets. You''re the smartest one in the room from all the books you''ve read, and you know. And who''s to judge you anyhow for daring to read that spicy vampire mafia romance novel anyhow! It was for research, RESEARCH I dare say! It has not prevented you whatsoever from being meticulously dedicated to archiving all knowledge, both useful and irrelevant.</p><table><tbody><tr><th>Crafting table</th><td>Tier-1 Writing Table</td></tr><tr><th>Build points</th><td>30</td></tr></tbody></table><p><strong>Stat bonuses</strong></p><ul><li>+4 Intelligence</li><li>+2 Constitution</li></ul><p><strong>Skill bonuses</strong></p><ul><li>+3 Doom Scrolling Spell</li><li>+3 Book Keeper Skill</li><li>+1 Arcane Skill</li><li>+1 Calligraphy Skill</li></ul><p><strong>Benefits</strong></p><ul><li>Gains access to Club Vanquisher <em>(minor)</em></li><li>Book Keeper and Doom Scrolling can be risen to Rank 20 <em>(moderate)</em></li><li>Gains membership to the Dungeon Book of the Floor Club <em>(moderate)</em></li><li>Double mana regeneration while working at a Writing Table <em>(moderate)</em></li><li>Gains access to a Tier-1 Writing Table <em>(minor)</em></li></ul><hr><p><em>Source: Community submission — JackWreckem (Crawler #36320). From <a href="https://pointmongo.com/browse/classes/librarian-archivist">Point Mongo</a>.</em></p>'
