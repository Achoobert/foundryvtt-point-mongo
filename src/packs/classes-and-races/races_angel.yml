system:
  description: '<p><em>Become a champion of the Gods (or their servant, whatever floats your boat) and embrace that holier-than-thou attitude you hide to become one the dungeon''s brightest (literally) races.</em></p><p>You are a holy winged warrior and champion of your god. Congratulations on your new job as a God’s bitch. Let''s hope your new boss is nice to you. Membership in Club Vanquisher, Winged Flight: Limited Flight 3 minutes per scene, Holy Wings: Limb Regeneration but only for your Wings, Religious: +1 to the Religion Skill, I Have Talked To Gods: Can replace INT with CHA for Religion Skill Checks, Holy Light: Can produce a magical light from your wings, Ethereal Beauty: +5 CHA, Holy Warrior: +5 STR, Holy Defense: +5 CON, Demonic Hatred: Disadvantage in social situations when dealing with Demons and Devils, Must Worship a Deity.</p><p><strong>Stat bonuses</strong></p><ul><li>+5 Charisma</li><li>+4 Strength</li><li>+4 Constitution</li></ul><p><strong>Skill bonuses</strong></p><ul><li>+1 Religion</li></ul><p><strong>Benefits</strong></p><ul><li>Membership in Club Vanquisher <em>(minor)</em></li><li>Winged Flight: limited flight, 3 minutes per scene. <em>(major)</em></li><li>Holy Wings: limb regeneration, but only for your wings. (Reduced from Epic due to only affecting wings. <em>(extreme)</em></li><li>I Have Talked To Gods: you may replace Intelligence with Charisma for Religion Skill Checks. <em>(moderate)</em></li><li>Holy Light: you can produce a magical light from your wings. <em>(minor)</em></li></ul><p><strong>Detriments</strong></p><ul><li>Demonic Hatred: Disadvantage in social situations with Demons and Devils.</li><li>Must worship a deity. <em>(1 pt)</em></li></ul><hr><p><em>Source: Hedgemage. From <a href="https://pointmongo.com/browse/races/angel">Point Mongo</a>.</em></p>'
