  description: '<p><em>Strength-based Fighter class built around overwhelming physical force and monstrous stamina.</em></p><p>The Herculean Laborer focuses on overwhelming physical force, monstrous stamina, improvised feats of strength, and turning punishment into proof that they are not finished yet. It''s not just about being strong — it''s about being at their best when facing tasks that would give others pause.</p><table><tbody><tr><th>Bonus box</th><td>Silver Earth Box</td></tr><tr><th>Build points</th><td>30</td></tr></tbody></table><p><strong>Stat bonuses</strong></p><ul><li>+4 Strength</li><li>+4 Constitution</li></ul><p><strong>Skill bonuses</strong></p><ul><li>+3 Hydra Cautery Spell</li><li>+3 Burden Bearer Skill</li><li>+2 Wrasslin'' Skill</li></ul><p><strong>Benefits</strong></p><ul><li>Gain advantage on all Constitution Stat Checks <em>(extreme)</em></li><li>Monster Wrestler - Gain advantage when using Wrasslin'' against creatures one size larger than you. <em>(moderate)</em></li></ul><hr><p><em>Source: Community submission — JackWreckem (Crawler #36320). From <a href="https://pointmongo.com/browse/classes/herculean-laborer">Point Mongo</a>.</em></p>'
