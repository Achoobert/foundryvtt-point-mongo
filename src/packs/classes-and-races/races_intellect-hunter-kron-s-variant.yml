system:
  description: '<p><em>Kron''s take on the corpse-riding brain worm: a scavenger that overclocks rotting bodies and spends them for bursts of damage.</em></p><p>Intellect Hunters are small parasitic aliens that occupy recently dead bodies and drive them as temporary physical shells. The borrowed flesh begins rotting almost immediately, making replacement a constant practical concern. Their crawler form pushes this expendable flesh beyond its safe limits: muscles can be overworked, pain disregarded and remaining structural integrity sacrificed for a burst of violence. A successful hunter knows when to abandon its current body and where another might be found.</p><p>Mordecai describes them as the most common brain-worm species. Their dungeon stereotype emphasizes a scavenger’s practicality and willingness to use up borrowed flesh. An Intellect Hunter may protect its companions and honor its agreements while regarding a battlefield as a source of replacement bodies. The visible deterioration and accompanying smell make reassuring strangers considerably harder.</p><table><tbody><tr><th>Size</th><td>Tiny (1) Unhosted/Variable (1-6) Hosted</td></tr><tr><th>Prerequisites</th><td>Must have been in a party with a crawler who died before Race/Class selection.</td></tr><tr><th>Build points</th><td>30</td></tr></tbody></table><p><strong>Stat bonuses</strong></p><ul><li>+2 Intelligence</li><li>+2 Dexterity</li></ul><p><strong>Skill bonuses</strong></p><ul><li>+1 Investigation</li></ul><p><strong>Benefits</strong></p><ul><li>A Body Required - You begin unhosted (Exposed). To become hosted you must occupy an eligible corpse. The corpse must have been dead no more than 30 hours and have enough intact anatomy to function. Spend one uninterrupted minute in physical contact with the body outside of combat. Adopt the host body''s size, breathing medium, natural weapons, anatomical swim/climb/burrow/flight ability, set your Move and Step to 20/10. Leaving the body voluntarily takes 1 Action. At 0 current HB the body immediately falls apart, ejecting you to an adjacent unoccupied space, and cannot be reused. <em>(epic)</em></li><li>Restorative Takeover - First occupation of a fresh corpse restores ten current and maximum HB slots, each worth your CON. Reentering a used body preserves its damage, decay and sacrificed capacity. <em>(moderate)</em></li><li>Overclocked Flesh - While hosted, gain an Internal Buff of +F Strength and +F Dexterity, additional to your racial bonuses. <em>(epic)</em></li><li>Spend the Body - Once per round, before rolling a physical melee Attack, permanently sacrifice one maximum host HB slot to double that Attack’s final damage if it hits. This costs no Action; misses still consume the slot. Leave at least one maximum slot and reduce current HB if it exceeds the new maximum. Cannot combine with another final-damage multiplier. Healing cannot restore sacrificed capacity. <em>(major)</em></li><li>Dead Nerves - While hosted, ignore Fatigued and ordinary Minor Injury penalties. Track these conditions normally; repeated injuries still escalate, and Major or Long-Term injury penalties still apply. Fatigued follows the worm and its penalties resume when exposed; host-local injuries remain with their flesh. <em>(major)</em></li><li>Your Public - Once per scene, gain +1 Popularity when Spend the Body reduces an enemy to zero HB. Staged harm and practice do not qualify. <em>(moderate)</em></li></ul><p><strong>Detriments</strong></p><ul><li>Carrion Stench - While hosted, suffer Disadvantage on social Checks requiring trust, cooperation or convincing impersonation against creatures within 10 feet that can smell you. Washing, perfume and changing hosts cannot suppress the odor. <em>(1 pt)</em></li><li>Exposed - Without a host, have one HB slot worth CON, breathe air and use 5-foot Move/Step. You can crawl, perceive, use HUD/chat, make nonphysical mental/social Checks and Evade, but cannot use equipment, weapon Attacks or Spells. <em>(2 pt)</em></li><li>Rotting Lease - Each complete 30-hour day after first occupation permanently destroys one maximum host HB slot. The clock continues while unoccupied. Remaining maximum equals 10 − completed host-days − sacrificed slots, minimum zero. Healing restores current HB only to that remaining maximum. Reentry cannot reset decay or sacrifices. Destroyed maximum slots do not count as missing current HB for Rage-like effects. <em>(2 pt)</em></li></ul><hr><p><em>Source: Community submission — Kron. From <a href="https://pointmongo.com/browse/races/intellect-hunter-kron-s-variant">Point Mongo</a>.</em></p>'
