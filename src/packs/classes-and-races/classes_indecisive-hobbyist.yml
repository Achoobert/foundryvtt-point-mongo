system:
  description: '<p><strong>Missing:</strong> stat bonuses, benefits, Build Point costs</p><p><em>Utility class that can learn almost any skill, but levels everything slowly and rarely specializes.</em></p><dl class="stat-block"><dt>Type</dt><dd>Utility</dd></dl><p>Never able to pick a single thing to enjoy, you find yourself perfectly mediocre at literally everything! Underwater basket weaving? You got it! Amateur masseuse? Been there! Competitive cardboard box folding? Well... at least you got a participation ribbon. Inspired by Donut''s class.</p><p>Can gain nearly any skill or ability, but levels them up at 1/10th the normal rate. Has slightly more frequent ability gains, but is limited in how often those gains can be spent on something already improved — forcing a spread of mediocre-but-reliable abilities over a niche powerhouse. Likely relegated to a more utility role, and much more likely to die as a result of the lack of specialization.</p><hr><p><em>Source: Community submission — ApocMora. From <a href="https://pointmongo.com/browse/classes/indecisive-hobbyist">Point Mongo</a>.</em></p>'
