  description: '<p><em>A backwards-footed forest spirit with burning hair, near impossible to track through the woods.</em></p><p>South american legends tell of the Curupira, a trickster spirit, defender of natural spaces. Famous for their fiery hair, with feet turned backwards, they trick and hunt those who destroy the woods, messing up with hunters traps, wood cutters equipment and confusing their minds, getting them lost in the woods.</p><table><tbody><tr><th>Size</th><td>Medium (4)</td></tr></tbody></table><p><strong>Stat bonuses</strong></p><ul><li>+4 Dexterity</li></ul><p><strong>Skill bonuses</strong></p><ul><li>+2 Ambush</li><li>+1 Stealth</li><li>+1 Survival</li><li>+1 Animal Handling</li><li>+1 Find Crawler</li><li>+1 Grand Illusion</li><li>+1 Tripper</li></ul><p><strong>Benefits</strong></p><ul><li>If they so desire, their hair shed light like a torch and can set flammable material in flames <em>(moderate)</em></li><li>Any attempts to track the Curupira are made at Disadvantage <em>(major)</em></li><li>Can traverse natural terrain without skill checks <em>(moderate)</em></li></ul><p><strong>Detriments</strong></p><ul><li>Banned from using Metalworker weapons <em>(2 pt)</em></li></ul><hr><p><em>Source: Community submission — Gabe M. From <a href="https://pointmongo.com/browse/races/curupira">Point Mongo</a>.</em></p>'
