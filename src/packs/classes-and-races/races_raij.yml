  description: '<p><em>A thunder-beast lineage open only to cats: fast, bright, and contractually obliged to worship Taranis.</em></p><p>“Quick as lightning with a cry like thunder, Raijū are the blue-white companions and servants of the god Raijin in your earth mythology. That nerds not down here so they’re stuck with Taranis! If you ever run into the guy he’ll claim to have shaped you out of a thunderstorm himself.”</p><table><tbody><tr><th>Size</th><td>Small (2); Animal</td></tr><tr><th>Prerequisites</th><td>This limited Race is only available to crawlers who are already a Cat, or feline adjacent</td></tr></tbody></table><p><strong>Stat bonuses</strong></p><ul><li>+4 Dexterity</li><li>+4 Intelligence</li><li>2 Strength</li></ul><p><strong>Skill bonuses</strong></p><ul><li>+3 Cat like Reflexes</li><li>+2 Holy Aura</li><li>+2 Lightning Bolt</li><li>+2 Thunderlash</li></ul><p><strong>Benefits</strong></p><ul><li>Resistance to Electrical based attacks <em>(moderate)</em></li></ul><p><strong>Detriments</strong></p><ul><li>Must Worship Taranis <em>(1 pt)</em></li><li>+1 Mana cost to non-Storm Spells (Lightning, sound). Your "Maker" isn''t a fan of the other elements. <em>(1 pt)</em></li></ul><hr><p><em>Source: Community submission — Loop. From <a href="https://pointmongo.com/browse/races/raij">Point Mongo</a>.</em></p>'
