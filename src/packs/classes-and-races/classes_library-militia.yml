  description: '<p><em>A Mage and Rogue who polices the stacks, silences whisperers and reaches the top shelf.</em></p><p>Not satisfied with just keeping the books in line, these denizens of the stacks will also insist on controlling those reading the books. They can silence the most stubborn whisperers, and can easily retrieve and return books from the highest shelves.</p><table><tbody><tr><th>Prerequisites</th><td>Minimum INT 10</td></tr><tr><th>Rank 20</th><td>Research</td></tr><tr><th>Build points</th><td>30</td></tr></tbody></table><p><strong>Stat bonuses</strong></p><ul><li>+4 INT</li></ul><p><strong>Skill bonuses</strong></p><ul><li>+3 Shh! (see spells)</li><li>+2 Astral Hand</li><li>+2 Research</li><li>+2 Calligraphy</li></ul><p><strong>Benefits</strong></p><ul><li>Book of the Floor Club <em>(moderate)</em></li><li>resistant to sonic attacks <em>(moderate)</em></li><li>Advantage on all INT checks <em>(extreme)</em></li></ul><p><strong>Detriments</strong></p><ul><li>-2 CON <em>(1 pt)</em></li></ul><hr><p><em>Source: Community submission — BanzaiZAP. From <a href="https://pointmongo.com/browse/classes/library-militia">Point Mongo</a>.</em></p>'
