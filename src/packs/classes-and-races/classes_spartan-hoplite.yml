system:
  description: '<p><strong>Missing:</strong> Build Point tiers on each benefit</p><p><em>Constitution-based Paladin class built around shield-based defense and holding the line.</em></p><dl class="stat-block"><dt>Type</dt><dd>A Constitution-based Paladin class</dd><dt>Stat Bonus</dt><dd>Con +3, Str +2</dd><dt>Stat Penalty</dt><dd>Dex -2, Int -1</dd></dl><p>The Spartan Hoplite deals mostly with discipline, shield-based defense, and refusing to move when every reasonable instinct says otherwise. A Hoplite is strongest when protecting their allies and anchoring a battle line — elite at turning narrow corridors into very educational stabbing funnels. Their power comes from conviction and training.</p><p><strong>Class Benefits:</strong></p><ul><li>Radiant Tip spell — imbue the tip of your weapon with Radiant damage</li><li>Aegis Flash spell — a flash of light erupts from your shield, disorienting nearby enemies</li><li>Shieldbash skill — slams a target with your shield, sending them backwards</li><li>Spear Brace skill — root yourself in place, using your spear to brace for impact</li><li>+3 to Shield-based skills</li><li>+3 to Spear-based skills</li></ul><table><tbody><tr><th>DR</th><td>3</td></tr><tr><th>Rank 20</th><td>None</td></tr><tr><th>Bonus box</th><td>Silver Earth Box</td></tr><tr><th>Build points</th><td>31</td></tr></tbody></table><p><strong>Stat bonuses</strong></p><ul><li>+3 Constitution (3 Points)</li><li>+3 Strength (3 Points)</li></ul><p><strong>Skill bonuses</strong></p><ul><li>+2 Radiant Tip and Aegis Flash Spells (4 Points)</li><li>+2 Shield Crash Skill (4 Points)</li><li>+2 Shield Block Skill (4 Points)</li><li>+1 Polearm Skill (2 Points)</li><li>+3 DR Buff (6 Points)</li></ul><p><strong>Benefits</strong></p><ul><li>Hoplite Formation Buff: Once per day, give your allies in your party +1 DR if they are standing adjacent to you (3 Points)</li><li>Can gain access to any Weapon Training Guild (2)</li></ul><p><strong>Detriments</strong></p><ul><li>2 Dexterity (+1 Build Point)</li></ul><hr><p><em>Source: Community submission — JackWreckem (Crawler #36320). From <a href="https://pointmongo.com/browse/classes/spartan-hoplite">Point Mongo</a>.</em></p>'
