system:
  description: '<p><em>Constitution-based Paladin class built around shield-based defense and holding the line.</em></p><p>You''re that type of person who feels the need to be shirtless everywhere you go, for any reason, just to show off that rocking bod you carved out of marble in the gym 7 days a week. But you''re more than just some gym bro, you''re an elite fighter, the kind where your younger brother comes to get you to beat up his bullies, and even though you''re outnumbered 10 to 1, you still emerge victorious. You protect what needs protecting, you''ve got an indomitable discipline, and you ask yourself the question, "I wonder how many guys I can beat up just to protect lil'' bro here."</p><p>Their answer is about 300, or so.</p><table><tbody><tr><th>DR</th><td>2</td></tr><tr><th>Bonus box</th><td>Silver Earth Box</td></tr><tr><th>Build points</th><td>30</td></tr></tbody></table><p><strong>Stat bonuses</strong></p><ul><li>+3 Constitution</li><li>+2 Strength</li></ul><p><strong>Skill bonuses</strong></p><ul><li>+2 Radiant Tip Spell</li><li>+2 Aegis Flash Spell</li><li>+2 Shield Crash Skill</li><li>+2 Shield Block Skill</li><li>+1 Polearm Skill</li></ul><p><strong>Benefits</strong></p><ul><li>Hoplite Formation - Once per day, give allies in  your party +1 DR if they are standing adjacent to you for the duration of one Combat. <em>(major)</em></li></ul><hr><p><em>Source: Community submission — JackWreckem (Crawler #36320). From <a href="https://pointmongo.com/browse/classes/spartan-hoplite">Point Mongo</a>.</em></p>'
