  description: '<p><em>A Celtic giant, monstrously strong, at home underwater and cursed with a cap on charm.</em></p><p>In Celtic mythology, Fomorians are a group of malevolent supernatural beings, and considered the most formidable. They are often described as a giant, monstrous, some with animal heads, missing limbs or even darkly beautiful.</p><table><tbody><tr><th>Size</th><td>Large (5)</td></tr><tr><th>DR</th><td>2</td></tr></tbody></table><p><strong>Stat bonuses</strong></p><ul><li>+5 Strength</li><li>+5 Constitution</li></ul><p><strong>Skill bonuses</strong></p><ul><li>+1 to either Bite, Back Claw or Ice Blast Spell (2pts)</li><li>+1 to either Riding, Animal Handling, Smithing or Intimidate (2pts)</li></ul><p><strong>Benefits</strong></p><ul><li>Darkvision (Can see in total darkness) <em>(minor)</em></li><li>Fomorian Curses: Make an Opposed Con+F check against a target within 30ft. On hit, target is Queasy. (3pts) <em>(major)</em></li><li>They come from beneath: can breathe and makes no checks to move underwater <em>(extreme)</em></li><li>May use Con instead of Int for Spells. <em>(moderate)</em></li></ul><p><strong>Detriments</strong></p><ul><li>Charisma is capped at 10 <em>(3 pt)</em></li></ul><hr><p><em>Source: Community submission — Gabe M. From <a href="https://pointmongo.com/browse/races/fomorian">Point Mongo</a>.</em></p>'
