name: Pirate Captain
type: class
img: icons/svg/combat.svg
folder: vdVnXkhQ0bcs7QUZ
system:
  description: '<p><em>Charisma-based Rogue class built around command, intimidation, and finding treasure.</em></p><p>You''re not exactly Blackbeard or Jack Sparrow, but you certainly know how to strike fear into the heart of your enemies while romanticizing what it must''ve been like to survive scurvy and the gallows. While this is now a step beyond stealing packages off people''s porches or downloading music from a less than reputable website, you have all the makings of the great pirates of old. You will be able to make a quick buck through the ancient sacred maritime art of taking things that technically belonged to someone else about five seconds ago.</p><table><tbody><tr><th>DR</th><td>0</td></tr><tr><th>Bonus box</th><td>None</td></tr><tr><th>Build points</th><td>30</td></tr></tbody></table><p><strong>Stat bonuses</strong></p><ul><li>+4 Charisma</li><li>+3 Dexterity</li><li>+2 Strength</li></ul><p><strong>Skill bonuses</strong></p><ul><li>+2 Black Flag Aura Spell</li><li>+2 Blood Price Spell</li><li>+1 Intimidate Skill</li></ul><p><strong>Benefits</strong></p><ul><li>Gain access to the Desperado Club <em>(minor)</em></li><li>Sea Legs - You are unaffected by terrain disadvantages on moving vehicles (like a wagon or ship) <em>(moderate)</em></li><li>Parlay - You may use your Charisma when rolling for Intimidate instead of Strength <em>(moderate)</em></li><li>Buried Treasure - Double the amount of gold you receive from opening loot chests <em>(extreme)</em></li><li>Black Flag Aura can be raised to Rank 20 <em>(minor)</em></li><li>Blood Price can be raised to Rank 20 <em>(minor)</em></li></ul><hr><p><em>Source: Community submission — JackWreckem (Crawler #36320). From <a href="https://pointmongo.com/browse/classes/pirate-captain">Point Mongo</a>.</em></p>'
