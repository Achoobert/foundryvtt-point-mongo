system:
  description: '<p><em>Hold a severed head over your neckflame and borrow its senses, speech and knowledge.</em></p><p>The Dullahead race can use their ability to gain lore and skill access from other peoples heads.</p><p>Bluespark Head</p><p>Intelligence</p><p>Limitations: 1 head per body</p><p>Gain the senses of the head, use this skill in their skills place. Breathe how they breathe. Gain their speech patterns. (if no language is found use yours)</p><p>The head can be separated from the body 10ft x Intelligence Mod before it disconnects.</p><p>With an unopposed check gain limited knowledge based off of the current head. (Knowledge can be lore or limited access to a skill/s)</p><p>Can connect 3x/day.</p><p>UPGRADE</p><p>Rank 5</p><p>Can Connect 5x/day, increase separation base by 25ft, gain Advantage for check, Greater Limits of heads Knowledge. (Some Lore and skill/s)</p><p>Rank 10</p><p>Increase Connection to 8x/day, Increase separation base by 50ft, gain moderate access to Heads history (General lore the head would know and a few skills)</p><p>Rank 15</p><p>Increase connection to 10x/day, increase separation to Int Score, only truly guarded secrets are off limits (outside of Critical Success to learn about the head you learn everything about this head, and gain advantage with the heads skills)</p><table><tbody><tr><th>Category</th><td>Utility</td></tr></tbody></table><hr><p><em>Source: Community submission — Bastionjack. From <a href="https://pointmongo.com/browse/skills/bluespark-head">Point Mongo</a>.</em></p>'
