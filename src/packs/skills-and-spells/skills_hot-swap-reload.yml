  description: '<p><em>A passive skill for gunslingers who would rather swap than reload: switch weapons and the empty one comes back loaded, with Bang Bro on top.</em></p><p>For the crawler who can''t be bothered to reload. Aim. Squeeze. Swap. Repeat.</p><p>Once per combat encounter when you swap your currently held ranged weapon with an empty magazine with any weapon on your hot list, the empty weapon will automatically reload with stock ammo once you swap back to it. The ranged weapon is now ready to go and gains the L5 Bang Bro enchant. The enchant lasts until you empty the magazine or after the 5 minute timer expires, whichever occurs first.</p><table><tbody><tr><th>Category</th><td>Passive</td></tr></tbody></table><hr><p><em>Source: Community submission — Chillboswaggins. From <a href="https://pointmongo.com/browse/skills/hot-swap-reload">Point Mongo</a>.</em></p>'
