system:
  description: '<p><em>Perform for passersby and fill your coffee can with gold, drawing bigger crowds and eventually battling rival buskers.</em></p><p>Use this skill in place of Performance, grants same benefits as Performance, plus: On Success, you command the attention of passersby. The audience is entertained. For every hour you spend Busking, earn 2d10 X CHA gold. The Busking skill comes with a beat up old coffee can.</p><table><tbody><tr><th>Category</th><td>Utility</td></tr><tr><th>Base damage</th><td>N/A</td></tr></tbody></table><hr><p><em>Source: Community submission — Greg Holkan. From <a href="https://pointmongo.com/browse/skills/busking">Point Mongo</a>.</em></p>'
  governingStat: cha
  category: utility
  attackType: ''
  isPassive: false
  range: 60 feet
  cooldown: N/A
  limitations: Requires an Audience. Two Major Fails or one Critical Fail will attract the attention of the local constabulary who will break up your act, and confiscate your earnings. Players must make 1 check per 15 minutes of performance.
  aiFavor: 0
  baseDamage:
    dice: ''
    stat: ''
    damageType: ''
  upgrades:
    - id: 5VCMbcHkK7HmqQMl
      rankThreshold: 5
      description: <p>Every hour played increases crowd size by 1. Crowd size adds to the gold multiplier at the end of the performance. Max crowd size is equal to 1/10 of the Charisma score of the Crawler using this skill.</p>
    - id: DGdoH5YiUMlqRa8p
      rankThreshold: 10
      description: <p>Each additional performer adds to a gold multiplier, beginning with X2. (So 1 extra performer means the Crawler gets a X2, 2 extra performers means the Crawler gets X3, etc.)</p>
    - id: f7VZTZXW7RgEpCRA
      rankThreshold: 15
      description: '<p>Challenge Mode: You can challenge other buskers in their territory. Proceed as if in combat, but with Performance (or Busking) checks in lieu of attacks. Health bar is used to track progress, but does not affect actual health levels. Success gains all the usual gold rewards, plus the Crawler adds the number of opposing buskers to their own gold multiplier.</p>'
