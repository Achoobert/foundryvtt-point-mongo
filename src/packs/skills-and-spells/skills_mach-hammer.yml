  description: '<p><em>A Strength-based ranged attack skill that launches a one-handed hammer and brings it back to your hand.</em></p><p>You accelerate a hammer to a velocity that makes physics file a formal complaint. Make a Mach Hammer Attack Skill Check against the target''s Evade.</p><p>On Success, you hit the target.</p><p>After the Attack resolves, whether it hits or misses, the hammer reverses course and returns to your hand. If you cannot receive the hammer in a free hand, it lands at your feet.</p><table><tbody><tr><th>Category</th><td>Ranged Attack</td></tr><tr><th>Base damage</th><td>1d8 + Str</td></tr></tbody></table><hr><p><em>Source: Community submission — TheSharp. From <a href="https://pointmongo.com/browse/skills/mach-hammer">Point Mongo</a>.</em></p>'
