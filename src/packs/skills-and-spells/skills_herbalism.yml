  description: '<p><em>An INT utility skill for finding, harvesting and brewing with plants, which grows into an Alchemy table and the Flower Power spell.</em></p><p>Herbalism is the study and practice of using whole plants—including leaves, roots, flowers, and bark—for medicinal purposes and health support. Also known as herbology, it relies on the natural active compounds found in plants to help restore balance and promote healing within the body. At Rank 1, adds +1+INT to Unopposed Herbalism Skill Checks. (Uses: Basic Identification, Safe Harvesting, Simple Poultices).</p><table><tbody><tr><th>Category</th><td>Utility</td></tr></tbody></table><hr><p><em>Source: Community submission — BlessedPsycho, Crawler #26,933. From <a href="https://pointmongo.com/browse/skills/herbalism">Point Mongo</a>.</em></p>'
