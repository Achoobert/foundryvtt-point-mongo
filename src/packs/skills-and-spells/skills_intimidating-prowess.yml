system:
  description: '<p><em>A passive/opposed skill that lets critical successes intimidate witnesses, scaling into fear-induced paralysis.</em></p><p>(Passive/Opposed) This skill represents just how intimidating you look doing anything. Whenever you critically succeed on a check (natural 20) you can choose to intimidate another creature who witnessed your power. Roll an Opposed Skill Check (Charisma + Skill Rank) against that creature''s Charisma. On a success, their next check/attack has a -1d6.</p><ul><li>Level 5: This now also triggers whenever you roll a Spectacular Success (10+ above the Difficulty)</li><li>Level 10: Now targets any number of creatures who witnessed your power (roll one check, compare against each opposed creature''s stat)</li><li>Level 15: Instead of a -1d6 to their next check, you can choose to paralyze the target with fear — they are incapable of doing anything but run away from you on their next turn</li></ul><table><tbody><tr><th>Category</th><td>Passive</td></tr></tbody></table><hr><p><em>Source: Community submission — Riley R (Crawler #10268). From <a href="https://pointmongo.com/browse/skills/intimidating-prowess">Point Mongo</a>.</em></p>'
