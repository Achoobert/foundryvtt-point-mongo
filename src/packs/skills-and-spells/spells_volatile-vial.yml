system:
  description: '<p><strong>Needs restat:</strong> numbers predate the published rules and may be misleading.</p><p><em>A Conjuration thrown-acid spell with a cooking mechanic that scales into a splash AoE and a random status debuff.</em></p><p><strong>Level 1:</strong> Conjure an acid vial and toss it at a target. It deals 1d6 bonus damage if the target has exposed skin.</p><p><strong>Level 5:</strong> This now gains an area of effect of up to 10 feet ''splashing'' to other targets nearby. This can friendly fire.</p><p><strong>Level 10:</strong> You can hold this spell for a round ''cooking'' it. If you cook this spell, it deals an additional 1d12 bonus damage.</p><p><strong>Level 15:</strong> Roll a 1d4. Upon hit, Volatile Vial will apply the Bleed (1), Burn (2), Paralyze (3), or Freeze (4) Debuff.</p><p><strong>Level 20:</strong> This now applies all four previous debuffs.</p><table><tbody><tr><th>Base damage</th><td>1d4 + INT</td></tr><tr><th>AI favor</th><td>0</td></tr><tr><th>Limitations</th><td>None</td></tr></tbody></table><hr><p><em>Source: Community submission — JackWreckem (Crawler #36320). From <a href="https://pointmongo.com/browse/spells/volatile-vial">Point Mongo</a>.</em></p>'
  governingStat: int
