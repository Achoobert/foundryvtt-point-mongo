      rankThreshold: 5
      description: <p>Reduce the DR of the target hit by 1 until the end of the next Round.</p>
    - id: ZbNkR9DnDPH2ohqa
      rankThreshold: 10
      description: <p>You can hold this spell for a round 'cooking' it. If you cook this spell, replace the 1d4 for 1d8 in the base damage. Cooking this spell costs 1 Action.</p>
    - id: MmfQ4CMCOfF9FTAY
      rankThreshold: 15
      description: <p>Roll a 1d4. Upon hit, Volatile Vial will apply the Poison, Burned, Paralyzed, or Freeze debuff.</p>
