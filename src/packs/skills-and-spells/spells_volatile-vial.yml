  description: '<p><strong>Needs restat:</strong> numbers predate the published rules and may be misleading.</p><p><em>A Conjuration thrown-acid spell with a cooking mechanic that scales into a splash AoE and a random status debuff.</em></p><p>You conjure an acidic vial and toss it at a target. It deals Poison damage, and additional bonus damage if the target has no Damage Resistance.</p><p>Note: Roll for the base damage + INT again if the target has no DR.</p><table><tbody><tr><th>Base damage</th><td>1d4 + INT</td></tr><tr><th>AI favor</th><td>0</td></tr><tr><th>Limitations</th><td>None</td></tr></tbody></table><hr><p><em>Source: Community submission — JackWreckem (Crawler #36320). From <a href="https://pointmongo.com/browse/spells/volatile-vial">Point Mongo</a>.</em></p>'
