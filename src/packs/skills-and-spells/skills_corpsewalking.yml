system:
  description: '<p><em>Climb inside a dead crawler or mob and wear it, borrowing its body while it slowly rots around you. Governed by Constitution.</em></p><p>Corpse’s Con</p><p>Make an Unopposed check to enter and control the corpse of a dead Crawler or Mob (does not work on bosses).</p><p>Entering a Corpse takes 1 min.</p><p>While Corpse Walking, you use the body''s current Strength, Dexterity and Constitution, but your own Intelligence and Charisma (might be modified at GM’s discretion).</p><p>Anyone examining your name tag will see the name, race, class and level of the dead corpse owner.</p><p>Healing magic has no effect on the corpse.</p><p>Every 30 hours you stay at the corpse, make another Unopposed Corpsewalking check. On a failure, the corpse decays to the next tier. On a success, you stifle the decomposition till the next day. After 3 days, the corpse moves one tier even on a success</p><p>Tier 1: No Penalty</p><p>Tier 2: -1 to DEX, CON and DR. Body is stiff and leaking</p><p>Tier 3: -2 to DEX and CON, DR is halved. Flesh is soft and breaking down</p><p>Tier 4: -5 to DEX, CON and STR, no DR, all Charisma checks are made at Disadvantage. Visually rotten.</p><p>Tier 5: Unusable.</p><table><tbody><tr><th>Category</th><td>Utility</td></tr></tbody></table><hr><p><em>Source: Community submission — Gabe M. From <a href="https://pointmongo.com/browse/skills/corpsewalking">Point Mongo</a>.</em></p>'
