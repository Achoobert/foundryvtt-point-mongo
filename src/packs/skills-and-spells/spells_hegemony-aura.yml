  description: '<p><em>An aura granting nearby allies +1 DR while stripping 1 DR from nearby enemies.</em></p><p>You exert your magical presence over the surrounding area.</p><p>All allies within the aura gain +1 DR.</p><p>All enemies within the aura suffer -1 DR, to a minimum of 0.</p><p>The effect ends immediately for a creature that leaves the aura and resumes if it enters the aura again while the Spell remains active.</p><hr><p><em>Source: Community submission — TheSharp. From <a href="https://pointmongo.com/browse/spells/hegemony-aura">Point Mongo</a>.</em></p>'
