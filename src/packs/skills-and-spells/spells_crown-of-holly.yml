  description: '<p><strong>Needs restat:</strong> numbers predate the published rules and may be misleading.</p><p><em>A free utility aura that damages attackers with nature magic and eventually roots or poisons them.</em></p><p>You don a magical Crown of Holly on your head, creating a 30ft aura of protection for you. When you take damage from an enemy within that aura, the Crown of Holly lashes out with nature magic, dealing damage in return to them.</p><p>Damage done by this aura is Armor-Piercing.</p><table><tbody><tr><th>Limitations</th><td>You may only activate this Aura once per combat.</td></tr></tbody></table><hr><p><em>Source: Community submission — JackWreckem (Crawler #36320). From <a href="https://pointmongo.com/browse/spells/crown-of-holly">Point Mongo</a>.</em></p>'
