system:
  description: '<p><strong>Needs restat:</strong> numbers predate the published rules and may be misleading.</p><p><strong>Missing:</strong> governing stat</p><p><em>An attack skill that punishes a missed melee attack with a guaranteed counter-slash, later usable against ranged and reflected spells.</em></p><p>When you successfully evade an enemy''s attack within 5ft, you can reposition to the target''s side or back and slash at them for a guaranteed hit with your currently equipped weapon.</p><p>If multiple targets are within melee range attacking you, you may choose 1 to attack back with Counterstroke. You may not reposition to an already occupied spot.</p><p>Note: You must declare that you are going to use an Action for Counterstroke before rolling to Evade (Evade + Counterstroke = 2 Actions). If the conditions for Counterstroke are not met (as in Evade is not used first), your 2nd Action to use Counterstroke is refunded, as Counterstroke can only be done if you use Evade first.</p><table><tbody><tr><th>Base damage</th><td>Based off your currently equipped weapon</td></tr><tr><th>AI favor</th><td>0</td></tr><tr><th>Limitations</th><td>You must successfully use Evade before using this skill.</td></tr></tbody></table><hr><p><em>Source: Community submission — JackWreckem (Crawler #36320). From <a href="https://pointmongo.com/browse/spells/counterstroke">Point Mongo</a>.</em></p>'
