  description: '<p><strong>Missing:</strong> skill category, governing stat, Rank 5/10/15 upgrades</p><p><em>An affinity for narrow waterways and canals, derived from a real leisurely British pastime.</em></p><p>You have an affinity for narrow waterways, especially canals. Not sure how many canals you''ll see down here in the World Dungeon, but if you do, you will find it very interesting. Gongoozling is the leisurely British pastime of watching activity on canals, such as passing narrowboats, locks opening, and wildlife. Derived from 19th-century Lincolnshire dialect meaning to stare, a "gongoozler" observes without participating — a relaxing, often meditative hobby popular along UK waterways, sometimes jokingly compared to trainspotting.</p><hr><p><em>Source: Community submission — Rijken (Crawler #17193). From <a href="https://pointmongo.com/browse/skills/gongoozling">Point Mongo</a>.</em></p>'
