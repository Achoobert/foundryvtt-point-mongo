  description: '<p><strong>Missing:</strong> base damage</p><p><em>Move a distant object by moving a similar one in your hand: a pebble for a boulder, a doll for a mob. It does no damage itself, so get creative.</em></p><p>Manipulating a local object can affect a distant object. These objects must be similar, like using a small rock to manipulate a boulder, or a doll to manipulate a mob. The caster must have line of sight to the target object. The target has a maximum size of 4, but a living target with STR 10 can resist. This does not do direct damage to the target, so get creative.</p><table><tbody><tr><th>Limitations</th><td>Line of sight, size 4 or less, STR 10 to resist</td></tr></tbody></table><hr><p><em>Source: Community submission — BanzaiZAP. From <a href="https://pointmongo.com/browse/spells/spooky-action-at-a-distance">Point Mongo</a>.</em></p>'
