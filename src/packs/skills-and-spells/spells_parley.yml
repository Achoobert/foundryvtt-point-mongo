  description: '<p><strong>Needs restat:</strong> numbers predate the published rules and may be misleading.</p><p><strong>Missing:</strong> type (Attack or Passive), governing stat, range, Rank 5/10/15 upgrades</p><p><em>A utility negotiation skill that can end a fight with an intelligent mob and eventually guarantees favorable terms.</em></p><p><strong>Type:</strong> Utility Skill · <strong>AoE:</strong> 1 mob · <strong>Duration:</strong> Instant · <strong>Cost:</strong> 0 MP · <strong>Limitation:</strong> intelligent mobs only, not usable against crawlers</p><p>Lv1: convince a target to pause fighting for 1 round of negotiation (fails against higher-Charisma mobs/bosses). Lv5: can end the fight peacefully in exchange for concessions from one side. Lv10: negotiation window +1 round. Lv15: ending a fight this way without a kill guarantees the caster a reward from the former enemy. Lv20: temporarily doubles Charisma while negotiating.</p><hr><p><em>Source: Community submission — JackWreckem (Crawler #36320). From <a href="https://pointmongo.com/browse/spells/parley">Point Mongo</a>.</em></p>'
