system:
  description: '<p><em>Turns a male target''s anatomy into a hundred pounds of tungsten, pinning him in place, and worse if he fails badly.</em></p><p>The Target makes a STR save to avoid this effect. Failure means the target’s scrotum and testes turn into 100lbs (DC 10+F) of tungsten steel for one hour.</p><p>Once transmuted, the target makes another, immediate STR save or he is immobilized until he makes a successful save. If successful, then the target is at half movement and has only one hand to use.</p><p>If the target “Major Fails” or “Crit Fails” any of these saves then the scrotum is ripped off and the target takes 4D6 RIP (force) damage. There is no save for half for this damage (IYKYK).</p><table><tbody><tr><th>Base damage</th><td>none</td></tr><tr><th>Limitations</th><td>Female Mobs and Crawlers are immune to this spell</td></tr></tbody></table><hr><p><em>Source: Community submission — Riksheare. From <a href="https://pointmongo.com/browse/spells/tungsten-ballsack">Point Mongo</a>.</em></p>'
