  description: '<p><strong>Missing:</strong> type (Attack or Passive), governing stat, range, Rank 5/10/15 upgrades</p><p><em>Buff/debuff aura that steadies allies'' focus and can shut down enemy aggression at higher levels.</em></p><dl class="stat-block"><dt>Type</dt><dd>Buff / Debuff</dd><dt>Area of Effect</dt><dd>15''</dd><dt>Duration</dt><dd>Constant, or until de-activated</dd><dt>Cost</dt><dd>20 mana</dd></dl><p>Allies within the area of effect receive a calming buff, increasing focus and reducing the effects of fear, terror, and similar emotional debuffs. Players receive a +3 to "Emotional Damage" checks.</p><ul><li>Level 5: Area of effect is doubled (30'')</li><li>Level 10: Players receive a +6 to their check. Enemy mobs within the aura receive the "fuck it" debuff and stop attacking (a DC 13 Constitution Save will negate)</li><li>Level 15: Area of effect is doubled again (60'') and enemies receive a -6 to their "Emotional Damage" check</li></ul><hr><p><em>Source: Community submission — Orion Kannan (Crawler #7729). From <a href="https://pointmongo.com/browse/spells/aura-of-calm">Point Mongo</a>.</em></p>'
