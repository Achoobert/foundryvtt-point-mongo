  description: '<p><strong>Missing:</strong> type (Attack or Passive), governing stat, range, Rank 5/10/15 upgrades</p><p><em>A passive grappling skill letting the caster take down creatures larger than themselves, scaling to full suplex capability.</em></p><p><strong>Type:</strong> Passive Skill · <strong>Limitation:</strong> only against larger targets</p><p>Lv1: can grapple targets bigger than the caster, as long as their Constitution isn''t more than double the caster''s Strength. Lv5: flipping a larger target stuns it for 1 round. Lv10: can pin a larger target for 2 rounds (caster can''t attack while pinning). Lv15: grapple threshold rises to triple Strength. Lv20: can pick up larger targets for a full suplex.</p><hr><p><em>Source: Community submission — JackWreckem (Crawler #36320). From <a href="https://pointmongo.com/browse/spells/monster-wrestler">Point Mongo</a>.</em></p>'
