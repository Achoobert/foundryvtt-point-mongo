name: Fursona
type: spell
img: icons/svg/explosion.svg
folder: YWvCHgnBVolBDj0q
system:
  description: '<p><strong>Missing:</strong> range</p><p><em>Shapeshift into a beast, either a tough Protector Fur or a clawing Rending Fur, that grows with the floor and later learns to swim and fly.</em></p><p>Your body shifts, your gear is absorbed and you turn into one of 2 options: Protector Fur or Rending Fur</p><p>Protector Fur: you gain DR = Floor, you may use the Catcher skill at Rank = Floor and gain a natural Strength attack at [Rank = Floor Number] that deals 1d6 + STR Mod damage. Add another d6 at Rank 5, 10, and 15.</p><p>Rending Fur: You may use the Double Tap skill at Rank = Floor and gain a natural Strength or Dexterity attack at [Rank = Floor Number] that deals 1d8 + Floor + STR or DEX Mod damage. Add another d8 at Rank 5, 10, and 15.</p><table><tbody><tr><th>Limitations</th><td>While under the effects of this spell, you are considered a Quadruped. You still have access to your inventory and Hotbar, but any items you were wearing or holding when this is cast is melded with your new Fursona. You may not cast spells while in your Fursona.</td></tr></tbody></table><hr><p><em>Source: Community submission — Gabe M. From <a href="https://pointmongo.com/browse/spells/fursona">Point Mongo</a>.</em></p>'
