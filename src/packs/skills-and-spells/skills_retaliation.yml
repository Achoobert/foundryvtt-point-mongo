system:
  description: '<p><strong>Needs restat:</strong> numbers predate the published rules and may be misleading.</p><p><strong>Missing:</strong> governing stat</p><p><em>A reactive attack skill that mirrors incoming damage back at the attacker, scaling into healing and bonus damage against bosses.</em></p><p>After being damaged from an attack within melee range, you strike back with your weapon at your opponent to deal an equal amount of damage to them as they did to you. Bosses will take half damage, rounded down.</p><p>Damage Note: Damage is equal to the damage you have just taken, and the damage type is equal to your currently equipped weapon. If no weapon is equipped, it will be based off your Unarmed Combat skill.</p><p>Warning: This skill does not activate if damage is something avoided, and cannot be used in conjunction with the Catcher skill until Rank 10.</p><p>Warning: You cannot retaliate if you die or are put into the Dying state.</p><table><tbody><tr><th>Category</th><td>Melee Attack</td></tr><tr><th>Base damage</th><td>See Description</td></tr></tbody></table><hr><p><em>Source: Community submission — JackWreckem. From <a href="https://pointmongo.com/browse/skills/retaliation">Point Mongo</a>.</em></p>'
