  description: '<p><em>Rips every hair off the target at once. The hairless are immune; the very hairy suffer more.</em></p><p>When this spell is cast, the target instantly has all of his or her hair removed by being yanked out. Targets with no hair are immune to this spell.</p><p>((Note: these are inspired by the Tik-Tok animator Punky Doodles. Only the names of the "spells" are taken from his animatics. All mechanics and rules applied are mine. There is a 5E version of these spells floating around the internet. That''s mine too.))</p><table><tbody><tr><th>Base damage</th><td>1d8+Int</td></tr><tr><th>Limitations</th><td>Beings with A LOT of hair take 1d10+INT damage</td></tr></tbody></table><hr><p><em>Source: Community submission — Riksheare. From <a href="https://pointmongo.com/browse/spells/instant-brazilian-wax">Point Mongo</a>.</em></p>'
