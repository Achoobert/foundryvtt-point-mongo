  description: '<p><strong>Needs restat:</strong> numbers predate the published rules and may be misleading.</p><p><em>A free utility aura granting allies bonus damage and eventually fear immunity and passive healing.</em></p><p><strong>Level 1:</strong> Turn on an Aura of Battlefield Presence. Allies will deal +1d4 more damage to enemies, and you are more likely to be targeted by enemies. It can be turned off at will.</p><p><strong>Level 5:</strong> Allies in your aura gain half their normal movement speed extra while in your aura.</p><p><strong>Level 10:</strong> Increase your Constitution by +5 while this aura is active.</p><p><strong>Level 15:</strong> You and your allies become immune to Fear effects while your aura is active.</p><p><strong>Level 20:</strong> Allies in your aura heal 10% of their max health each Round they end in your aura.</p><table><tbody><tr><th>Base damage</th><td>n/a</td></tr><tr><th>AI favor</th><td>0</td></tr><tr><th>Limitations</th><td>None.</td></tr></tbody></table><hr><p><em>Source: Community submission — JackWreckem (Crawler #36320). From <a href="https://pointmongo.com/browse/spells/battlefield-presence">Point Mongo</a>.</em></p>'
