  description: '<p><em>A Strength-based melee attack skill that tears gold off the target as you hit them.</em></p><p><strong>Level 1:</strong> Rend the target with an Axe, stealing 5 gold X your Strength.</p><p><strong>Level 5:</strong> Pillage applies the Rend debuff, making them take additional Bleed damage a Round until they heal.</p><p><strong>Level 10:</strong> The Rend debuff is replaced by the Deep Wounds debuff. The Deep Wounds debuff makes them take severe Bleed damage each Round until they''re healed to 100%.</p><p><strong>Level 15:</strong> If your target contains more gold than their highest stat, Pillage deals double damage.</p><p><strong>Level 20:</strong> Pillage steals one random equipped armor piece off the target. Non-magical armor is taken before magical armor.</p><table><tbody><tr><th>Category</th><td>Melee Attack</td></tr><tr><th>Base damage</th><td>1d6 + STR</td></tr></tbody></table><hr><p><em>Source: Community submission — JackWreckem. From <a href="https://pointmongo.com/browse/skills/pillage">Point Mongo</a>.</em></p>'
