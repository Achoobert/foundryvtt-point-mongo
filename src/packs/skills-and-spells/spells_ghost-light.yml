  description: '<p><strong>Needs restat:</strong> numbers predate the published rules and may be misleading.</p><p><strong>Missing:</strong> type (Attack or Passive), governing stat, range, Rank 5/10/15 upgrades</p><p><em>A cantrip that summons an invisible, one-way light source giving a small party full visibility in the dark.</em></p><p>This handy little cantrip summons an invisible light source that provides visibility to the designated party, up to 5 creatures / castor level, which allows them to see their surroundings as though standing in full daylight, without offering any visibility to creatures not affected by this spell. This focal point of this spell can be placed either on any inanimate object and carried with the party or on an animate creature as a focal point. If party members stray outside the 60'' radius they find themselves suddenly in the dark. This spell is great for Crawlers laying in ambush, or rogues looking to make a sneak attack while scouting in dark, dangerous places.</p><hr><p><em>Source: Community submission — DeaDPaN79 (Crawler #1945). From <a href="https://pointmongo.com/browse/spells/ghost-light">Point Mongo</a>.</em></p>'
