  description: '<p><strong>Needs restat:</strong> numbers predate the published rules and may be misleading.</p><p><em>A free attack skill delivering a guaranteed double-damage strike from a sheathed sword before combat begins.</em></p><p>Your honed reflexes allow you to act before you have the chance to think. You swiftly draw your sword to attack, closing the distance between you and your target.</p><p>You are able to move up to 10 feet in a straight line to attack your target within a melee range. This movement does not affect your Move or Step.</p><table><tbody><tr><th>Category</th><td>Melee Attack</td></tr><tr><th>Base damage</th><td>1d12 + DEX</td></tr></tbody></table><hr><p><em>Source: Community submission — JackWreckem. From <a href="https://pointmongo.com/browse/skills/iaijutsu-draw">Point Mongo</a>.</em></p>'
