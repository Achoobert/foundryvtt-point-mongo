  description: '<p><strong>Needs restat:</strong> numbers predate the published rules and may be misleading.</p><p><em>A free utility aura that frightens enemies and eventually turns fresh corpses into a temporary crew.</em></p><p>You raise the Black Flag, activating a 30ft aura around you that strikes fear into your opponents. Enemies with Charisma less than your own will be inflicted with the Terrified debuff for 1 Round. On the following round, enemies with Charisma less than your own will be inflicted with the Slow debuff for 1 Round.</p><table><tbody><tr><th>Base damage</th><td>n/a</td></tr><tr><th>AI favor</th><td>0</td></tr><tr><th>Limitations</th><td>You may only activate this Aura once per combat.</td></tr></tbody></table><hr><p><em>Source: Community submission — JackWreckem (Crawler #36320). From <a href="https://pointmongo.com/browse/spells/black-flag">Point Mongo</a>.</em></p>'
