      rankThreshold: 5
      description: <p>The structure is as sturdy as stone (+10 base health). It can support up to 4 Medium creatures simultaneously without collapsing.</p>
    - id: hDMWnpOnrfqMijOX
      rankThreshold: 10
      description: <p>The duration increases to 1 day. The structure is as sturdy as iron (+10 base health) and can support up to 8 Medium creatures.</p>
    - id: Fo9PJJsYlzjF7HD4
      rankThreshold: 15
      description: <p>The duration increases to 1 week. You may use a Large corpse to create a structure twice the normal size (e.g., a double-width bridge or a wall twice as high).</p>
