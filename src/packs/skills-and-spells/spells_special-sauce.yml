  description: '<p><em>Turns any meal into magic: whoever eats it is Full and heals over the next minute. Governed by Intelligence.</em></p><p>Is your food too bland? Has your Bopca been slacking on the job? Are you tired of the same, boring sausage and egg sandwich every day?</p><p>Fear not, for deliciousness is on its way.</p><p>Special Sauce gives your food that je ne sais quoi it has been missing. Apply this spell to any food substance and imbue it with magical power. Food that has been given the Special Sauce gives its consumer the Full status AND grants d4+int healing over 1 minute.</p><hr><p><em>Source: Community submission — Blankgood. From <a href="https://pointmongo.com/browse/spells/special-sauce">Point Mongo</a>.</em></p>'
