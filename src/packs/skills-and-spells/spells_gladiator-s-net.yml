  description: '<p><strong>Needs restat:</strong> numbers predate the published rules and may be misleading.</p><p><em>A Conjuration net spell that pins a target in place, escalating into a barbed, silencing, unbreakable snare.</em></p><p>You conjure forth a Gladiator''s Net, casting it out to ensnare target Medium (4) or smaller size and pin them to either a floor or wall. They are able to destroy the net by cutting it, but cannot otherwise attack. They will still be able to cast Spells.</p><table><tbody><tr><th>Base damage</th><td>None</td></tr><tr><th>Limitations</th><td>None</td></tr></tbody></table><hr><p><em>Source: Community submission — JackWreckem (Crawler #36320). From <a href="https://pointmongo.com/browse/spells/gladiator-s-net">Point Mongo</a>.</em></p>'
