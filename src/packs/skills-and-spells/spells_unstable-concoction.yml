name: Unstable Concoction
type: spell
img: icons/svg/explosion.svg
folder: YWvCHgnBVolBDj0q
system:
  description: '<p><strong>Needs restat:</strong> numbers predate the published rules and may be misleading.</p><p><em>A Conjuration thrown-explosive spell with a risky ''cooking'' mechanic and potion-fueled scaling damage.</em></p><p><strong>Level 1:</strong> Conjure an unstable vial and toss it at a target. It explodes, dealing damage to everything within a 10-foot radius.</p><p><strong>Level 5:</strong> This can now ignite gas-based attacks, dealing 2d6 bonus damage to anyone caught in it.</p><p><strong>Level 10:</strong> You can hold this spell for a round ''cooking'' it. If you cook this spell, it deals an additional 1d12 bonus damage.</p><p><strong>Level 15:</strong> The target struck by this spell is coated in a napalm like substance, hard to remove by normal means. This burns the target for 3 Rounds.</p><p><strong>Level 20:</strong> You can add potions from your inventory to a cooking Unstable Concoction. For each potion added, add an extra 1d6 damage to it. WARNING: If your Explosives Handling is not up to snuff, it can go off in your hand.</p><table><tbody><tr><th>Base damage</th><td>1d10 + INT</td></tr><tr><th>AI favor</th><td>0</td></tr><tr><th>Limitations</th><td>None</td></tr></tbody></table><hr><p><em>Source: Community submission — JackWreckem (Crawler #36320). From <a href="https://pointmongo.com/browse/spells/unstable-concoction">Point Mongo</a>.</em></p>'
