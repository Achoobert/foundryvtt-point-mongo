  description: '<p><em>Make a target''s bones sprout piercing spurs that leave it bleeding, or turn a skeleton into a spiky hazard for anyone who hits it.</em></p><p>You cause the target''s bones to rapidly sprout pointed outgrowths that pierce flesh and inflict bleeding. Interestingly, for skeletons this serves to inflict damage on their attackers (equal to spell''s base damage) for one round of combat.</p><p>Obviously this does not work if the target lacks bones.</p><table><tbody><tr><th>Base damage</th><td>1d4 + INT</td></tr></tbody></table><hr><p><em>Source: Community submission — Blankgood. From <a href="https://pointmongo.com/browse/spells/exostosis">Point Mongo</a>.</em></p>'
