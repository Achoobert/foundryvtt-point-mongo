  description: '<p><strong>Needs restat:</strong> numbers predate the published rules and may be misleading.</p><p><strong>Missing:</strong> type (Attack or Passive), governing stat, range, Rank 5/10/15 upgrades</p><p><em>An Evocation area spell that ensnares creatures in retracting steel manacle chains, escalating to a massive glowing-hot cube.</em></p><p>When cast steel manacle chains erupt from the ground to ensnare any caught in the 10x10x10'' area of effect. Manacles affix themselves to every available appendage of all target creatures that fail their evade checks (Dex), and begin to slowly retract towards the ground, effectively trapping them in place. The size of the affected area increases per spell level.</p><p>Level 5 is a 50x50x50'' cube. Creatures that move through the area of the spell must make successful evade checks or be ensnared. Ensnared creatures may spend an action to attempt to break the chains with a successful STR check vs the castor level.</p><p>Level 10 is a 100x100x100'' cube. Creatures in Lock down must also save vs paralysis for the duration.</p><p>Level 15 is a 1000x1000X1000'' cube - capable of affecting vast swaths of a battlefield. The chains also begin to glow red hot, causing 1d8 heat damage per round.</p><p>A field of enemies ensnared by Lockdown looks like a NSFW game of dungeon twister!</p><hr><p><em>Source: Community submission — DeaDPaN79 (Crawler #1945). From <a href="https://pointmongo.com/browse/spells/lock-down">Point Mongo</a>.</em></p>'
