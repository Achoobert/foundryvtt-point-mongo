  description: '<p><em>Mix a mean cocktail: potions and poisons you brew yourself hit 10% harder, with double batches and a bottomless glass at higher ranks.</em></p><p>Knows how to mix a good cocktail. +10% bonus to potion / poison buff or debuff. For example, if a potion gives +10% constitution, a potion brewed with the Bartender skill would raise the buff to 20%.</p><table><tbody><tr><th>Category</th><td>Passive</td></tr></tbody></table><hr><p><em>Source: Community submission — Jay (Crawler #221). From <a href="https://pointmongo.com/browse/skills/bartender">Point Mongo</a>.</em></p>'
