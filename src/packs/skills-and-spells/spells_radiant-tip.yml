system:
  description: '<p><strong>Needs restat:</strong> numbers predate the published rules and may be misleading.</p><p><em>An Abjuration weapon buff dealing bonus radiant damage, escalating to armor-piercing marks and guaranteed hits.</em></p><p><strong>Level 1:</strong> Imbue a weapon of yours with Radiant magic, allowing it to deal a bonus 1d6 Radiant damage to an Attack Skill.</p><p><strong>Level 5:</strong> The bonus Radiant damage can flash through armor, still dealing damage even though the target may block it.</p><p><strong>Level 10:</strong> The target is marked by a glowing light. An attack by you or your ally is guaranteed to hit this marked target.</p><p><strong>Level 15:</strong> The target struck by this spell now becomes Blind for 1 Round.</p><p><strong>Level 20:</strong> The target struck by this spell becomes Transfixed for 1 Round, reducing its movement and weakening its next Attack or Spell.</p><table><tbody><tr><th>Base damage</th><td>1d6</td></tr><tr><th>AI favor</th><td>0</td></tr><tr><th>Limitations</th><td>Can only be cast on a weapon that deals Piercing damage.</td></tr></tbody></table><hr><p><em>Source: Community submission — JackWreckem (Crawler #36320). From <a href="https://pointmongo.com/browse/spells/radiant-tip">Point Mongo</a>.</em></p>'
  governingStat: cha
  manaCost: 10
