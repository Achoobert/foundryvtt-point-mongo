      rankThreshold: 5
      description: <p>Your weapon now glows, creating a light source for you for the duration. The light source is equal to that of a torch.</p>
    - id: Rw9N6s7pag0XhSYh
      rankThreshold: 10
      description: <p>The bonus Holy damage can flash through armor and guard, still dealing the bonus damage even if the attack will have otherwise been unsuccessful. The bonus damage from this becomes Armor-Piercing.</p>
    - id: H1BD0LtSkiFrtFHv
      rankThreshold: 15
      description: <p>The target struck by this enchantment gains the Blinded debuff for 1 Round.</p>
