  description: '<p><strong>Missing:</strong> type (Attack or Passive), governing stat, range, Rank 5/10/15 upgrades</p><p><em>A passive skill boosting the caster''s carrying capacity and mitigating damage while catching or hauling heavy loads.</em></p><p><strong>Level 1:</strong> When it comes to using your muscles, you are physically stronger than others at your Strength level. You are able to carry, push, and pull objects heavier than no more than twice your Strength.</p><p><strong>Level 5:</strong> While using the Catcher Interrupt Action, reduce the damage you take by 1d6.</p><p><strong>Level 10:</strong> You are now able to carry, push, and pull objects heavier than no more than triple your Strength</p><p><strong>Level 15:</strong> While carrying something more than twice your own weight, gain +5 Strength and +5 Constitution.</p><p><strong>Level 20:</strong> While using the Catcher Interrupt Action, you now reduce the damage you take by half, and take no damage if it does 6 or less damage.</p><hr><p><em>Source: Community submission — JackWreckem (Crawler #36320). From <a href="https://pointmongo.com/browse/spells/burden-bearer">Point Mongo</a>.</em></p>'
