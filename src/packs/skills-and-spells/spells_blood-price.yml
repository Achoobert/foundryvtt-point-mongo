  description: '<p><strong>Needs restat:</strong> numbers predate the published rules and may be misleading.</p><p><em>A Transmutation bounty spell that heals and pays out gold to whoever kills a marked target.</em></p><p>Mark a single Crawler, Mob, Elite, or Boss and place a blood price on their head. This creates a floating bounty sigil above their head. Anyone who kills the marked target will heal for 30% of their max health.</p><p>Only one bounty sigil can be created by Blood Price at a time.</p><table><tbody><tr><th>Base damage</th><td>n/a</td></tr><tr><th>AI favor</th><td>0</td></tr><tr><th>Limitations</th><td>None.</td></tr></tbody></table><hr><p><em>Source: Community submission — JackWreckem (Crawler #36320). From <a href="https://pointmongo.com/browse/spells/blood-price">Point Mongo</a>.</em></p>'
