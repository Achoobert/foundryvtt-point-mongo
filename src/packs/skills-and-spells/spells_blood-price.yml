system:
  description: '<p><strong>Needs restat:</strong> numbers predate the published rules and may be misleading.</p><p><em>A Transmutation bounty spell that heals and pays out gold to whoever kills a marked target.</em></p><p>Mark a single Crawler, Mob, Elite, or Boss and place a blood price on their head. This creates a floating bounty sigil above their head. Whoever kills this marked target will heal for 10% of their max health.</p><p>You may only have one bounty sigil created by Blood Price on a target at a time.</p><p>Casting this spell at every Rank milestone (Rank 5, 10, 15, 20) increases the healing by an additional 20%.</p><p>Increase the mana cost of this spell by 5 for each Rank milestone.</p><table><tbody><tr><th>Base damage</th><td>n/a</td></tr><tr><th>AI favor</th><td>0</td></tr><tr><th>Limitations</th><td>None.</td></tr></tbody></table><hr><p><em>Source: Community submission — JackWreckem (Crawler #36320). From <a href="https://pointmongo.com/browse/spells/blood-price">Point Mongo</a>.</em></p>'
  governingStat: con
