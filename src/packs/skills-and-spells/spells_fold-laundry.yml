system:
  description: '<p><strong>Needs restat:</strong> numbers predate the published rules and may be misleading.</p><p><strong>Missing:</strong> type (Attack or Passive), governing stat, range, Rank 5/10/15 upgrades</p><p><em>A Transmutation/Evocation utility spell that folds worn items into tidy piles, escalating to folding walls, air, and eventually space itself.</em></p><p>A remnant of an old “knotwork not work” spell intended to tie or untangle strands or cords, this spell’s roots were intended to be repurposed into a utility clothing-folding spell. However, the tagging component of the spell that allows it to identify what qualifies as “laundry” is, well, completely borked. As the spell gains levels, what can be justified as “laundry” expands in such staggering directions that the spell rapidly becomes far too powerful than it has any right to be. The Dungeon AI is fully aware of this issue but does nothing to patch or correct the spell as it''s far too entertaining to inhibit.</p><p><strong>Base Level:</strong> Folds anything that is intended to be worn into a tidy pile. Anything currently wearing the targeted “laundry” is damaged: minor if the material breaks apart (cloth), or severe if their bodies are softer than the "laundry" (like a dungeon-added exoskeleton or heavy plate armor).</p><p><strong>Level 5:</strong> Can target anything that is worn on or about the body, even if it''s not normally something intentionally worn (ie tied up by rope, or indestructible chains? Oof). The more complex the material is, the more twists and bends are required to “fold” it properly.</p><p><strong>Level 10:</strong> Can target anything encompassing the outside of something else. A wall of a room, a door frame, etc.</p><p><strong>Level 15:</strong> Can target the air around a target’s body. Considering air just keeps arriving at the previous “laundry” location, this whips up an ongoing, self-accelerating vortex of folding air. If the air was somehow hardened, or contains some kind of magical effect… chunky salsa. [Level 20]: Can target space itself, folding space to shorten distances. Loud and dangerous when it snaps back. Very hazardous to physical entities within the folded area.</p><hr><p><em>Source: Community submission — Cameronpants (Crawler #6373). From <a href="https://pointmongo.com/browse/spells/fold-laundry">Point Mongo</a>.</em></p>'
