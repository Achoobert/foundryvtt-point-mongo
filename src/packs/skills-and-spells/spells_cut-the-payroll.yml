system:
  description: '<p><strong>Needs restat:</strong> numbers predate the published rules and may be misleading.</p><p><em>An Evocation strike that stuns and eventually turns a boss''s own minions against it.</em></p><p><strong>Level 1:</strong> A powerful strike that, if used against a Crawler or Mob with minions, stuns all of their Minions for 1 Round in awe.</p><p><strong>Level 5:</strong> Gain 25 gold X your Charisma for each minion the target has if they''re hit by this spell.</p><p><strong>Level 10:</strong> De-summon up to half (rounded down) of the target''s minions that are currently active if they''re hit by this spell.</p><p><strong>Level 15:</strong> Turn any remaining active minions of the target against them if they''re hit by this spell. This duration lasts 2 Round.</p><p><strong>Level 20:</strong> If you kill the target with this Spell, any they had minions remaining, you permanently gain control of all of their minions.</p><table><tbody><tr><th>Base damage</th><td>n/a</td></tr><tr><th>AI favor</th><td>0</td></tr><tr><th>Limitations</th><td>This applies to your next Weapon or Unarmed Attack.</td></tr></tbody></table><hr><p><em>Source: Community submission — JackWreckem (Crawler #36320). From <a href="https://pointmongo.com/browse/spells/cut-the-payroll">Point Mongo</a>.</em></p>'
