  description: '<p><strong>Needs restat:</strong> numbers predate the published rules and may be misleading.</p><p><em>An Evocation gas-cloud spell that poisons enemies and expands with level.</em></p><p><strong>Level 1:</strong> Cast a cloud of noxious fumes at a target area. It spreads out in a 15 foot radius.</p><p><strong>Level 5:</strong> Enemy mobs within Noxious Fumes now are Poisoned for 2 Rounds.</p><p><strong>Level 10:</strong> The duration for Noxious Fumes and its Poison is increased to 4 Rounds.</p><p><strong>Level 15:</strong> Noxious Fumes adds the Woozy Debuff as long as an enemy stays inside of it.</p><p><strong>Level 20:</strong> Noxious Fumes can expand to up to 30 Feet.</p><table><tbody><tr><th>Base damage</th><td>1d8 + INT</td></tr><tr><th>AI favor</th><td>0</td></tr><tr><th>Limitations</th><td>None</td></tr></tbody></table><hr><p><em>Source: Community submission — JackWreckem (Crawler #36320). From <a href="https://pointmongo.com/browse/spells/noxious-fumes">Point Mongo</a>.</em></p>'
