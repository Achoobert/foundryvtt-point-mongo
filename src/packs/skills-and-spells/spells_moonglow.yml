  description: '<p><em>A Passive spell that bathes twenty feet in moonlight from a carried item or a floating orb, lasting until the next saferoom or floor.</em></p><p>You an imbue a carried item with the light of the moon.  It provides soft light for a 20ft radius and dim light for a 20ft radius past that.  Alternately create a magical orb of light that follows slightly above and behind you.</p><p>This is a variant on the Torch Spell - CRB Pg 212.</p><hr><p><em>Source: Community submission — DeaDPaN79. From <a href="https://pointmongo.com/browse/spells/moonglow">Point Mongo</a>.</em></p>'
