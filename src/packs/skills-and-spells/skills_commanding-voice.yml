  description: '<p><em>A Strength-based utility skill for establishing authority over crawlers, NPCs and some mobs by voice alone.</em></p><p>Wow! Now that’s saying it with your chest! You have a loud, booming voice that naturally commands attention. You can use your voice to establish authority over other crawlers, NPCs, and some mobs. The more confident and direct the command, the more effective it is. At level 1, only 1 target may be affected.</p><table><tbody><tr><th>Category</th><td>Utility</td></tr></tbody></table><hr><p><em>Source: Community submission — soevil. From <a href="https://pointmongo.com/browse/skills/commanding-voice">Point Mongo</a>.</em></p>'
