  description: '<p><em>Summons a low-level goblin ally who never scales, but whom the galactic audience adores.</em></p><p>Summons a low level goblin who can fight alongside you in the early levels.  But his stats do not scale at all and in later floors becomes more of a cheer leader/ distraction.  Can help with puzzles and traps but if they''re ever attacked immediately gets splattered.</p><p>bonus... the galactic audience LOVES them!  Loves to hear them cheer, loves to see them die , the whole bit.  Crawlers get rewarded for summoning them, especially when they''re not helpful.  And every time the crawlers are in an interview it gets brought up how much effort they spend trying to protect the goblin and to keep up the good work.</p><table><tbody><tr><th>Base damage</th><td>0</td></tr><tr><th>AI favor</th><td>1</td></tr></tbody></table><hr><p><em>Source: Community submission — Alex W. From <a href="https://pointmongo.com/browse/spells/summon-emotional-support-goblin">Point Mongo</a>.</em></p>'
