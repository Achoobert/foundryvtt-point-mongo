  description: '<p><strong>Needs restat:</strong> numbers predate the published rules and may be misleading.</p><p><em>A Conjuration spell that conjures a random unknown scroll the caster must use before any other scrolls.</em></p><p>You conjure a random Scroll of a spell you do not know, but would have the ability to cast if you did know it.</p><p>Warning: You must use the conjured Scroll(s) before any other kind of Scrolls may be used by you. Conjured scrolls cannot be sold.</p><table><tbody><tr><th>Base damage</th><td>None</td></tr><tr><th>Limitations</th><td>You must use Scrolls conjured by this spell before you may use ANY other kind of Scrolls.</td></tr></tbody></table><hr><p><em>Source: Community submission — Myles L (Crawler #26933). From <a href="https://pointmongo.com/browse/spells/doom-scrolling">Point Mongo</a>.</em></p>'
