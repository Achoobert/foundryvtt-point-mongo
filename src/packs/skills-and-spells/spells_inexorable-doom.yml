  description: '<p><em>Marks a target as Doomed, extending the debuffs already afflicting it.</em></p><p>You place a creeping supernatural doom upon the target.</p><p>Make an Inexorable Doom Spell Attack against the target''s Evade.</p><p>On Success, deal 1d4 + Int Necrotic damage and the target gains the Doomed Debuff.</p><p>While Doomed, whenever one of the target''s other Debuffs would expire during Clean-Up, choose one such Debuff and extend its duration by one additional round.</p><table><tbody><tr><th>Base damage</th><td>1d4 + Int</td></tr></tbody></table><hr><p><em>Source: Community submission — TheSharp. From <a href="https://pointmongo.com/browse/spells/inexorable-doom">Point Mongo</a>.</em></p>'
