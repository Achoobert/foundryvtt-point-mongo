system:
  description: '<p><strong>Needs restat:</strong> numbers predate the published rules and may be misleading.</p><p><em>An Abjuration rage spell doubling Strength and Speed while halving Dexterity and Constitution, with kills fueling a growing speed buff.</em></p><p>You enter a berserking state, doubling your Strength and Movement Speed. While berserking, your Dexterity and Constitution are halved. For every Crawler, NPC, or Mob you kill while berserking, your Step is increased by 5 feet during the Berserk state.</p><p>Warning: You must use the Attack Action at least once a Round and are not able to leave Combat while berserking unless there is no one around you remaining, friend or foe. If for any reason you are unable to use the Attack Action, Berserk ends immediately and goes on cooldown.</p><table><tbody><tr><th>Limitations</th><td>This cannot be cancelled early before Rank 5.</td></tr></tbody></table><hr><p><em>Source: Community submission — JackWreckem (Crawler #36320). From <a href="https://pointmongo.com/browse/spells/berserk-spell">Point Mongo</a>.</em></p>'
