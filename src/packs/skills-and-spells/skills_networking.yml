      description: <p>RANK 5 — MUTUAL CONNECTIONS  When you encounter someone, you automatically know whether you share any Contacts with them and, if so, who those mutual Contacts are</p>
    - id: btWTGVRgDnxaJlJF
      rankThreshold: 10
      description: <p>RANK 10 — OPEN TO OPPORTUNITIES  Once per Floor, you may search your Professional Network for a particular type of person, organisation, service or expertise.  Describe what you are looking for.  If one of your Contacts, or one of the connections previously revealed through Professional Network, plausibly matches the request, the GM identifies the most relevant available connection.  This does not</p>
    - id: rQf8H4PCIGaE1D79
      rankThreshold: 15
      description: <p>RANK 15 — I KNOW A GUY  Once per Floor, describe a particular type of person or organisation you need to reach.  If a plausible route exists through your Professional Network, the GM reveals the shortest chain of Contacts connecting you to them.  Knowing the route does not make anyone along that chain Friendly, guarantee an introduction or oblige anybody to help you.</p>
