  description: '<p><strong>Missing:</strong> type (Attack or Passive)</p><p><em>An INT spell that animates every unworn garment and piece of armor nearby to do the caster''s bidding.</em></p><p>Treguna Mekoides Trecorum Satis Dee</p><p>The spell affects any garment or piece of armor not currently in use within a 100 ft sphere originating from the caster. Affected garments will act as if they are being worn and will obey any commands given to them by the caster. Garments and even pieces of the garments may still be torn or destroyed, but if there is any piece still intact, it will continue on with whatever task it has been assigned for the duration of the spell. The spell will last for up to 5 minutes unless the caster’s concentration is disrupted or they are mortally wounded.</p><p>Note: If this spell is cast using the The Great Star of Astoroth, it is cast at Level 15, there is no Mana Cost, and Concentration is not required - the spell will last for the duration or until the Star is removed from the Caster’s person.</p><hr><p><em>Source: Community submission — BlessedPsycho, Crawler #26,933. From <a href="https://pointmongo.com/browse/spells/substitutiary-locomotion">Point Mongo</a>.</em></p>'
