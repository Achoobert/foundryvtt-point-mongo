system:
  description: '<p><strong>Needs restat:</strong> numbers predate the published rules and may be misleading.</p><p><em>An Abjuration spell that flashes light off an equipped shield to disorient enemies, scaling into a full protective shieldwall.</em></p><p><strong>Level 1:</strong> Make a flash of light erupt from your shield. The bright flash temporarily disorients enemies, and you take half damage from the next incoming attack.</p><p><strong>Level 5:</strong> Enemies who see Aegis Flash now become Blinded for 1 Round.</p><p><strong>Level 10:</strong> If an attack fails to connect after Aegis Flash is used, the attacker takes 1d6 Radiant damage.</p><p><strong>Level 15:</strong> Aegis Flash protects you from the next attack hit, absorbing it entirely.</p><p><strong>Level 20:</strong> Aegis Flash erupts to create a shieldwall of Light in front of the caster. This shieldwall will absorb the first 3 attacks, Blinding attackers.</p><table><tbody><tr><th>Base damage</th><td>None</td></tr><tr><th>AI favor</th><td>0</td></tr><tr><th>Limitations</th><td>You must have a Shield equipped to use this.</td></tr></tbody></table><hr><p><em>Source: Community submission — JackWreckem (Crawler #36320). From <a href="https://pointmongo.com/browse/spells/aegis-flash">Point Mongo</a>.</em></p>'
