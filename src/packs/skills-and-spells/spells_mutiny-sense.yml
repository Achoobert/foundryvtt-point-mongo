  description: '<p><strong>Missing:</strong> Mana cost, range</p><p><em>A passive skill that senses incoming betrayal from mobs and minions, eventually preventing it outright against weak-willed foes.</em></p><p><strong>Type:</strong> Passive Skill</p><p>Lv1: sense a mob or minion''s betrayal seconds before it happens. Lv5: also sense mobs/minions betraying their own allies. Lv10: if the caster''s Charisma is more than double an enemy minion''s, it becomes much more likely to betray its master. Lv15: allied minions with less than half the caster''s Charisma cannot betray them. Lv20: instantly tell by observation whether any minion is capable of betrayal.</p><hr><p><em>Source: Community submission — JackWreckem (Crawler #36320). From <a href="https://pointmongo.com/browse/spells/mutiny-sense">Point Mongo</a>.</em></p>'
