  description: '<p><em>All we can really say is be careful playing fetch with your dog with this magical little ball.</em></p><p>This item is bound to the Crawler it was given to.</p><p>10 Charges. Using one charge, simply say the Command Phrase (chosen by the user) while holding the ball, then throw it (Range: 150 feet) where you want to go. Once it lands, you''ll be instantly transported to that location. Once all charges are expended, the Bampf Ball is just a standard stuffed fabric ball.</p><p>Value: 5,000 GP</p><table><tbody><tr><th>Slot</th><td>Accessory</td></tr><tr><th>Type</th><td>Magic Item</td></tr><tr><th>Tier</th><td>Legendary</td></tr><tr><th>Duration</th><td>Instantaneous</td></tr><tr><th>Charges</th><td>10</td></tr><tr><th>Limitations</th><td>10 charges. Once all charges are expended, the Bampf Ball is just a standard stuffed fabric ball.</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>Using one charge, simply say the Command Phrase (chosen by the user) while holding the ball, then throw it (Range: 150 feet) where you want to go. Once it lands, you''ll be instantly transported to that location. Once all charges are expended, the Bampf Ball is just a standard stuffed fabric ball.</li></ul><hr><p><em>Source: Community submission — BlessedPsycho, Myles L., Crawler #26933. From <a href="https://pointmongo.com/browse/loot/bampf-ball">Point Mongo</a>.</em></p>'
