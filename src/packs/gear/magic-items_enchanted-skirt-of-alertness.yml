  description: '<p><em>A reinforced leather battle skirt (not a kilt, let''s be honest) that sharpens your eye for traps and turns a little damage.</em></p><p>Situational Awareness cannot be taught, but here in the Dungeon it can be bestowed by magic.  This supple, reinforced brown leather battle skirt grants its wearer +2 Ranks in the Detect Traps Skill, and +1 DR.  Some men might  balk and call it a kilt, but let''s be honest.  It''s a skirt.  Wear it with pride, it may just save your life Indiana.</p><table><tbody><tr><th>Slot</th><td>Legs</td></tr><tr><th>Type</th><td>Skirt</td></tr><tr><th>Tier</th><td>Gold</td></tr><tr><th>DR</th><td>1</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+2 Detect Trap Skill</li></ul><hr><p><em>Source: Community submission — DeaDPaN79. From <a href="https://pointmongo.com/browse/magic-items/enchanted-skirt-of-alertness">Point Mongo</a>.</em></p>'
