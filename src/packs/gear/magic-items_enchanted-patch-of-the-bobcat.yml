system:
  description: '<p><em>A blue diamond patch, first of a four-piece set, that adds Dexterity and Rope Handling and comes with a very unofficial history of the bobcat''s name.</em></p><p>This is a fleeting item.</p><p>This patch is part of a set. (1 of 4)</p><p>This is a 2", blue, diamond shaped patch with a gold border and the face of a bobcat prominently stitched upon it.</p><p>Most creatures got their common names from their scientific classification, or from butchering what the indigenous folks used to call them before being wiped out. Not the bobcat.</p><p>This critter got its name because two drunk assholes, Bob and Frank, were out one evening and were accosted by a large, spotted feline while pissing on a tree stump. Yes, the same one. Yes, it was splattering everywhere. Anyway, Frank shouts "Bob! Cat!" and Bob replied by dropping dead from alcohol poisoning. He just kept pissing into the air long after he was dead, too.</p><p>Everyone started calling the animal "bobcat" from then on because it was hysterical and pissed Frank off.</p><p>If all four patches are properly stitched into a diamond pattern onto an eligible piece of equipment, their enhancements double.</p><table><tbody><tr><th>Slot</th><td>Accessory</td></tr><tr><th>Type</th><td>Patch</td></tr><tr><th>Tier</th><td>Silver</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+2 Dexterity</li><li>+1 Rope Handling</li></ul><hr><p><em>Source: Community submission — Mr King. From <a href="https://pointmongo.com/browse/magic-items/enchanted-patch-of-the-bobcat">Point Mongo</a>.</em></p>'
