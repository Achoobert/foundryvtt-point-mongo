system:
  description: '<p><em>One half of a paired Gold ring set: while both are worn, each Crawler gains their partner''s highest stat, topped up every floor.</em></p><p>This item pairs with the Ring of the Baddie Bride.</p><p>This item only works if you and another Crawler in your party are wearing both rings. If the rings are removed, the bonuses are lost and must be started again.</p><table><tbody><tr><th>Slot</th><td>Accessory</td></tr><tr><th>Type</th><td>Ring</td></tr><tr><th>Tier</th><td>Gold</td></tr><tr><th>DR</th><td>0</td></tr><tr><th>Duration</th><td>n/a</td></tr><tr><th>Cooldown</th><td>n/a</td></tr><tr><th>Charges</th><td>n/a</td></tr><tr><th>Limitations</th><td>This can only be found in a Gold Matrimony Box. Cheers to the happy couple!</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>Receive +3 of the paired Crawler''s highest stat when you first put this ring on.</li><li>Add an additional +3 of whatever the paired Crawler''s highest stat is at the time the start of every floor.</li></ul><hr><p><em>Source: Community submission — JackWreckem. From <a href="https://pointmongo.com/browse/magical-jewelry/ring-of-the-groovy-groom">Point Mongo</a>.</em></p>'
