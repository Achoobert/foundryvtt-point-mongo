  description: '<p><em>A wide-guarded parrying dagger: +1 Evade, and every dodge against an adjacent foe earns a counterattack.</em></p><p>A slick dagger with a wide hand guard. Made to be used as a parrying weapon.</p><table><tbody><tr><th>Slot</th><td>Hands/Holding</td></tr><tr><th>Type</th><td>Dagger</td></tr><tr><th>Tier</th><td>Gold</td></tr><tr><th>Weapon skill</th><td>Dagger</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+1 to Evade</li><li>When you evade an attack by an adjacent foe, you may take an interrupt action to attack him. If you hit on this attack, add Dex mod to the damage.</li></ul><hr><p><em>Source: Community submission — Gabe M. From <a href="https://pointmongo.com/browse/magical-weapons/parrying-daggers-of-the-vengeful-duelist">Point Mongo</a>.</em></p>'
