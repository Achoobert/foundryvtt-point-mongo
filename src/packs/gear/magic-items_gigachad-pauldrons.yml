  description: '<p><strong>Needs restat:</strong> numbers predate the published rules and may be misleading.</p><p><em>Wearing these makes you look like some plate-wearer from World of Warcraft, but dammit, you worked hard for these pauldrons and they''re absolutely metal.</em></p><p><strong>Type:</strong> Armor (Torso). Its a fact: the level of badassery is directly proportional to the size of your pauldrons. These shoulder pads prove that you are indeed the baddest ass around. You''ll have to stretch to see over them, but they do provide excellent cover. +3 Damage Resistance, Immune to Blast (AoE/Explosion) damage, -2 Perception Checks, Skill (Level 1): For the Emperor! Adds +1 DR per Skill Level to party members. for (CHA mod) rounds duration.</p><table><tbody><tr><th>Slot</th><td>Torso</td></tr><tr><th>Type</th><td>Armor</td></tr><tr><th>DR</th><td>3</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+3 Damage Resistance</li><li>Immune to Blast (AoE / explosion) damage</li><li>-2 Perception Checks</li></ul><hr><p><em>Source: BanzaiZAP. From <a href="https://pointmongo.com/browse/magic-items/gigachad-pauldrons">Point Mongo</a>.</em></p>'
