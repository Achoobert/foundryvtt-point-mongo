system:
  description: '<p><em>The Mobfather''s Platinum submachine gun: a burst at one target or a sweeping cone, with a drum that never runs dry.</em></p><p>This is a classic submachine gun, perfect for gangsters and the leader of the Moblins. It can either fire a stream of bullets at a single target, or can be swept back and forth to cover a cone. The large drum will never run out of bullets, and there is no way to add bullets, so there is no way to use any magic bullets the crawlers my find.</p><p>This weapon is also intelligent and will talk to its owner. Only its owner can hear its voice, but it will make Look for Clues and Perception checks on its own.</p><table><tbody><tr><th>Slot</th><td>Hands/Holding</td></tr><tr><th>Type</th><td>Rifle</td></tr><tr><th>Tier</th><td>Platinum</td></tr><tr><th>Weapon skill</th><td>Rifle</td></tr><tr><th>Damage type</th><td>Piercing</td></tr><tr><th>Charges</th><td>Infinite</td></tr><tr><th>Limitations</th><td>Only uses its own ammo, no magic ammo</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>Hose a Target: 2d6+f Piercing damage, 1d4 bullets hit the target. Roll damage separately.</li><li>Suppressive Fire: covers a cone area. Any target in or entering the cone takes one 2d6+F piercing hit.</li><li>Rolls Look for Clues and Perception automatically and informs only the owner.</li></ul><hr><p><em>Source: Community submission — BanzaiZAP. From <a href="https://pointmongo.com/browse/magical-weapons/tommy-the-gun">Point Mongo</a>.</em></p>'
