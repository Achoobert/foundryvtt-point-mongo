  description: '<p><em>A crocodile-leather vest, meant to be worn open, that adds DR and a little Wrassle.</em></p><p>Dripping with machismo, this vest is made of the soft brown crocodile leather and has brown silk lining. The front of the vest has a hook and eye closure system of gold hooks that can be closed by a leather cord haphazardly woven through it, But let’s be honest, this vest was meant to be worn open.</p><table><tbody><tr><th>Slot</th><td>Torso</td></tr><tr><th>Type</th><td>Vest</td></tr><tr><th>Tier</th><td>Gold</td></tr><tr><th>DR</th><td>1</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+1 Dr</li><li>+1 to the skill Wrassle</li></ul><hr><p><em>Source: Community submission — Xenostitch. From <a href="https://pointmongo.com/browse/magic-items/enchanted-vest-of-the-crocodile-hunter">Point Mongo</a>.</em></p>'
