  description: '<p><em>A fleeting honey pot patch stitched with a line about friendship that toughens Constitution and halves Force damage.</em></p><p>This is a fleeting item.  This small sized upgrade patch depicts a ceramic honey pot. The words "A day without a friend is like a pot without a single drop of honey left inside" are stitched around the border of the patch.  When properly sewn onto an eligible garment this upgrade patch bestows the following benefits: +4 Constitution, Resistance to Force Damage.</p><table><tbody><tr><th>Slot</th><td>Accessory</td></tr><tr><th>Type</th><td>Patch</td></tr><tr><th>Tier</th><td>Gold</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>Resistance to Force damage</li><li>+4 Constitution</li></ul><hr><p><em>Source: Community submission — DeaDPaN79. From <a href="https://pointmongo.com/browse/magic-items/enchanted-upgrade-patch-of-the-uncarved-block">Point Mongo</a>.</em></p>'
