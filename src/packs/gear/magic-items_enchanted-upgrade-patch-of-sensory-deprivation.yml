  description: '<p><em>A fleeting patch of pink fuzzy earmuffs that tunes out every Sonic attack while boosting Dexterity, Charisma and Strength.</em></p><p>This is a fleeting item.  This medium sized round embroidered patch depicts a pair of pink fuzzy earmuffs with rainbows on either side, on  a white background, with a pink border.  When properly sewn onto an eligible garment this enchanted upgrade patch bestows the following benefits: +10% Dexterity, +10% Charisma, +10% Strength, and Immunity to Sonic Damage.</p><table><tbody><tr><th>Slot</th><td>Accessory</td></tr><tr><th>Type</th><td>Patch</td></tr><tr><th>Tier</th><td>Legendary</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+10% Dexterity</li><li>+10% Charisma</li><li>Immunity to Sonic damage</li><li>+10% Strength</li></ul><hr><p><em>Source: Community submission — DeaDPaN79. From <a href="https://pointmongo.com/browse/magic-items/enchanted-upgrade-patch-of-sensory-deprivation">Point Mongo</a>.</em></p>'
