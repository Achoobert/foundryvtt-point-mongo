  description: '<p><em>A toe ring for chatting up short folk, with a little extra Persuasion and the Sup Shortie benefit.</em></p><p>Do you have a type? You want all those cute Gnomish ladies to see the bling you''re rockin but they''re too short to see? Well have I got just the thing for you.</p><p>This Toe Ring gives the "Sup Shortie" Benefit, and +1 Persuasion.</p><p>Now get out there and meet some Desperate Goblin Housewives in your area you single pringle.</p><table><tbody><tr><th>Slot</th><td>Accessory</td></tr><tr><th>Type</th><td>Toe Ring</td></tr><tr><th>Tier</th><td>Silver</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+1 Persuasion</li><li>Sup Shortie: Advantage on Persuasion Rolls against petite or smaller Mobs.</li></ul><hr><p><em>Source: Community submission — Connor MT Dargan. From <a href="https://pointmongo.com/browse/magical-jewelry/toe-ring-of-short-lived-seduction">Point Mongo</a>.</em></p>'
