  description: '<p><em>Bling it with style by wearing your girlfriend''s magical hot pink Crocs in the dungeon.</em></p><p>A pair of electric pink Crocs. +10 to Move. +1 to Evade. Note: The Crocs can be upgraded using Jibbitz. A pair can hold up to 10 Jibbitz. If at least 2 Jibbitz are equipped, double the bonus from the Crocs. Obs.: Jibbitz are those little adornments that can be attached to Crocs. They are Fleeting Items.</p><table><tbody><tr><th>Slot</th><td>Feet</td></tr><tr><th>Type</th><td>Clothing</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+10 Move</li><li>+1 Evade</li><li>Can hold up to 10 Jibbitz; with 2 or more equipped, double the bonuses</li></ul><hr><p><em>Source: Gabe M.. From <a href="https://pointmongo.com/browse/magic-items/crocs-of-scintilating-cinderella">Point Mongo</a>.</em></p>'
