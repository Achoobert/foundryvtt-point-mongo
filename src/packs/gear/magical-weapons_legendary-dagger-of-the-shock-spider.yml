  description: '<p><em>A spider-hilted ebony dagger with garnet eyes: +10% Strength, +5 Intimidate, immunity to electricity and a free Web spell.</em></p><p>This legendary tier dagger is crafted from ebony steel.  The hilt and quillons are forged into the shape of a spindly legged spider.  There are eight small garnets set into the hilt to represent the eyes of the spider. When equipped it bestows the following benefits: +10% Strength, +5 Intimidate Skill, Immunity to Electric damage, Web Spell at Rank 5, on a 10 hour cool down.</p><table><tbody><tr><th>Slot</th><td>Hands/Holding</td></tr><tr><th>Type</th><td>Dagger</td></tr><tr><th>Tier</th><td>Legendary</td></tr><tr><th>Weapon skill</th><td>Dagger</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>Web Spell at Rank 5, no Mana cost, 10 hour cooldown</li><li>+10% Strength</li><li>Immunity to Electric damage</li><li>+5 Intimidate Skill</li></ul><hr><p><em>Source: Community submission — DeaDPaN79. From <a href="https://pointmongo.com/browse/magical-weapons/legendary-dagger-of-the-shock-spider">Point Mongo</a>.</em></p>'
