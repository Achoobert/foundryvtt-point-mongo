  description: '<p><em>A would-be Master Chef''s heavy cleaver: dagger damage with Longsword progression, and now the only thing keeping you from joining its last owner.</em></p><p>A Victorinox 7" Meat Cleaver featuring a hardwood handle.  This kitchen knife was once the beloved tool of a aspiring wanna-be-Master Chef.  Now, their likely dead, and this knife is the only thing keeping you from joining them.  It''s heavy, sharp, and will shear through bone.  Put it to good use!</p><table><tbody><tr><th>Slot</th><td>Hands/Holding</td></tr><tr><th>Type</th><td>Weapon</td></tr><tr><th>Tier</th><td>Bronze</td></tr><tr><th>Weapon skill</th><td>Longsword</td></tr><tr><th>Damage type</th><td>Slashing</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>Due to it''s short blade length it uses the dagger''s base damage stats (1d4+STR) but the Longsword''s skill progression. (At +1d4 dmg 5/10/15)</li></ul><hr><p><em>Source: Community submission — DeaDPaN79. From <a href="https://pointmongo.com/browse/loot/meat-cleaver">Point Mongo</a>.</em></p>'
