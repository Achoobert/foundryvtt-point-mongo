  description: '<p><em>Dark enameled full plate from a temple of Ysalte that resists Force and Holy damage, as long as you worship her.</em></p><p>This dark enameled set of magical Full Plate Armor once belonged to a Temple Guardian of Ysalte, Goddess of Hopelessness and Insanity, more commonly called "The Vinegar Bitch".  It grants Resistance to both Force and Holy Damage.  Crawlers who choose to wear this armor must also choose to worship Ysalte, or risk a smite.</p><table><tbody><tr><th>Slot</th><td>Torso</td></tr><tr><th>Type</th><td>Full Plate Armor</td></tr><tr><th>Tier</th><td>Gold</td></tr><tr><th>DR</th><td>1</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>Resistance to Force damage</li><li>Resistance to Holy damage</li></ul><hr><p><em>Source: Community submission — DeaDPaN79. From <a href="https://pointmongo.com/browse/magic-items/unholy-full-plate-armor-of-ysalte">Point Mongo</a>.</em></p>'
