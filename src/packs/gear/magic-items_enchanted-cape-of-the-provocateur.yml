  description: '<p><em>A crowd-blending grey cape for starting trouble and slipping away from it, with Puddle Jumper for the getaway.</em></p><p>This hooded, full length grey cape is designed to help its wearer blend into the crowd.  When equipped it bestows the following benefits: +3 Incendiary Device Handling Skill, Resistance to Force Damage, and the Puddlejumper Spell at Rank 3 with a 6 hour cooldown.  Perfect for when you need to make a quick get-away from a volatile situation of your own creation.</p><table><tbody><tr><th>Slot</th><td>Accessory</td></tr><tr><th>Type</th><td>Cape</td></tr><tr><th>Tier</th><td>Platinum</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+3 Incendiary Device Handling Skill</li><li>Puddle Jumper Spell at Rank 3, no Mana cost, 6 hour cooldown</li><li>Resistance to Force damage</li></ul><hr><p><em>Source: Community submission — DeaDPaN79. From <a href="https://pointmongo.com/browse/magic-items/enchanted-cape-of-the-provocateur">Point Mongo</a>.</em></p>'
