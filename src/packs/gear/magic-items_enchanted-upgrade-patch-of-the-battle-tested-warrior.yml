  description: '<p><em>A fleeting shield-shaped helm patch, embroidered Strength &amp; Resilience, worth five Strength and four Constitution.</em></p><p>This is a fleeting item.  This medium sized, shield shaped upgrade patch depicts a silver closed faced helm with a chain mail coif on a black background, with a silver border.  When properly sewn onto an eligible garment it bestows the following benefits: +5 Strength, +4 Constitution.  It features the words Strength &amp; Resilience embroidered in silver thread in syndicate standard.</p><table><tbody><tr><th>Slot</th><td>Accessory</td></tr><tr><th>Type</th><td>Patch</td></tr><tr><th>Tier</th><td>Gold</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+5 Strength</li><li>+4 Constitution</li></ul><hr><p><em>Source: Community submission — DeaDPaN79. From <a href="https://pointmongo.com/browse/magic-items/enchanted-upgrade-patch-of-the-battle-tested-warrior">Point Mongo</a>.</em></p>'
