  description: '<p><em>A wavy kris blade, Damascus-patterned, that feels oddly calming in the hand. Whatever it is pointed at feels the exact opposite.</em></p><p>This wicked looking kriss (wavy) bladed dagger features a Damascus patterned blade that emanates a gentle sense of calm to its wielder when held.</p><table><tbody><tr><th>Slot</th><td>Hands/Holding</td></tr><tr><th>Type</th><td>Dagger</td></tr><tr><th>Tier</th><td>Gold</td></tr><tr><th>Weapon skill</th><td>Dagger</td></tr><tr><th>Cooldown</th><td>1 / combat</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+2 Dagger Skill ranks</li><li>Fear - Spell - Level 10 (25'' Rank +10'' Blast Radius) Target a non-Boss Mob of half your level or less. On a standard success, the target it stands its ground, but it loses its Dex Mod for the duration of the combat. On a higher success, it uses two of its Actions during the next round to run away.</li><li>Rank 5: +5ft Blast radius.</li><li>Rank 10: +5ft Blast radius, and on a Critical Hit, the affected creatures gain the Paralyzed Debuff.</li></ul><hr><p><em>Source: Community submission — DeaDPaN79. From <a href="https://pointmongo.com/browse/magical-weapons/enchanted-dagger-of-dread">Point Mongo</a>.</em></p>'
