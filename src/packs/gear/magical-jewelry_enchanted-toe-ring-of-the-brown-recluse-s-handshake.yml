  description: '<p><em>A spider-carved wooden toe ring that poisons everything you hit and casts Web.</em></p><p>This ring looks very much like a chunky wooden toe ring carved into the shape of a spider.  You would think that it would be very uncomfortable to wear and would make walking difficult but once in place it causes no impediment whatsoever, though at times the wearer may feel like a spider is crawling around in their shoe.</p><table><tbody><tr><th>Slot</th><td>Feet</td></tr><tr><th>Type</th><td>Toe Ring</td></tr><tr><th>Tier</th><td>Gold</td></tr><tr><th>Damage type</th><td>Poison</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+3 Dexterity</li><li>Grants the wearer a Rank 5 Web Spell, with a 10-hour cooldown, note every mob killed by poison debuff reduces the cooldown by 30 minutes.</li><li>All physical attacks apply the Poison Debuff. (Ranged Attacks, and spell attacks do not apply the poison debuff)</li></ul><hr><p><em>Source: the Point Mongo community. From <a href="https://pointmongo.com/browse/magical-jewelry/enchanted-toe-ring-of-the-brown-recluse-s-handshake">Point Mongo</a>.</em></p>'
