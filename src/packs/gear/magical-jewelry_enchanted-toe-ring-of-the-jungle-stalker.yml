  description: '<p><em>A vine-carved emerald toe ring for jungle hunters, with Sticky Feet and a better Javelin throw.</em></p><p>This enchanted emerald toe ring is carved with a twisted vine pattern.  When equipped it bestows the following abilities:  Sticky Feet Buff, +3 Javelin Skill.  Once owned by a fearsome Jungle predator, this magical foot jewelry now belongs to you.  Don''t go thinking that this makes you the king of the jungle...I can assure you that you are still very much at the bottom of the food chain.</p><table><tbody><tr><th>Slot</th><td>Accessory</td></tr><tr><th>Type</th><td>Toe Ring</td></tr><tr><th>Tier</th><td>Gold</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>Sticky Feet Buff</li><li>+3 Javelin Skill</li></ul><hr><p><em>Source: Community submission — DeaDPaN79. From <a href="https://pointmongo.com/browse/magical-jewelry/enchanted-toe-ring-of-the-jungle-stalker">Point Mongo</a>.</em></p>'
