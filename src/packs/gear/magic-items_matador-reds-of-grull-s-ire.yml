  description: '<p><em>A red cape with a horse head that grants +10 to three stats, and turns every Grull worshipper against you for good.</em></p><p>This red shoulder cape is adorned with a taxidermied horse head and attracts the aggro of all Grull Worshippers in sight. They will beat you in the name of their Lord without relent. It''s not without its benefits though. High risk, High reward!</p><table><tbody><tr><th>Slot</th><td>Accessory</td></tr><tr><th>Type</th><td>Cape</td></tr><tr><th>Tier</th><td>Platinum</td></tr><tr><th>Limitations</th><td>Grull Worshippers will be aggressive while you wear this, Grull Worshippers deal double damage against you while you wear this, You will not be able to worship Grull if you wear this even once.</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+10 Dexterity</li><li>+10 Constitution</li><li>+10 Strength</li><li>WARNING:</li><li>Grull''s Ire: All worshippers of Grull will be automatically aggressive towards you and deal double damage against you, while you wear this cape. You will also be barred from worshipping Grull even if you remove this item</li></ul><hr><p><em>Source: Community submission — Connor MT Dargan. From <a href="https://pointmongo.com/browse/magic-items/matador-reds-of-grull-s-ire">Point Mongo</a>.</em></p>'
