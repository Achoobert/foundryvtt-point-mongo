  description: '<p><em>A fleeting roadrunner patch that beeps every time you Evade, makes you faster and harder to hit, and gives Canine-type mobs a hard time.</em></p><p>This is a Fleeting Item</p><p>Upgrade Patch. Medium.</p><p>A 5” circular patch. The background is divided in two horizontally: a deep blue on top, and a desert brown on the bottom. In the center, is the image of a cartoon roadrunner, stitched in shades of light blue and purple, with a yellow-orange beak and a series of black circular marks indicating movement where legs should be. There is a white cloud behind the road runner. Every time you use your Evade action, the patch lets out an audible “Beep-beep!” sound.</p><p>If this upgrade patch is affixed to an eligible garment, it will imbue the following upgrades:</p><p>+5 to Evade</p><p>+5 to Movement</p><p>Advantage against Canine-type mobs.</p><p>Deal 10% additional damage against Canine-type mobs.</p><p>Warning: Upgrade patches are Fleeting Items. You may remove them, but they will be destroyed in the process.</p><table><tbody><tr><th>Slot</th><td>Accessory</td></tr><tr><th>Type</th><td>Upgrade Patch</td></tr><tr><th>Tier</th><td>Legendary</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+5 to Evade</li><li>+5 to Movement</li><li>Advantage against Canine-type mobs.</li><li>Deal 10% additional damage against Canine-type mobs.</li></ul><hr><p><em>Source: Community submission — BlessedPsycho, Crawler #26,933. From <a href="https://pointmongo.com/browse/magic-items/beep-beep-patch">Point Mongo</a>.</em></p>'
