system:
  description: '<p><em>A toe ring that grows you an extra toe, so you can wear another ring and everyone assumes the AI made you.</em></p><p>Have you ever looked at a picture and noticed that it had more fingers than it should and so you thought to yourself, "well obviously this was made by ai." That''s what this toe ring does, it gives you an extra toe and now people think you are a product of the ai.</p><p>Also you have an extra toe so you can wear an extra toe ring. This might also be helpful if you have trouble counting past twenty.</p><table><tbody><tr><th>Slot</th><td>Accessory</td></tr><tr><th>Type</th><td>Toe Ring</td></tr><tr><th>Limitations</th><td>This item may not be traded or transferred</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>Your dot appears as a neutral NPC on crawler maps instead of as a crawler</li><li>You gain one extra equipment slot for toe rings</li><li>You can count one number higher</li><li>All loot boxes now have a 1% chance of containing a polydactyly toe ring per toe ring equipped</li></ul><hr><p><em>Source: Community submission — Ben D. From <a href="https://pointmongo.com/browse/magical-jewelry/polydactyly-toe-ring">Point Mongo</a>.</em></p>'
