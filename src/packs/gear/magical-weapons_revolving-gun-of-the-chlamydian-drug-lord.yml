system:
  description: '<p><em>A eucalyptus-infused six-shooter from the Drop Bear drug lords, loading poison rounds and the odd case of Ultra Chlamydia.</em></p><p>The Pinnacle of ingenuity of the Drop Bear drug lords. A 6 shooter revolver infused with the very eucalyptus the fuzzy bogans are high on every second of their damn life.</p><p>Every 6 hours this Gun infuses bullets loaded with an additional 1d2 of poison damage.</p><p>Also has a teeny tiny chance of inflicting your target with the venereal disease they are genetically born with: Ultra Chlamydia.</p><table><tbody><tr><th>Slot</th><td>Hands/Holding</td></tr><tr><th>Type</th><td>Handgun</td></tr><tr><th>Tier</th><td>Platinum</td></tr><tr><th>Weapon skill</th><td>Handgun</td></tr><tr><th>Damage type</th><td>Poison</td></tr><tr><th>Cooldown</th><td>6 Hours</td></tr><tr><th>Charges</th><td>6</td></tr><tr><th>Limitations</th><td>Takes 6 hours to recharge after poison bullets run out.</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+1 Handgun</li><li>Adds Poison Damage to Bullets with a 6 hour cool down.</li><li>5% chance to inflict the target with the Ultra Chlamydia debuff</li><li>Ultra Chlamydia: target loses an action on its turns for the duration and takes 1xF Necrotic Damage per round. Lasts for 10xF rounds</li></ul><hr><p><em>Source: Community submission — Connor MT Dargan. From <a href="https://pointmongo.com/browse/magical-weapons/revolving-gun-of-the-chlamydian-drug-lord">Point Mongo</a>.</em></p>'
