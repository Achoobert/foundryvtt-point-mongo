system:
  description: '<p><em>A soda that heals and restores mana, and gets its hooks into you a little more with every can.</em></p><p>It''s Highly Addictive!</p><p>Item Type: Consumable</p><p>Rarity: Uncommon</p><p>Value: 500 Gold</p><p>Made on the planet Wormulon, it contains all natural ingredients!</p><p>Instantly restores 2 Health Bar Slots and 15 mana.</p><p>Warning: Each time you consume a can of Slurm, you will receive the Shakes Debuff: You have a −1 penalty on all Checks and your Move is halved. Stackable. Duration: 30 minutes. If you consume another can of Slurm before this debuff wears off, the penalty doubles. After the third can of Slurm consumed before the debuff wears off, you will receive the Addicted Debuff: You make all your Checks with Disadvantage. Duration: 1 hour.</p><table><tbody><tr><th>Slot</th><td>N/A</td></tr><tr><th>Type</th><td>Consumable</td></tr><tr><th>Tier</th><td>Silver</td></tr><tr><th>Cooldown</th><td>30</td></tr><tr><th>Limitations</th><td>Highly addictive</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>Instantly restores 2 Health Bar Slots and 15 mana.</li><li>Warning: Each time you consume a can of Slurm, you will receive the Shakes Debuff: You have a −1 penalty on all Checks and your Move is halved. Stackable. Duration: 30 minutes.</li><li>If you consume another can of Slurm before this debuff wears off, the penalty doubles.</li><li>After the third can of Slurm consumed before the debuff wears off, you will receive the Addicted Debuff: You make all your Checks with Disadvantage. Duration: 1 hour.</li></ul><hr><p><em>Source: Community submission — BlessedPsycho, Crawler #26933. From <a href="https://pointmongo.com/browse/potions/slurm">Point Mongo</a>.</em></p>'
