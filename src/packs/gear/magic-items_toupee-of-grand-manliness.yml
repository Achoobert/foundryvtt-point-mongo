  description: '<p><em>A luxurious mullet wig, business up front and a party in the back, that boosts Constitution, Charisma and mana for the man wearing it.</em></p><p>This is the ideal headgear for a Televangelist or Bard. It appears as the most elegant and luxurious Mullet: Business up front and a party in the back. It can be removed for easy cleaning. The wearer gets a boost to Constitution, Charisma and Mana regeneration, and their head is kept snug and warm in any conditions.</p><table><tbody><tr><th>Slot</th><td>Head</td></tr><tr><th>Type</th><td>Wig</td></tr><tr><th>Tier</th><td>Platinum</td></tr><tr><th>Limitations</th><td>Only worn by Male characters</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+10 CON</li><li>+10 CHA</li><li>+2 Mana recovered per Round</li><li>Immune to Cold Environment</li></ul><hr><p><em>Source: Community submission — BanzaiZAP. From <a href="https://pointmongo.com/browse/magic-items/toupee-of-grand-manliness">Point Mongo</a>.</em></p>'
