  description: '<p><em>A yam-sized figurine that transforms into a full-size pleasure craft on command — more a rallying symbol among crawlers than a mere item.</em></p><p><strong>Type:</strong> Figurine of Wondrous Power</p><p>Speaking its trigger word (ZELDAAUTIST) instantly transforms this yam-sized item into a full-size pleasure craft, letting the party sail to distant lands before the level collapses. Comes with its own NPC captain who has a rational disdain for glitter. Rumored to have an upgraded Sparkle Yam Yacht variant. More than an object, it''s become a symbol that unites crawlers and offers them shelter — we are all the Yam Yacht.</p><table><tbody><tr><th>Slot</th><td>N/A</td></tr><tr><th>Type</th><td>Figurine</td></tr><tr><th>Tier</th><td>Celestial</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>Manifests into a full size pleasure craft Yacht able to transport hundreds of Crawlers.</li></ul><hr><p><em>Source: Community submission — DeaDPaN79 (Crawler #1945). From <a href="https://pointmongo.com/browse/loot/the-yam-yacht-celestial">Point Mongo</a>.</em></p>'
