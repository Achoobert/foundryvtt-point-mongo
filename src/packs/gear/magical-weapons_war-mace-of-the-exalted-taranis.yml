  description: '<p><em>A thunder god''s holy flanged mace that casts Thunderlash, Shield and Heal Others for free, provided its wielder takes up the worship of Taranis.</em></p><p>Once bestowed upon a high ranking member of his clergy by Taranis, god of Thunder, this oak and iron flanged weapon of war crackles and sparks with ambient electricity.  It bestows a number of buffs and spells, but it''s wielder must choose to worship Taranis, or risk a smite for daring to use the holy weapon.  Wielders who chose to follow Taranis are immediately promoted to Devotees of his faith.  (CRB Pg 168)</p><table><tbody><tr><th>Slot</th><td>Hands/Holding</td></tr><tr><th>Type</th><td>Mace</td></tr><tr><th>Tier</th><td>Celestial</td></tr><tr><th>Weapon skill</th><td>Club</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>Thunderlash Spell at Rank 6, no Mana cost, 12 hour cooldown</li><li>Shield Spell at Rank 6, no Mana cost, 12 hour cooldown</li><li>Iron Skin Buff</li><li>Recovery Buff</li><li>Heal Others Spell at Rank 6, no Mana cost, 12 hour cooldown</li></ul><hr><p><em>Source: Community submission — DeaDPaN79. From <a href="https://pointmongo.com/browse/magical-weapons/war-mace-of-the-exalted-taranis">Point Mongo</a>.</em></p>'
