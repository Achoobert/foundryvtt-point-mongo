system:
  description: '<p><em>A milk crate of 25 throwable vinyl records that take a head clean off on a critical hit.</em></p><p>This is a beat up red milk crate full of old vinyl LPs from bands you have never heard of, but that sound vaguely familiar. The crate holds 25 LPs. Each LP can be hurled as a thrown weapon. These have an expanded crit range (19-20) and if the attack crits, the target is decapitated. Otherwise, the LPs do 1d8+DEX damage.</p><table><tbody><tr><th>Slot</th><td>Hands/Holding</td></tr><tr><th>Type</th><td>Record</td></tr><tr><th>Tier</th><td>Gold</td></tr><tr><th>Damage type</th><td>Slashing</td></tr><tr><th>Charges</th><td>25</td></tr><tr><th>Limitations</th><td>These are vinyl records, and thus they are fragile. They are consumed upon use, dropping them ruins them, and if they are hit before they are used they will automatically break.</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>Expanded Crit Range (19-20)</li><li>1d8+DEX Slashing Damage</li><li>On a Crit, The Target is Decapitated</li></ul><hr><p><em>Source: Community submission — Greg Holkan. From <a href="https://pointmongo.com/browse/magic-items/crate-of-vorpal-lps">Point Mongo</a>.</em></p>'
