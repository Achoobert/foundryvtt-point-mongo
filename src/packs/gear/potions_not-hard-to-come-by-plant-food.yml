  description: '<p><em>A glowing red-and-green brew that wards off poison, coats a blade in it, or turns a houseplant into your own Vine Creeper.</em></p><p>A round bottle filled with a thick, glowing, red-and-green, multi-functional liquid!! Tastes like green apple flavoring and iron…</p><table><tbody><tr><th>Slot</th><td>N/A</td></tr><tr><th>Type</th><td>Potion</td></tr><tr><th>Tier</th><td>Gold</td></tr><tr><th>Duration</th><td>Varies</td></tr><tr><th>Charges</th><td>1</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>Crawlers who drink this potion gain immunity to Poison Damage for the next 5 minutes.</li><li>If the potion is applied to weapons, those weapons deal an additional +1d6 Poison Damage for the next 10 minutes.</li><li>If the potion is poured over a plant, it will be instantly transformed into a Vine Creeper minion for you for (Herbalism Rank+F) Minutes.</li></ul><hr><p><em>Source: Community submission — BlessedPsycho, Crawler #26,933. From <a href="https://pointmongo.com/browse/potions/not-hard-to-come-by-plant-food">Point Mongo</a>.</em></p>'
