  description: '<p><em>A deeply disturbing cape of Clurichaun hide that toughens its wearer and, once a floor, flips a coin on who gets the Taint.</em></p><p>The most disturbing shit you’ve ever seen, this cape is made from the hide of an unfortunate Unvaccinated Clurichaun Rev-Up Consultant. +2 to CON. Once per floor you may activate this cape. Flip a coin: on heads the nearest red dot is inflicted with the taint, on tails you are inflicted with the taint.</p><table><tbody><tr><th>Slot</th><td>Accessory</td></tr><tr><th>Type</th><td>Cape</td></tr><tr><th>Tier</th><td>Silver</td></tr><tr><th>DR</th><td>0</td></tr><tr><th>Cooldown</th><td>Coin flip 1/floor</td></tr><tr><th>Limitations</th><td>You must have con 5+ to wear.</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+2 con</li><li>Taint coin flip</li></ul><hr><p><em>Source: Community submission — Cass. From <a href="https://pointmongo.com/browse/magic-items/clurichaun-hide-cape">Point Mongo</a>.</em></p>'
