  description: '<p><em>A thick, wide-bladed Silver dagger that grants +2 Strength, with no Charisma penalty attached.</em></p><p>This enchanted dagger has a thick, wide blade, and a leather wrapped handle.  When equipped it bestows the following benefits: +2 Strength.  While not as popular as the more widely known items of Ogre, or Giant Strength, this silver tier dagger is still a great weapon for a low level Crawler early in the Dungeon.  Just be happy it doesn''t also impose a Charisma penalty.</p><table><tbody><tr><th>Slot</th><td>Hands/Holding</td></tr><tr><th>Type</th><td>Dagger</td></tr><tr><th>Tier</th><td>Silver</td></tr><tr><th>Weapon skill</th><td>Dagger</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+2 Strength</li></ul><hr><p><em>Source: Community submission — DeaDPaN79. From <a href="https://pointmongo.com/browse/magical-weapons/dagger-of-hobgoblin-strength">Point Mongo</a>.</em></p>'
