  description: '<p><em>A rune-lit dagger granting +10% Charisma, Strength and Constitution plus Safe Fall, for almost anything short of a feral god.</em></p><p>The blade of this legendary tier weapon is covered in faintly glowing mystic runes.  When equipped it bestows the following benefits: +10% Charisma, +10% Strength, +10% Constitution, and the Safe Fall Buff.  A handy item to have in any situation, this weapon raises the Crawler''s level of preparedness for almost anything the World Dungeon can throw at them, short of perhaps a rampaging feral god.  Good luck with that, Crawler!</p><table><tbody><tr><th>Slot</th><td>Hands/Holding</td></tr><tr><th>Type</th><td>Dagger</td></tr><tr><th>Tier</th><td>Legendary</td></tr><tr><th>Weapon skill</th><td>Dagger</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+10% Charisma</li><li>+10% Strength</li><li>+10% Constitution</li><li>Safe Fall Buff</li></ul><hr><p><em>Source: Community submission — DeaDPaN79. From <a href="https://pointmongo.com/browse/magical-weapons/legendary-dagger-of-preparedness">Point Mongo</a>.</em></p>'
