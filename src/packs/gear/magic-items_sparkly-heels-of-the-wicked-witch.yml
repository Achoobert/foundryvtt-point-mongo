  description: '<p><em>Cherry-red glitter heels that click you, and anyone touching you, home to the nearest saferoom once every 30 hours.</em></p><p>These shoes have been through some difficult times, and still retain their signature glittery shine. These shoes have an almond toe, a sensible heel, and a dainty bow - all covered in cherry red glitter. Instantly recognizable, you probably know exactly what these shoes will do.</p><p>All you have to do is click your heels three times...</p><table><tbody><tr><th>Slot</th><td>Feet</td></tr><tr><th>Type</th><td>Shoes</td></tr><tr><th>Tier</th><td>Legendary</td></tr><tr><th>Cooldown</th><td>30 hr</td></tr><tr><th>Limitations</th><td>If you remove these shoes you lose them</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>"There''s No Place Like Home" - Teleport self and those physically touching you to just outside the entrance to the nearest safe room</li></ul><hr><p><em>Source: Community submission — Xenostitch. From <a href="https://pointmongo.com/browse/magic-items/sparkly-heels-of-the-wicked-witch">Point Mongo</a>.</em></p>'
