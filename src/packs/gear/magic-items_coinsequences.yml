  description: '<p><em>A gambler''s wet dream, this magic coin really puts emphasis on "All in" on your next bet.</em></p><p>A large silvery coin. One side depicting the rising sun, the other is ruined, covered in rust and scratches.</p><table><tbody><tr><th>Slot</th><td>Accessory</td></tr><tr><th>Type</th><td>Magic Item</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>Use an Action to Flip the Coin (if used in the hotbar it does not take an Action): If it lands on the Sun side, your next Attack or Utility skill use is an automatic Critical Hit. If it lands on the Ruined side, your next Attack or Utility Skill use is an automatic Critical Fail.</li></ul><hr><p><em>Source: Community submission — Gabe M. From <a href="https://pointmongo.com/browse/magic-items/coinsequences">Point Mongo</a>.</em></p>'
