system:
  description: '<p><em>Summons a pink crystal shield that soaks up damage with its own Health Bar, growing bigger as it ranks up.</em></p><p>Interrupt, Passive</p><p>Mana Cost: 12</p><p>Range: Self</p><p>Duration: 5 minutes</p><p>Cooldown: 30 minutes</p><p>You summon a translucent pink round shield. It features a light blue edge, and a lighter pink, vine-like swirl that encircles the shield. In the center is a rose-like design surrounding a smaller emblem resembling Rose Quartz’ gemstone. It includes 2 pink leather straps on the back to attach to your arm. At Rank 1, the shield is approximately 3’ ft. in diameter.</p><p>The shield reduces all non-magic damage you take. The Shield has 3 Health Bar slots, each with your CON Mod. When you take damage, reduce these Health Bar slots first. The Spell ends early if the shield loses all its Health Bar slots. You can’t heal a Shield.</p><p>UPGRADES</p><p>Rank 5: The Shield has 5 Health Bar slots. The shield also grows up to 4’ in diameter.</p><p>Rank 10: The Shield has 10 Health Bar slots. The shield can now reach up to 6’ in diameter.</p><p>Rank 15: The Shield has 15 Health Bar slots. The shield can now reach up to 10’ in diameter.</p><table><tbody><tr><th>Slot</th><td>Accessory</td></tr><tr><th>Type</th><td>Shield</td></tr><tr><th>Tier</th><td>Gold</td></tr><tr><th>Weapon skill</th><td>Shield Block</td></tr><tr><th>Duration</th><td>5 minutes</td></tr><tr><th>Limitations</th><td>You can’t heal a Shield; The Spell ends early if the shield loses all its Health Bar slots.</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>Rank 1: The Shield has 3 Health Bar slots, each with your CON Mod. It is 3'' ft. in diameter. When you take damage, reduce these Health Bar slots first.</li><li>Rank 5: The Shield has 5 Health Bar slots and can grow up to 4’ ft. in diameter.</li><li>Rank 10: The Shield has 10 Health Bar slots and can now reach up to 6’ ft. in diameter.</li><li>Rank 15: The Shield has 15 Health Bar slots and can now reach up to 10’ ft. in diameter.</li></ul><hr><p><em>Source: Community submission — BlessedPsycho, Crawler #26933. From <a href="https://pointmongo.com/browse/magical-weapons/rose-quartz-shield">Point Mongo</a>.</em></p>'
