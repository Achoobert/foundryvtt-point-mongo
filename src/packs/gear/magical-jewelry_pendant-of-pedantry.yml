  description: '<p><em>A know-it-all''s necklace: advantage on crafting, knowledge and lore rolls, as long as you explain every last detail out loud. Each eye-roll or facepalm from the party earns you an AI point.</em></p><p>You can''t resist showing everyone what a smarty-pants you are. Wearing this jewel around your neck grants a buff to crafting, knowledge and lore rolls. But seriously, you can not resist talking about it in minute detail the entire time. Any other Player either rolling eyes or facepalming grants you an AI point.</p><table><tbody><tr><th>Slot</th><td>Accessory</td></tr><tr><th>Type</th><td>Necklace</td></tr><tr><th>Tier</th><td>Gold</td></tr><tr><th>Limitations</th><td>Must describe in great detail everything about the subject being rolled for.</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>Advantage to Crafting rolls</li><li>Advantage to Knowledge rolls</li><li>Advantage to Lore rolls</li></ul><hr><p><em>Source: Community submission — BanzaiZAP. From <a href="https://pointmongo.com/browse/magical-jewelry/pendant-of-pedantry">Point Mongo</a>.</em></p>'
