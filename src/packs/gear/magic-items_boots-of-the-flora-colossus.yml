  description: '<p><em>Tan leather boots that literally put down roots, so nothing can shove you around. Nothing stops anything from hitting you, though.</em></p><p>These stylish tan leather boots have the ability to turn a crawler into an immovable object.</p><p>They literally put down roots!</p><p>Grants the Rooted in Place Buff.</p><p>It is important to remember that this buff does not make the crawler invulnerable, so some times it is best to make like a tree, and leave.</p><table><tbody><tr><th>Slot</th><td>Feet</td></tr><tr><th>Type</th><td>Boots</td></tr><tr><th>Tier</th><td>Silver</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>Crawler gains the ability to use the Rooted in Place Buff at will.  CRB Pg 95.</li><li>It is important to remember that this buff does not make the crawler invulnerable, so some times it is best to make like a tree, and leave.</li></ul><hr><p><em>Source: Community submission — DeaDPaN79. From <a href="https://pointmongo.com/browse/magic-items/boots-of-the-flora-colossus">Point Mongo</a>.</em></p>'
