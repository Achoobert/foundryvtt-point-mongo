  description: '<p><em>A tiny enamel pin of a potted carnivorous plant that whispers “Feed me…” near fresh corpses and turns dead NPCs into plant food.</em></p><p>Upgrade Pin*. Small.</p><p>A small, 2” enamel pin that features a baby version of the Mean Green Mother in an old rusted coffee can filled with dark soil. Every time you’re near a freshly killed corpse, the pin whispers “Feed Me…” in a musical tone.</p><p>*Upgrade Pins function like Upgrade Patches, but are much smaller, and much easier to attach. But they''re also much easier to lose…</p><p>Warning: Upgrade Pins are fleeting items. You may remove them, but they will be destroyed in the process.</p><table><tbody><tr><th>Slot</th><td>Accessory</td></tr><tr><th>Type</th><td>Upgrade Pin</td></tr><tr><th>Tier</th><td>Gold</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+3 Intelligence</li><li>+2 Ranks to Herbalism</li><li>Secret Formula: Any time you take a dead NPC into your inventory while this Pin is equipped, its blood will automatically be distilled into Not-Hard-To-Come-By Plant Food.</li></ul><hr><p><em>Source: Community submission — BlessedPsycho, Crawler #26,933. From <a href="https://pointmongo.com/browse/magical-jewelry/upgrade-pin-of-the-teasing-pod">Point Mongo</a>.</em></p>'
