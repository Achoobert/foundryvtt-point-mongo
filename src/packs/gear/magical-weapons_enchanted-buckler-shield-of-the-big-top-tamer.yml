  description: '<p><em>A lion-crested buckler that sharpens wit and charm and throws up a free Protective Shell every six hours.</em></p><p>This small, iron banded, wooden buckler shield features a painted crest of a red lion rampant.  The shield grants +5% Intelligence, +5% Charisma, and bestows the ability to Cast the Protective Shield Spell at Rank 3 at no mana cost, on a 6 hour cooldown.</p><table><tbody><tr><th>Slot</th><td>Hands/Holding</td></tr><tr><th>Type</th><td>Shield</td></tr><tr><th>Tier</th><td>Platinum</td></tr><tr><th>DR</th><td>1</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+5% Intelligence</li><li>Protective Shell Spell at Rank 3, no Mana cost, 6 hour cooldown</li><li>+5% Charisma</li></ul><hr><p><em>Source: Community submission — DeaDPaN79. From <a href="https://pointmongo.com/browse/magical-weapons/enchanted-buckler-shield-of-the-big-top-tamer">Point Mongo</a>.</em></p>'
