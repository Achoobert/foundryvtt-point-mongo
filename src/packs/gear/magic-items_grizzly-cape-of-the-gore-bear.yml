  description: '<p><em>A bloodstained Gore Bear hide, head and all for a hood, that toughens its wearer, turns aside claws and makes smaller creatures think twice.</em></p><p>A heavy cape fashioned from the bloodstained hide of a Gore Bear, with its enormous head forming a hood and its claws hanging over the wearer''s shoulders. You''ll smell like hot shit but ain''t no varmint getting their grubby claws in you.</p><table><tbody><tr><th>Slot</th><td>Accessory</td></tr><tr><th>Type</th><td>Cape</td></tr><tr><th>Tier</th><td>Gold</td></tr><tr><th>DR</th><td>1</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+2 Constitution</li><li>+2 Endurance</li><li>+1 Survival</li><li>Predators Presence: Advantage on Intimidate Checks against creatures smaller than you.</li><li>Resistance to Slashing Damage</li></ul><hr><p><em>Source: Community submission — Connor MT Dargan. From <a href="https://pointmongo.com/browse/magic-items/grizzly-cape-of-the-gore-bear">Point Mongo</a>.</em></p>'
