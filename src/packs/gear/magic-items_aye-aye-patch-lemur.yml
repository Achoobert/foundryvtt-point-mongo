  description: '<p><em>A fleeting aye-aye patch for living like a monkey who decided to be a woodpecker: climb, ping for insects, and stab with your bare hands.</em></p><p>This is a fleeting item.</p><p>This patch has a picture of a an aye-aye which if you didn''t know is basically a monkey that''s decided to live as a woodpecker. And now you have the option to live like a monkey who has decided to live like a woodpecker. Climbing around knocking on things to find insects so you can stab and eat them.</p><table><tbody><tr><th>Slot</th><td>Accessory</td></tr><tr><th>Type</th><td>Patch</td></tr><tr><th>Damage type</th><td>Piercing</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+1 Ping spell. but it only targets insect based life forms. Can reveal crawlers and red tagged mobs.</li><li>+2 Climb skill</li><li>Unarmed attacks now do piercing damage</li></ul><hr><p><em>Source: Community submission — Ben D. From <a href="https://pointmongo.com/browse/magic-items/aye-aye-patch-lemur">Point Mongo</a>.</em></p>'
