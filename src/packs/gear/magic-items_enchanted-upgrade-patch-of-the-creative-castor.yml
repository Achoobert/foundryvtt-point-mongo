  description: '<p><em>A fleeting spellbook-and-stars patch for casters that sharpens the mind, toughens the body, and refills your Mana once a floor.</em></p><p>This is a fleeting Item.  This medium-sized enchanted embroidered upgrade patch depicts an open spell book surrounded by a ring of stars on a dark purple background.  When properly sewn onto an eligible garment this patch bestows the following: +5% Intelligence, +5% Constitution, and the Restore Ability, which allows the wearer to refill its Mana once per Dungeon Floor.</p><table><tbody><tr><th>Slot</th><td>Accessory</td></tr><tr><th>Type</th><td>Patch</td></tr><tr><th>Tier</th><td>Platinum</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+5% Intelligence</li><li>+5% Constitution</li><li>Once per floor: Restore (full Mana)</li></ul><hr><p><em>Source: Community submission — DeaDPaN79. From <a href="https://pointmongo.com/browse/magic-items/enchanted-upgrade-patch-of-the-creative-castor">Point Mongo</a>.</em></p>'
