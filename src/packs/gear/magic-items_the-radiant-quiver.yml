system:
  description: '<p><em>Bask in the light and make your enemies cower in the shadows with this magical quiver. Enemies struck by these arrows are going to remember your name forever. Or at least as long as they remain alive.</em></p><p>This is a worked tanned leather quiver</p><table><tbody><tr><th>Slot</th><td>Accessory</td></tr><tr><th>Type</th><td>Magic Item</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>Produces 5 Light Arrows per hour spent under the sun.</li><li>If there are Light Arrows on the quiver it emits a gentle bright light in 20ft and dim light on another 20ft.</li><li>You may spend a number of Light Arrows still in the quiver to point the quiver at a target and cast a Sunbolt (Opposed INT or DEX check).</li><li>5 Arrows: 1d6 Fire,</li><li>10 Arrows: 2d6 Fire, Burned,</li><li>15 Arrows: 3d6 Fire, Burned, Blinded,</li><li>20 Arrows: 4d6 Fire, Burned, Blinded, 5ft Splash</li></ul><hr><p><em>Source: Community submission — Gabe M. From <a href="https://pointmongo.com/browse/magic-items/the-radiant-quiver">Point Mongo</a>.</em></p>'
