  description: '<p><em>A soft glow behind the head that sharpens the mind and charms the room, but makes hiding in shadows a lot harder.</em></p><p>When worn, this appears as a soft, warm light behind the wearer''s head. It is a major boost to mana and some stats, and provides protection from blindness and charms. Its glow does make it more difficult to hide in shadows.</p><table><tbody><tr><th>Slot</th><td>Head</td></tr><tr><th>Type</th><td>Crown</td></tr><tr><th>Tier</th><td>Legendary</td></tr><tr><th>Limitations</th><td>-3 Hide in Shadows</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+10 Mana</li><li>+5 Mana recovered per Round</li><li>+15 INT</li><li>+15 CHA</li><li>Immune to Charm and Blind</li></ul><hr><p><em>Source: Community submission — BanzaiZAP. From <a href="https://pointmongo.com/browse/magic-items/sundog-halo">Point Mongo</a>.</em></p>'
