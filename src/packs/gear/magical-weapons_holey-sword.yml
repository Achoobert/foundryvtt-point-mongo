  description: '<p><strong>Missing:</strong> effects</p><p><em>A hole-riddled sword that multiplies damage on numbers with holes in them, or breaks and inflicts unstoppable bleed on any other roll.</em></p><p><strong>Type:</strong> Slashing · <strong>Damage:</strong> 1d20 (see description)</p><p>Literally full of holes, like any plan involving it — looks good for a few swings and makes a satisfying swoosh. Deals double damage on any roll with a hole in the digit (4, 6, 9…), triple on 8 or 18 (two holes). Rolling any other number instantly breaks the sword but inflicts unstoppable bleeding (10 damage/turn until the target dies).</p><table><tbody><tr><th>Slot</th><td>Hands/Holding</td></tr><tr><th>Type</th><td>Sword</td></tr><tr><th>Weapon skill</th><td>Longsword</td></tr></tbody></table><hr><p><em>Source: Community submission — The Royal Grumble (Crawler #9002). From <a href="https://pointmongo.com/browse/magical-weapons/holey-sword">Point Mongo</a>.</em></p>'
