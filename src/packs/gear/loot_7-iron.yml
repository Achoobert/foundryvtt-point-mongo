  description: '<p><em>A cavity-back golf club that won''t fix your handicap down here, but might save your life, provided the shaft holds.</em></p><p>This Calloway 7-Iron has a carbon steel shaft, and a cavity-back club face to expand the sweet spot and minimize distance loss on off center hits.  Here in the dungeon, it won''t likely help you improve your golf handicap, but it may just save your life.</p><table><tbody><tr><th>Slot</th><td>Hands/Holding</td></tr><tr><th>Type</th><td>Weapon</td></tr><tr><th>Tier</th><td>Bronze</td></tr><tr><th>Weapon skill</th><td>Improvised Weapons</td></tr><tr><th>Damage type</th><td>Bludgeoning</td></tr><tr><th>Limitations</th><td>On a Critical failure, the shaft could bend or snap at the DM''s discretion.</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>1d4+STR dmg</li></ul><hr><p><em>Source: Community submission — DeaDPaN79. From <a href="https://pointmongo.com/browse/loot/7-iron">Point Mongo</a>.</em></p>'
