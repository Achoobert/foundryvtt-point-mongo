  description: '<p><em>A fleeting patch of a bespectacled worm in a stack of spellbooks that sharpens Intelligence and keeps your Mana topping up.</em></p><p>This is a fleeting item.  This medium sized enchanted upgrade patch depicts a stack of spellbooks, riddled with holes while a single bespectacled, green, smiling worm appears from the middle of the stack.  When properly sewn onto an eligible garment, this enchanted upgrade patch bestows the following: +4 Intelligence, Replenish Buff (Mana regeneration equal to INT every 10 minutes).</p><table><tbody><tr><th>Slot</th><td>Accessory</td></tr><tr><th>Type</th><td>Patch</td></tr><tr><th>Tier</th><td>Gold</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>Replenish Buff</li><li>+4 Intelligence</li></ul><hr><p><em>Source: Community submission — DeaDPaN79. From <a href="https://pointmongo.com/browse/magic-items/enchanted-upgrade-patch-of-the-ambitious-bookworm">Point Mongo</a>.</em></p>'
