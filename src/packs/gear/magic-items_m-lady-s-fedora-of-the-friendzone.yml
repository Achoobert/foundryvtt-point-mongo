  description: '<p><em>Was that a gust of wind who opened the door for you, or was someone with this magical hat just happy to see you? Not that you can remember their face or anything.</em></p><p><strong>Type:</strong> Clothing (Hat). Only the wearer knows how stylish he is! This comfortable headgear is perfect for the film-noir private eye or the discerning neckbeard. It does have the effect of rendering the wearer ... forgettable. After the wearer of this hat leaves their presence, other people will be unable to clearly remember or describe them. Great for stealth, not so great for seduction. Adds +3 to Hide in Shadows and Stealth Skills. Subtracts -3 from Seduction skills. New Ability: Forgettable.</p><table><tbody><tr><th>Slot</th><td>Head</td></tr><tr><th>Type</th><td>Clothing</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+3 Hide in Shadows and Stealth Skills</li><li>-3 Seduction Skills</li><li>New Ability: Forgettable</li></ul><hr><p><em>Source: BanzaiZAP. From <a href="https://pointmongo.com/browse/magic-items/m-lady-s-fedora-of-the-friendzone">Point Mongo</a>.</em></p>'
