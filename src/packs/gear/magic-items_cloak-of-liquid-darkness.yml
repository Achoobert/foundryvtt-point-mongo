  description: '<p><em>Put Harry Potter''s invisibility cloak to shame with this much better shadowmeld cloak. I bet you Harry''s cloak doesn''t give you resistances...</em></p><p>This magical cloak is cold to the touch and feels like liquid when moving through your hands.</p><table><tbody><tr><th>Slot</th><td>Torso</td></tr><tr><th>Type</th><td>Clothing</td></tr><tr><th>DR</th><td>1</td></tr><tr><th>Cooldown</th><td>1 hour</td></tr><tr><th>Limitations</th><td>Vulnerable to Light based attacks while in Shadow Form.</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>Become a 2D shadow for as long as you can hold your breath (CON Modifier = Minutes).  Resistant to Fire, Electric, and Poison attacks while in Shadow Form.</li><li>Immune to physical damage while in Shadow Form.</li></ul><hr><p><em>Source: Community submission — Gabe M. From <a href="https://pointmongo.com/browse/magic-items/cloak-of-liquid-darkness">Point Mongo</a>.</em></p>'
