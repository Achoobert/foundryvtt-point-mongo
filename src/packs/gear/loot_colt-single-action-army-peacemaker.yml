  description: '<p><em>The six-shot 1873 revolver with a walnut grip, found with eighteen rounds, and a reload waiting behind every Major Fail.</em></p><p>The Colt Single Action Army (SAA / "Peacemaker"), was originally designed in 1873.  The iconic 6-shot, single-action military and civilian sidearm primarily chambered .45 rounds.</p><p>This particular firearm features a polished walnut grip and a sturdy, rifled barrel.</p><p>This weapon is found with 18 rounds of ammunition.</p><table><tbody><tr><th>Slot</th><td>Hands/Holding</td></tr><tr><th>Type</th><td>Handgun</td></tr><tr><th>Tier</th><td>Bronze</td></tr><tr><th>Weapon skill</th><td>Handgun</td></tr><tr><th>Damage type</th><td>Piercing</td></tr><tr><th>Limitations</th><td>Each Attack requires proper ammunition. Spend one Action to reload after a Major Fail or worse.</td></tr></tbody></table><hr><p><em>Source: Community submission — DeaDPaN79. From <a href="https://pointmongo.com/browse/loot/colt-single-action-army-peacemaker">Point Mongo</a>.</em></p>'
