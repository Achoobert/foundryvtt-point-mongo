  description: '<p><em>A flame-etched dagger with +2 Dagger ranks that casts Fire Fingers from the blade every three hours.</em></p><p>A 10” blade crafted from the finest steel. Flames are etched into the blade, and the handle is covered in orange and red leather. This blade grants the following effects:</p><p>• +2 ranks to the Dagger Skill</p><p>• Inherent Spell: Fire Fingers. This spell is cast from the dagger and not from your fingers. Cooldown: 3 hours.</p><table><tbody><tr><th>Slot</th><td>Hands/Holding</td></tr><tr><th>Type</th><td>Dagger</td></tr><tr><th>Tier</th><td>Gold</td></tr><tr><th>Weapon skill</th><td>Dagger</td></tr><tr><th>Damage type</th><td>Piercing</td></tr><tr><th>Limitations</th><td>The Fire Fingers spell is cast from the dagger and not from your fingers. Cooldown: 3 hours.</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+2 ranks to the Dagger Skill</li><li>Inherent Spell: Fire Fingers</li></ul><hr><p><em>Source: Community submission — BlessedPsycho, Crawler #26,933. From <a href="https://pointmongo.com/browse/magical-weapons/enchanted-dagger-of-the-fiery-end">Point Mongo</a>.</em></p>'
