  description: '<p><em>A feathered, bat-leather villain''s cape with Charisma, Intimidate and the Fear spell.</em></p><p>This large heavy cape is accented by frills of raven feathers and made from the leather of 50 bat wings. The hero of the day is sure to run back to their super cave ... or to hide under their bed cowering like a little bitch.</p><table><tbody><tr><th>Slot</th><td>Accessory</td></tr><tr><th>Type</th><td>Cape</td></tr><tr><th>Tier</th><td>Silver</td></tr><tr><th>DR</th><td>1</td></tr><tr><th>Cooldown</th><td>3 hours</td></tr><tr><th>Limitations</th><td>Fear can be cast with a cooldown of 3 hours</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+2 Charisma</li><li>+1 Constitution</li><li>+2 Fear Spell</li><li>+2 Intimidate Skill</li></ul><hr><p><em>Source: Community submission — Connor MT Dargan. From <a href="https://pointmongo.com/browse/magic-items/malicious-mantle-of-saturday-morning-cartoon-villain">Point Mongo</a>.</em></p>'
