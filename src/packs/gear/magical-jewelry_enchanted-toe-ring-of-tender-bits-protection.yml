  description: '<p><em>An obsidian toe ring that makes you immune to pointy things and strong enough to hit back harder.</em></p><p>This obsidian toe ring sparkles in direct sunlight.  When equipped it bestows the following benefits: Immunity to Piercing, +5 Strength.  This toe ring has two jobs: To protect your squishy bits from damage from pointy things, and to grant you the strength to hit your enemies harder than they hit you.  Let''s find out if it will be enough to help you survive this floor, cupcake.</p><table><tbody><tr><th>Slot</th><td>Accessory</td></tr><tr><th>Type</th><td>Toe Ring</td></tr><tr><th>Tier</th><td>Gold</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+5 Strength</li><li>Immunity to Piercing damage</li></ul><hr><p><em>Source: Community submission — DeaDPaN79. From <a href="https://pointmongo.com/browse/magical-jewelry/enchanted-toe-ring-of-tender-bits-protection">Point Mongo</a>.</em></p>'
