  description: '<p><em>A fleeting patch of a taunting knight on a castle wall that sharpens your Taunt and lets the insults, and Psychic damage, bounce off.</em></p><p>This is a fleeting item.  "Your Mother was a hamster, and your Father smelled of Elderberries".  More scathing words have never been spoken.  This medium sized embroidered upgrade patch features a knight in a conical helmet standing atop a castle wall, beating his hands upon his head while blowing a raspberry.  When properly sewn onto an eligible garment this enchanted upgrade patch bestows the following benefits: +1 Taunt Skill, Damage Resistance to Psychic Damage.  Now go away, or we shall taunt you a second time!</p><table><tbody><tr><th>Slot</th><td>Accessory</td></tr><tr><th>Type</th><td>Patch</td></tr><tr><th>Tier</th><td>Gold</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+1 Taunt Skill</li><li>Resistance to Psychic damage</li></ul><hr><p><em>Source: Community submission — DeaDPaN79. From <a href="https://pointmongo.com/browse/magic-items/enchanted-upgrade-patch-of-the-art-of-the-insult">Point Mongo</a>.</em></p>'
