  description: '<p><strong>Missing:</strong> slot, effects</p><p><em>Mechanized extendable titanium stilts that add 10'' of height and allow powerful leaps, seemingly built to reach cookie jars.</em></p><p>This mechanized set of spring- loaded extendable / retractable titanium stilts adds 10'' of height to a Crawler, allowing them to reach the metaphorical cookie jar on the top shelf. And the literal cookie jar. Hmmm. For unknown reasons, the creator of this item seems to have been oddly focused on their usefulness in obtaining cookies. Were they 3 small gnomish children in a trench coat? Sadly, we''ll never know. Regardless, the magically imbued stilts are also oddly durable, and seem immune to standard damage. They can also be used up to 3x per day to perform a leap of up to 30'' of distance, either horizontal or vertical.</p><table><tbody><tr><th>Type</th><td>Armor</td></tr></tbody></table><hr><p><em>Source: Community submission — DeaDPaN79 (Crawler #1945). From <a href="https://pointmongo.com/browse/magic-items/go-go-gadget-stilts">Point Mongo</a>.</em></p>'
