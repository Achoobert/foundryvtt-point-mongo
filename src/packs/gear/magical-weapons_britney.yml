  description: '<p><em>Oh baby, baby, how was I supposed to know how dangerous this magical spear is. Its ease of use makes it simple to say "Oops, I did it again!"</em></p><p>This is a magical spear, with a glittery tip at the end of it.</p><table><tbody><tr><th>Slot</th><td>Hands/Holding</td></tr><tr><th>Type</th><td>Weapon</td></tr><tr><th>Weapon skill</th><td>Spear</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>Toxic: On a great success with the Spear, the target becomes Poisoned.</li><li>Hit Me Baby One More Time: If your first strike on a round hits a target, you get Advantage for the second one against that same target.</li></ul><hr><p><em>Source: Community submission — Gabe M. From <a href="https://pointmongo.com/browse/magical-weapons/britney">Point Mongo</a>.</em></p>'
