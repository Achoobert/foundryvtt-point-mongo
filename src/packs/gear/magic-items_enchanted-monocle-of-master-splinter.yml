  description: '<p><em>A silk-strung monocle that summons a few turtle ninjas once every 30 hours, who vanish in pepperoni-scented smoke.</em></p><p>A glass monocle on a fine silk string that is worn on the eye. It does not affect your eyesight, but it does grant the following ability: once every 30 hours, you may summon up to 1d4 Level 10 Turtle Ninjas to fight for you. They will last for up to 5 minutes, or until their Health Bars drop to 0, at which point they will vanish in a puff of pepperoni-scented smoke.</p><table><tbody><tr><th>Slot</th><td>Accessory</td></tr><tr><th>Type</th><td>Monocle</td></tr><tr><th>Tier</th><td>Gold</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>Summon minions to fight for you: Summon up to 1d4 Level 10 Turtle Ninjas to fight on your behalf.</li></ul><hr><p><em>Source: Community submission — BlessedPsycho, Crawler #26,933. From <a href="https://pointmongo.com/browse/magic-items/enchanted-monocle-of-master-splinter">Point Mongo</a>.</em></p>'
