  description: '<p><em>A rainbow gemstone on a platinum chain that will drop you and six friends anywhere on the floor you have already been. Once a day.</em></p><p>This legendary item is a rainbow hued gemstone pendant hanging from a platinum chain.  Once per 30 hour day it allows the wearer and up to 6 party members to instantly teleport to any location that they have previously been to on the current dungeon floor.</p><table><tbody><tr><th>Slot</th><td>Accessory</td></tr><tr><th>Type</th><td>Amulet</td></tr><tr><th>Tier</th><td>Legendary</td></tr><tr><th>Duration</th><td>Instant</td></tr><tr><th>Cooldown</th><td>Once per 30 Hour Day</td></tr><tr><th>Charges</th><td>Unlimited</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>User gains access to a level 20 Teleport Spell that allows them and up to 6 party members to Teleport to any location on the current dungeon floor that they have been to previously.</li></ul><hr><p><em>Source: Community submission — DeaDPaN79. From <a href="https://pointmongo.com/browse/magic-items/the-amulet-of-fastra-vel">Point Mongo</a>.</em></p>'
