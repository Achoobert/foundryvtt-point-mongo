  description: '<p><em>A fleeting koala patch that clings on for you, worth two Climbing ranks and two points to every stat.</em></p><p>This is a Fleeting Item</p><p>Upgrade Patch. Small.</p><p>A small patch depicting a koala in shades of purple-gray and white, with fluffy white ears and beady black eyes and nose. He’s clinging tightly to a brown tree branch with several green leaves coming off of it.</p><p>If this upgrade patch is affixed to an eligible garment, it will imbue the following upgrades:</p><p>+2 ranks to Climbing Skill</p><p>+2 to all Stats</p><p>Warning: Upgrade patches are Fleeting Items. You may remove them, but they will be destroyed in the process.</p><table><tbody><tr><th>Slot</th><td>Accessory</td></tr><tr><th>Type</th><td>Upgrade Patch</td></tr><tr><th>Tier</th><td>Gold</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+2 ranks to Climbing Skill</li><li>+2 to all Stats</li></ul><hr><p><em>Source: Community submission — BlessedPsycho, Crawler #26,933. From <a href="https://pointmongo.com/browse/magic-items/over-koala-fied-patch">Point Mongo</a>.</em></p>'
