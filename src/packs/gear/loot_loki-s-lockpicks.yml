  description: '<p><em>A pair of cufflinks, created by Loki, that auto-pick any lock and auto-detect/disarm any trap in a 15'' radius.</em></p><p><strong>Notes:</strong> See Description</p><p>Originally created by the human''s Norse God of Mischief, this simple, plain looking piece of jewelry is actually a tool and artifact of great power. It''s base form is able to shift based on the needs of the user, but it often resembles a matched pair of cufflinks. The right cufflink imbues the ability to open mechanically, or magically sealed lock with an automatic 100% chance of success. The left cufflink grants the wearer the ability automatically detect, and disarm traps with 100% accuracy in a 15'' radius. These items can never be separated, and will always find a way to return to each other.</p><table><tbody><tr><th>Slot</th><td>Accessory</td></tr><tr><th>Type</th><td>Support Tool</td></tr><tr><th>Tier</th><td>Celestial</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>Escape Artist - Rank 15 (CRB Pg 191)</li><li>Find Traps - Rank 20 (CRB Pg 192): Rank 20 grants automatic success in this case.</li><li>Locksmith - Rank 20 (CRB Pg 195): Rank 20 grants automatic success in this case.</li></ul><hr><p><em>Source: Community submission — DeaDPaN79 (Crawler #1945). From <a href="https://pointmongo.com/browse/loot/loki-s-lockpicks">Point Mongo</a>.</em></p>'
