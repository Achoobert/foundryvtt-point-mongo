  description: '<p><em>Sunglasses that make you more charming, especially at night when you shouldn''t be wearing them, and poison whatever you hit.</em></p><p>Sunglasses that grant +2 Charisma, as well as an additional +2 Charisma for wearing them at night or in darkness, but this also impairs your Intelligence by -2. Your physical attacks inflict Poisoned Debuff, regardless of lighting conditions. Up to 2 stacks of Poisoned from this item per target (optional limitation).</p><table><tbody><tr><th>Slot</th><td>Accessory</td></tr><tr><th>Type</th><td>Sunglasses</td></tr><tr><th>Tier</th><td>Silver</td></tr><tr><th>Limitations</th><td>-2 Intelligence if worn at night or in darkness. Optional: up to 2 stacks of Poisoned from this item per target</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+2 Charisma</li><li>Additional +2 Charisma for wearing them at night or in darkness, but this also impairs your Intelligence by -2</li><li>Your physical attacks inflict Poisoned Debuff, regardless of lighting conditions (optional limitation: up to 2 stacks of Poisoned from this item per target)</li></ul><hr><p><em>Source: Community submission — SuperBob. From <a href="https://pointmongo.com/browse/magic-items/nightshades">Point Mongo</a>.</em></p>'
