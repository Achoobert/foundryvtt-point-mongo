  description: '<p><em>A walking copyright infringement of a cape: Strength, Constitution, Bang Bro, Web and Air Buddy, and an urge to do right.</em></p><p>A comic book nerd''s wet dream and a lawyer''s worst nightmare. This cape turns you into a walking copyright infringement. Sooooo many publishing companies would sue your ass off if they were still alive to do it. Spider Powers, Flight, Super Strength, the works! But let''s be realistic you''re gonna do some genius stuff with this, all while looking great with hero hair!</p><table><tbody><tr><th>Slot</th><td>Accessory</td></tr><tr><th>Type</th><td>Cape</td></tr><tr><th>Tier</th><td>Platinum</td></tr><tr><th>DR</th><td>2</td></tr><tr><th>Limitations</th><td>While wearing this you will be compelled to do right...even if it costs your life</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+10% Constitution</li><li>+10% Strength</li><li>+1 Bang Bro Spell</li><li>+1 Web Spell</li><li>+1 Air Buddy Spell</li></ul><hr><p><em>Source: Community submission — Connor MT Dargan. From <a href="https://pointmongo.com/browse/magic-items/super-hero-starter-kit">Point Mongo</a>.</em></p>'
