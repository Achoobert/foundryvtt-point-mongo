  description: '<p><em>The Cape of KABOOM, for crawlers who drop potassium in water just to watch.</em></p><p>Also known as the Cape of KABOOM, this is a silver tier enchanted item.  What happens when you add a sliver of pure potassium into a beaker of water for the amusement of a classroom full of juvenile students?  Most people have the good sense not to try this at home, but the middle school science teacher does it for kicks, at least once a semester.  Jim Moergeli, this one is for you.  When equipped it bestows the following benefit: +1 Explosive Handling Skill.  Fly free Jungle Boy, Fly Free.</p><table><tbody><tr><th>Slot</th><td>Accessory</td></tr><tr><th>Type</th><td>Cape</td></tr><tr><th>Tier</th><td>Silver</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+1 Explosives Handling Skill</li></ul><hr><p><em>Source: Community submission — DeaDPaN79. From <a href="https://pointmongo.com/browse/magic-items/cape-of-the-middle-school-science-teacher">Point Mongo</a>.</em></p>'
