  description: '<p><em>Fuzzy pink duct-taped slippers that sharpen the mind and the aim, and whistle when goblins are near.</em></p><p>A pair of fuzzy pink house slippers made of a roughspun wool. The soles are covered in patches of silvery duct tape that is peeling off in some places, but appears to be holding strong nonetheless. When worn, these slippers grant you +1 Bow Skill, and +3 Intelligence. Additionally, they whistle softly whenever a goblin is within 50'' ft of you.</p><table><tbody><tr><th>Slot</th><td>Feet</td></tr><tr><th>Type</th><td>Slippers</td></tr><tr><th>Tier</th><td>Gold</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+1 Bow Skill</li><li>+3 Intelligence</li></ul><hr><p><em>Source: Community submission — BlessedPsycho, Crawler #26,933. From <a href="https://pointmongo.com/browse/magic-items/enchanted-slippers-of-the-overgrown-whining-carapidae">Point Mongo</a>.</em></p>'
