  description: '<p><em>A fleeting goblin-skull patch crowned with a pineapple and dynamite that boosts Dexterity and Goblin Explosives, heals allies, and refills your Mana once a floor.</em></p><p>This is a fleeting item.  This medium sized round upgrade patch features a grimacing goblin skull wearing a pineapple crown with a bundle of goblin dynamite layered overtop of  the pineapple.  When properly sewn onto an eligible garment, it bestows the following benefits:  +10% Dexterity, +5 Goblin Explosives Skill, Heal Others Spell at Rank 5 with a 10 hour cool down, and the Restore Buff - Full Mana once per floor.</p><table><tbody><tr><th>Slot</th><td>Accessory</td></tr><tr><th>Type</th><td>Patch</td></tr><tr><th>Tier</th><td>Legendary</td></tr></tbody></table><p><strong>Effects</strong></p><ul><li>+10% Dexterity</li><li>Once per floor: Restore (full Mana)</li><li>Heal Others Spell at Rank 5, no Mana cost, 10 hour cooldown</li><li>+5 Goblin Explosives Skill</li></ul><hr><p><em>Source: Community submission — DeaDPaN79. From <a href="https://pointmongo.com/browse/magic-items/enchanted-upgrade-patch-of-the-nimble-goblin-war-shaman">Point Mongo</a>.</em></p>'
