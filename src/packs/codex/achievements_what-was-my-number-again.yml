      content: '<p><em>Triggered when you forget your own Crawler Number when asked to state it.</em></p><p>You had one job: remember the number that identifies you to the entire dungeon system. You blanked. On camera. In front of trillions of viewers. Don''t worry, we''ll just keep calling you by whatever nickname stuck instead.</p><p>Reward: Bronze Identity Crisis Box</p><hr><p><em>Source: Chex. From <a href="https://pointmongo.com/browse/achievements/what-was-my-number-again">Point Mongo</a>.</em></p>'
