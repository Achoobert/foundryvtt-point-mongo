      content: '<p><em>Triggered when you kill five or more enemies with a non-magical wall of fire before finding the Tutorial Guild.</em></p><p>You have killed 5 or more enemies by creating a non-magical wall of fire for them to fall into, all before you found the Tutorial Guild. With such an ability to overcook those poor Mobs, you have the makings of a career fry cook at a fast food restaurant.</p><p>Reward: Gold Arsonist''s Box</p><hr><p><em>Source: Community submission — JackWreckem. From <a href="https://pointmongo.com/browse/achievements/out-of-the-frying-pan">Point Mongo</a>.</em></p>'
