      content: '<p><em>A Dwarven distiller hauling his clan''s last cask of ancestral whiskey across the overcity, pursued by thieves and thirsty crawlers.</em></p><p><strong>Level:</strong> 50 · <strong>Race:</strong> Dwarf · <strong>Class:</strong> Distiller · <strong>Tunnel Show Title:</strong> Coppertun Run</p><p>This Dwarven distiller is attempting to cross the overcity with a wagon loaded with casks — the last remaining stock of his dwindling ancestral supply of the Clan''s whiskey distillery. Pursued by thieves, brigands, and thirsty crawlers, Bramley will offer to hire the party to escort him on his travels across the floor.</p><hr><p><em>Source: Community submission — DeaDPaN79 (Crawler #1945). From <a href="https://pointmongo.com/browse/npcs/bramley-coppertun">Point Mongo</a>.</em></p>'
