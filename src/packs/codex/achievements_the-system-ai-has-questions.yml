      content: '<p><em>Triggered when you accomplish something so strange that the GM cannot immediately explain how the situation occurred.</em></p><p>You have done something that the System AI did not anticipate.</p><p>The System AI has reviewed the relevant dungeon parameters.</p><p>The System AI has reviewed them again.</p><p>The System AI has determined that what you just did was technically legal.</p><p>Congratulations, crawler. You have become a problem.</p><p>Reward: Platinum "WHAT THE HELL?" Box</p><hr><p><em>Source: Chex. From <a href="https://pointmongo.com/browse/achievements/the-system-ai-has-questions">Point Mongo</a>.</em></p>'
