    text:
      format: 1
      content: '<p><em>Triggered when you come out of a non-boss fight with 10% of your health or less.</em></p><p>The reason you can''t hear any ringing, genius, is likely due to the pounding concussion and mortal injuries you sustained during that fight. You got through that fight with only 10% of your health left, and it wasn''t even a boss! Get your shit together, rub some dirt in it, and get back in there for round 2, Rocky!</p><p>Reward: You''ve received a Silver Survivor''s Box.</p><hr><p><em>Source: Community submission — JackWreckem. From <a href="https://pointmongo.com/browse/achievements/i-didn-t-hear-no-bell">Point Mongo</a>.</em></p>'
