    text:
      format: 1
      content: '<p><em>A disheveled, booze-soaked Gnoll lawyer whose entire strategy is bureaucratic delay — and it works.</em></p><p>Gazz graduated from a law school on some backwater planet outside the Center System that no one’s ever heard of, Gazz looks more like a drifter than an attorney. Though he can dress himself properly when needed, he rarely bothers. Reeking constantly of booze and never seen without a flask in hand, he’s dismissed by most courts the moment they hear his thick hick accent.</p><p>Despite that, he claims to get paid top dollar—and somehow, he usually does.</p><p><strong>Gazz specializes in one thing:</strong> delaying tactics. Any courtroom he steps into becomes a bureaucratic nightmare of contradictory system laws, obscure centuries-old legal precedents, procedural loopholes, and repeated interruptions to wake him up mid-hearing. Cases involving Gazz drag on for months, years, sometimes decades, until the opposing side finally caves under the mounting costs and exhaustion.</p><p>Most of his clients walk away satisfied with the concessions he squeezes out of the other side. But for the truly vindictive clients, Gazz can keep a case tied up long enough that the next generation ends up inheriting the lawsuit.</p><hr><p><em>Source: Community submission — Book (Crawler #19340). From <a href="https://pointmongo.com/browse/npcs/gazz-ashlab">Point Mongo</a>.</em></p>'
