    text:
      format: 1
      content: '<p><em>A platypus/owl/cat hybrid pet with combat support abilities, dressable in a wide range of accessories once fully sapient.</em></p><p><strong>Suggested Name:</strong> n/a</p><p>The Plat-owl-puss! You thought the platypus was already kinda fucked up? But also kinda cute? Okay, super cute. Then just you wait until you lay your eyes on this amalgamated monotreme! The plat-owl-puss is, as you might have guessed, a hybrid creature created from equal parts platypus, owl and cat! The fuzzy duck-billed face and long, beaver-like (but not actual beaver - there''s already enough going on here) tail of the platypus are complimented by the round, scotopic eyes and feathered wings of the Eurasian eagle owl, and the pointed ears and soft cloudy fur of a Ragdoll cat. The paws of the plat-owl-puss demonstrate further this consummate combination, being wider and more webbed than the typical cat''s paw - Yes, cats do in fact have webbed paws, look it up. Oh, you can''t! There''s no internet in the dungeon! Well you''re just gonna have to take my word for it, aren''t ya. And don''t come at me with that "partial webbing," webbing is webbing! AHEM - than the typical cat''s paw, with the slashing, swiping, sensual... AHEM! death-gripping talons of the Eurasian eagle owl. The plat-owl-puss, like its fur-cousin the cat, comes in a wide variety of patterns and colours, from the common striped brown tabby to the dusky solid lilac. This colour and any accompanying markings is also present on the wings! The high dexterity, high charisma, low constitution, sweet-natured - to its friends - creature grows to an average length of 50 centimetres, with particularly large females reaching as long as 64 centimetres from beak tip to the tip of the tail! It weighs in at a maximum of three-and-a-half and a minimum of around 2.5 kilos (around 8 and 5.5lbs respectively). Despite its reasonable size and impressive wingspan, potential owners should keep in mind the tenacious little beasty''s light, flexible bones. These bones allow your plat-owl-puss the power of flight, but make it too fragile for melee combat with most mobs found after the third floor. Better find some constitution accessories or start training a good recall response.</p><p>Speaking of accessories, your plat-owl-puss can equip the following: Earrings (to a maximum of three per ear) Nipple rings (one per nipple, if you can pierce the nipples of your plat-owl-puss without losing an appendage) Talon caps (if you''re mean enough to want to keep your new best friend from digging in) Tail bands (One, at the base of the tail) Hats and headbands Bracelets (one per leg) Dresses, shirts, pants (WARNING! Some pets, not only plat-owl-pusses... pussi? Plat-owl-pussodes...? are violently opposed to being dressed up. They''re not accessories for your Facebook or Instagram or Twitter feed, and they will let you know how they feel about your exploitation of their likeness for likes in no uncertain terms)</p><p><strong>Additional note:</strong> All listed accessories can only be equipped if they are intended for pet-class mobs. If your plat-owl-puss becomes fully sapient, this restriction is removed but they will also no longer be able to equip pet-class items. The plat-owl-puss''s role in combat is primarily aerial support, buffs and debuffs.</p><p><strong>Sample abilities:</strong></p><p><strong>Mark target :</strong> The plat-owl-puss takes to the air, painting a target for its party. If the target fails a dexterity check against this debuff, it takes a 5% hit to both its dexterity and dodge skill.</p><p><strong>Soothing purr:</strong> The plat-owl-puss curls around the neck or up on the chest of a wounded target or its master and purrs, easing pain and curing most psychic debuffs.</p><p><strong>Egg barrage:</strong> Exclusive to the female plat-owl-puss, this aerial attack releases a clutch of eggs at the target. If the target fails a dexterity or constitution check - whichever is the higher of their two stats - the eggs break upon them, each oozing a sticky and caustic yolk from the point of contact in a 15 centimetre diametre. If the plat-owl-puss has recently mated, she will not cast this attack.</p><p><strong>Tail whip:</strong> A melee range attack, the plat-owl-puss spins in a circle, striking the target with its tail. If the target fails a dexterity or constitution check (against the higher of their two stats) they gain a debuff. If their dexterity is higher, they will fall and be rooted for a period of &lt;plat-owl-puss dexterity modifier&gt;. If their constitution is higher, they will receive a "Painful Bruises" debuff to their shins and be gain the "Uneven Steps" affliction, making them unstable when moving and more likely to fall. At higher levels, the "Painful Bruises" debuff is replaced by "Fractured Bone" (spell level 6) or "Broken Bone" (spell level 10).</p><p>All melee abilities are cast using the plat-owl-puss''s dexterity modifier.</p><p>All spell abilities are cast using the plat-owl-puss''s charisma modifier.</p><hr><p><em>Source: Community submission — Paws (Crawler #38009). From <a href="https://pointmongo.com/browse/pets/plat-owl-pus">Point Mongo</a>.</em></p>'
