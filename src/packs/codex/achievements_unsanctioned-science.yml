      content: '<p><em>Triggered when you solve a combat or environmental problem using an item or spell in a way it was clearly never designed for.</em></p><p>That''s not remotely what that item was for. It worked anyway. Somewhere, an item designer is either furious or taking notes. Creative problem-solving like that deserves recognition. And maybe a safety inspection.</p><p>Reward: Gold Mad Scientist Box</p><hr><p><em>Source: Chex. From <a href="https://pointmongo.com/browse/achievements/unsanctioned-science">Point Mongo</a>.</em></p>'
