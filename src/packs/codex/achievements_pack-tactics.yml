      content: '<p><em>Triggered when you take down multiple Goblins from the same pack in a single combat encounter.</em></p><p>A whole pack of Goblins descended on you, and you sent the survivors running with a story to tell. Goblins love an explosion. They love a beatdown considerably less. Somewhere, a Goblin storyteller is already exaggerating your kill count.</p><p>Reward: Silver Pest Control Box</p><hr><p><em>Source: Chex. From <a href="https://pointmongo.com/browse/achievements/pack-tactics">Point Mongo</a>.</em></p>'
