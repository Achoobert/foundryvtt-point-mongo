    text:
      format: 1
      content: '<p><em>A grumpy, cantankerous Skyfowl lawyer who knows the law inside and out and has a soft spot for the underdog.</em></p><p><strong>Type:</strong> Lawyer · <strong>Race:</strong> Skyfowl</p><p>From the same planet as Mordecai. Grumpy and not particularly fond of his clients — especially those from races he might otherwise eat — but knows the law cold and quietly favors the underdog. A cross between Sam the Eagle and Matlock.</p><hr><p><em>Source: Community submission — Mathew Kerns (Crawler #7562). From <a href="https://pointmongo.com/browse/npcs/legal-eagle">Point Mongo</a>.</em></p>'
