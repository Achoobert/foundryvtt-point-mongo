      content: '<p><em>A four-quadrant Floor 5 bubble pairing Saccathian villagers menaced by Mantids with sleeping hoodoo monsters, child slave-miners, and a Mantid shipyard.</em></p><p><strong>Type:</strong> Floor 5 Bubble</p><p>Air: Saccathians, who worship crawlers resembling their historical art, are menaced by Mantid neighbors. Land: a rock-canyon desert maze of blind corners, infested with goblins — the hoodoos themselves are sleeping rock monsters. Subterranean: shockingly young slaves mine elements for the water quadrant''s war vessels, cute at first but vicious when threatened. Water: shipyards building great war vessels, coveted by jealous, tech-envious Mantids rumored to have a secret superweapon.</p><hr><p><em>Source: Community submission — Barry (Crawler #3779). From <a href="https://pointmongo.com/browse/floors/bubble-13-floor-5">Point Mongo</a>.</em></p>'
