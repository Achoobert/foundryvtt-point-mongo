    text:
      format: 1
      content: '<p><em>Triggered when a crawler freezes in place, unable to make up their mind while combat waits.</em></p><p><strong>Scenario:</strong> A crawler can’t make up their mind</p><p>You’re just standing there, doing nothing… like only looking around. Are you ok? Did we break you too soon? Well maybe an achievement will make you move, since that mob did not.</p><p><strong>Suggested Rewards:</strong></p><p>Bronze Dangly keys box. But really all we are just standing around talking, so less talky and more fighty.</p><hr><p><em>Source: Community submission — Alex (Crawler #1736). From <a href="https://pointmongo.com/browse/achievements/indecisive-asshole">Point Mongo</a>.</em></p>'
