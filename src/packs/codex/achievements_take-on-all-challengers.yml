    name: Take On All Challengers
    type: text
    text:
      format: 1
      content: '<p><em>Triggered when you fight a group twice your party size and win.</em></p><p>You and your party took on a group twice your size and came out victorious. I really want to say this was a great feat of strength, but we also reward this achievement for taking down a pack of defenseless puppies twice your group''s size. So...really it''s like being equal to a puppy kicker. Here''s your reward, puppy kicker.</p><p>Reward: You''ve received a Silver Adventurer''s Box.</p><hr><p><em>Source: JackWreckem. From <a href="https://pointmongo.com/browse/achievements/take-on-all-challengers">Point Mongo</a>.</em></p>'
