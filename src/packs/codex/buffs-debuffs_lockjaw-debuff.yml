    name: Lockjaw (Debuff)
    type: text
    text:
      format: 1
      content: '<p><em>A disease from dirty wounds that clamps the jaw shut, so talking, biting or drinking a potion takes a Constitution check first.</em></p><p>This disease is typically caused by infected cuts and punctures made by dirty objects such as rusty nails. Those suffering from Lockjaw have difficulty unclenching their jaw.</p><p>To perform any action or skill that requires the movement of the mouth, requires a successful constitution check to attempt. This includes talking, singing, biting, manually drinking potions, and any other activities that the AI deems appropriate (such as what your mother charges $5 for behind Denny''s).</p><p>This condition lasts until the end of a short rest or when healed by any thing that would remove a minor injury.</p><hr><p><em>Source: Community submission — Ben D. From <a href="https://pointmongo.com/browse/buffs-debuffs/lockjaw-debuff">Point Mongo</a>.</em></p>'
