    text:
      format: 1
      content: '<p><em>Large flower-feathered owls that release sleep-inducing pollen clouds and glow with pollen-light eyes.</em></p><p><strong>Species:</strong> Bloom Owl · <strong>Size:</strong> Large · <strong>Stats:</strong> STR 14, DEX 18, CON 16, INT 12, WIS 20, CHA 17</p><p>Attacks: Talons 2d6+DEX (DC16 CON save or bleed 5 rounds), Beak Strike 2d8+DEX. Feathers resemble flower petals or leaves that shift with the seasons or moon cycle, with pollen-glowing eyes symbolizing wisdom and renewal; may feed on nectar or ambient magic. Ability — Pollen Dream: releases glowing pollen in a 30'' cone, DC14 CON save or fall asleep for 1d4 rounds.</p><hr><p><em>Source: Community submission — Kyton786 (Crawler #11890). From <a href="https://pointmongo.com/browse/mounts/bloom-owls">Point Mongo</a>.</em></p>'
