    type: text
    text:
      format: 1
      content: '<p><em>Triggered when you achieve something on the Second Floor that has, genuinely and verifiably, never happened before in the entire broadcast history of the World Dungeon. GM''s call — this should be a floor-defining, one-of-a-kind moment, not a repeatable trick.</em></p><p>We have run this floor more times than anyone bothered to count. We thought we''d seen everything it had to offer. We were wrong. You just did something that has genuinely never been recorded here before. The archive team is furious. The ratings team is thrilled. The System AI, for once, has absolutely nothing snarky to say. Savor that. It won''t last.</p><p>Reward: Celestial Unprecedented Box</p><hr><p><em>Source: Chex. From <a href="https://pointmongo.com/browse/achievements/the-second-floor-has-never-seen-this">Point Mongo</a>.</em></p>'
