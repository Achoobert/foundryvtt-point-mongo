    name: Got'cha - Silent Alarm
    type: text
    text:
      format: 1
      content: '<p><em>A fake-looking landmine that makes a loud click but instead of exploding, aggros every mob in the area while the victim stays frozen on it.</em></p><p>A trap that makes a really loud "click" sound when you step on it like in the shows, so you know you''ve stepped in it, but you are scared to step off it? and instead of an explosion it aggro''s every mob in a radius? So then you''re stuck standing on the thing waiting for someone to try and disarm it and then suddenly swarmed by mobs and trying to decide if you''re willing to step off and see what happens so you can fight or try to fight without moving.</p><p><strong>Notes:</strong></p><p>Something that looks like a landmine, but is actually just a silent alarm.</p><hr><p><em>Source: Community submission — Socks (Crawler #4381). From <a href="https://pointmongo.com/browse/traps/got-cha-silent-alarm">Point Mongo</a>.</em></p>'
