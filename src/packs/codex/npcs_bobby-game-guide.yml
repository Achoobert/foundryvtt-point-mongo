      content: '<p><em>A level-40 Naga cleric Game Guide who despises the Desperado Club and steers crawlers toward Club Vanquisher instead.</em></p><p><strong>Type:</strong> Game Guide · <strong>Level:</strong> 40 · <strong>Race:</strong> Naga · <strong>Class:</strong> Cleric · <strong>Guild:</strong> Club Vanquisher</p><p>A 10er who hates the Desperado Club and will steer crawlers toward joining Club Vanquisher instead, but otherwise helps as much as possible — as long as they don''t get a Club Vanquisher tattoo.</p><hr><p><em>Source: Community submission — Alex (Crawler #1736). From <a href="https://pointmongo.com/browse/npcs/bobby-game-guide">Point Mongo</a>.</em></p>'
