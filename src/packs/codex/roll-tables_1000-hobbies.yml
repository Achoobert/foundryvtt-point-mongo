    text:
      format: 1
      content: '<p><em>A thousand Earth hobbies to hang on a crawler, or on whatever the potion decides they are now.</em></p><p>A thousand hobbies from back home, collected by Chorus of Sanctuary. Draw as many as you need; the same hobby never comes up twice in one draw.</p><p>A handful appear under two names, because they have two. Cycling is also biking, draughts is also checkers.</p><hr><p><em>Source: Chorus of Sanctuary. From <a href="https://pointmongo.com/browse/roll-tables/1000-hobbies">Point Mongo</a>.</em></p>'
