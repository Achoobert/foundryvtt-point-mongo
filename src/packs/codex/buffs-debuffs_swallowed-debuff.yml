    text:
      format: 1
      content: '<p><em>Swallowed whole: you can''t move, you''re easier to hit, and you take acid damage every round until you fight your way out.</em></p><p>While Swallowed, you cannot use your Movement Actions but may attempt an Evade check. Attacks made against a Swallowed crawler are made with Advantage.</p><p>At the start of each round, Swallowed crawlers make a STR-Opposed Escape Artist Skill Check. On a Fail, take 1d6+F Acid damage. On a success, the debuff ends and you’re able to fight your way out.</p><hr><p><em>Source: Community submission — BlessedPsycho, Crawler #26,933. From <a href="https://pointmongo.com/browse/buffs-debuffs/swallowed-debuff">Point Mongo</a>.</em></p>'
