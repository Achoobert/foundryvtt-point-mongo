    text:
      format: 1
      content: '<p><em>A non-combatant level-50 Bopka who has run a soup-kitchen safe room for 50 seasons, famously feared for his strict no-cutting-in-line policy.</em></p><p>This is a non-combatant NPC. Nikolav has run a soup kitchen safe room in the Dungeon for the last 50 seasons. Known for his dour attitude and his strict policies regarding cutting in line, Nikolav has a long running and well deserved reputation of being feared by the Crawler community. Many Crawlers have been turned away from his counter, still hungry to his shrill shrieks of "No soup for you!".</p><hr><p><em>Source: Community submission — DeaDPaN79 (Crawler #1945). From <a href="https://pointmongo.com/browse/npcs/nikolav">Point Mongo</a>.</em></p>'
