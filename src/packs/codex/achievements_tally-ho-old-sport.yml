      content: '<p><em>Triggered when you shoot and kill a beast mob with a firearm.</em></p><p>You successfully shot and killed a beast mob with a firearm. It doesn''t matter if it was sentient and had a family, you went out of your way to gun down a poor, almost helpless creature with something we didn''t warn them about, AND IT WAS HILARIOUS! Keep it up, old chap.</p><p>Reward: Silver Huntsman Box</p><hr><p><em>Source: Community submission — JackWreckem. From <a href="https://pointmongo.com/browse/achievements/tally-ho-old-sport">Point Mongo</a>.</em></p>'
