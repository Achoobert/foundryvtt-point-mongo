    text:
      format: 1
      content: '<p><em>Triggered by the very first crawler death in the dungeon, granting a one-time revival as an undead race.</em></p><p><strong>Trigger:</strong> The first crawler dies in the dungeon.</p><p>The AI notes this is the first and only time a crawler will be revived from certain death.</p><p><strong>Reward:</strong> A Raised From the Dead box — the crawler becomes a randomly selected undead race (zombie, skeleton, vampire, etc.), with the option to choose a new undead race and class on reaching floor 3. They can never be fully alive again, and a second death may be permanent.</p><hr><p><em>Source: Community submission — Grognak the Barbarian (Crawler #32780). From <a href="https://pointmongo.com/browse/achievements/first-to-die">Point Mongo</a>.</em></p>'
