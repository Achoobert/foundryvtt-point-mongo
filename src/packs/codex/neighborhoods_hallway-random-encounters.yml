    name: Hallway Random Encounters
    type: text
    text:
      format: 1
      content: '<p><em>A d100 roll table of random encounters for dungeon hallways and corridors.</em></p><p>Roll d100 while traveling through a corridor to determine what the party runs into.</p><table><tbody><tr><th>Roll</th><th>Encounter</th></tr><tr><td>01-05</td><td>3 patrolling Kobolds riding Danger Dingoes rush from an adjacent hallway.</td></tr><tr><td>06-10</td><td>A book lying in a side corridor on the floor.</td></tr><tr><td>11-15</td><td>A broken-down motorcycle lying on its side — nothing short of a mechanic''s table will make it run.</td></tr><tr><td>16-20</td><td>A crawler slowly petrifying, and a nearby boss who might have a cure.</td></tr><tr><td>21-25</td><td>A severely wounded but still-living crawler, missing eyes, limbs, or worse.</td></tr><tr><td>26-30</td><td>A crawler bearing a player-killer skull — see how they react to a potential threat.</td></tr><tr><td>31-35</td><td>A d20 comes whistling out of the air toward the lead crawler — 5x Dice Goblins attack.</td></tr><tr><td>36-40</td><td>A hockey puck blisters out of the darkness for 2d10 damage — a solitary Hawkey Player attacks the party.</td></tr><tr><td>41-45</td><td>A mob nursery.</td></tr><tr><td>46-50</td><td>A path of destruction left by another group of crawlers.</td></tr><tr><td>51-56</td><td>A scared, nervous teenager with pyromancy abilities.</td></tr><tr><td>57-62</td><td>A torch burns alone in the middle of the hallway floor, no one nearby.</td></tr><tr><td>63-70</td><td>An injured, bloody human crawler stumbles out of the darkness, asking to be escorted to the nearest saferoom.</td></tr><tr><td>71-77</td><td>Apology Booth: a glowing confession booth rewards honesty — confess something embarrassing for a buff or loot, a boring confession for a small reward, or refuse and take a Willpower/Charisma debuff. The more uncomfortable the truth, the better the reward.</td></tr><tr><td>78-85</td><td>Blocked by a dungeon trash goblin and his impassable pile of putrid waste.</td></tr><tr><td>86-90</td><td>OWLBEAR! Get wrecked.</td></tr><tr><td>91-95</td><td>Two crawlers are found fistfighting in the hallway ahead.</td></tr><tr><td>96-100</td><td>Unionized Mimics: treasure chests that demand respect — ask before opening for safe (and better) loot, ignore the rules and they attack, or play nice for a chance at bonus rewards or an ally.</td></tr></tbody></table><hr><p><em>Source: Community submission — DeaDPaN79, Christopher Wingenbach, and other Crawlers. From <a href="https://pointmongo.com/browse/neighborhoods/hallway-random-encounters">Point Mongo</a>.</em></p>'
