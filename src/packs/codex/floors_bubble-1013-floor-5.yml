    text:
      format: 1
      content: '<p><em>A four-quadrant Floor 5 bubble centered on the fractured Royal Disk artifact, split across a floating court, a survival-marathon biome, a merfolk feast, and warring mole-people factions.</em></p><p><strong>Type:</strong> Floor 5 Bubble</p><p>Air Quadrant: the Royal Disk''s fractured court sits atop a floating mountain reachable only by punishing vine-climbs; reassembling the disk restores its unknown power. Land Quadrant: tiger-like beast-folk run a deadly survival marathon that crawlers are forced to join and win. Water Quadrant: merfolk demand rare delicacies like kraken meat and leviathan eggs for a feast before granting access. Subterranean Quadrant: three warring mole-people factions each want their leader on the (still-incomplete) Royal Disk throne.</p><hr><p><em>Source: Community submission — Alex (Crawler #1736). From <a href="https://pointmongo.com/browse/floors/bubble-1013-floor-5">Point Mongo</a>.</em></p>'
