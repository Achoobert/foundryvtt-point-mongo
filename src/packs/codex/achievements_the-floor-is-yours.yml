      content: '<p><em>Triggered when you land the decisive blow on the Second Floor''s Floor Boss.</em></p><p>The tutorial floors just lost their biggest, meanest resident, and you''re the reason why. That''s not a Neighborhood Boss. That''s not a Borough Boss. That''s the whole floor''s problem, solved. Don''t get used to feeling this powerful. The Third Floor doesn''t care.</p><p>Reward: Platinum Floor Boss Slayer</p><hr><p><em>Source: Chex. From <a href="https://pointmongo.com/browse/achievements/the-floor-is-yours">Point Mongo</a>.</em></p>'
