    text:
      format: 1
      content: '<p><em>Triggered when a crawler annoys another crawler badly enough to get blocked in chat.</em></p><p><strong>Scenario:</strong> Crawler gets blocked in chat</p><p>You did it, you actually did it… you’ve annoyed another crawler enough that they blocked you in chat. Remember when you got the fist bump? That’s over now. You will forever be left on read. You must be one annoying asshole!</p><p><strong>Suggested Rewards:</strong></p><p>Since it’s apparently cool to not talk to you, I want to join in! Three times per day I will conveniently forget to give you a notification or update. I''m sure it’s nothing that could save your life. Just be glad I didn’t permanently mute you.</p><hr><p><em>Source: Community submission — Charles D. Parrott (Crawler #102365). From <a href="https://pointmongo.com/browse/achievements/stfu">Point Mongo</a>.</em></p>'
