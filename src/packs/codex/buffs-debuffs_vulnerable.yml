    text:
      format: 1
      content: '<p><em>Leaves a target open, so every hit on it lands its base damage twice.</em></p><p>A target with the Vulnerable debuff will take extra damage from attacks against it. Upon hitting a vulnerable target, deal the base damage of your attack a second time. Vulnerable lasts as long as the duration says on the target, and ends automatically once Combat is over.</p><hr><p><em>Source: Community submission — JackWreckem. From <a href="https://pointmongo.com/browse/buffs-debuffs/vulnerable">Point Mongo</a>.</em></p>'
