      content: '<p><em>Triggered when you survive a hallway combat encounter while sitting at just one Health Bar slot remaining.</em></p><p>One more hit and this achievement would''ve had a very different tone. You made it out standing on that pretty white stone floor, barely, but standing. The viewers were on the edge of their seats. So were you, presumably.</p><p>Reward: Silver Close Call Box</p><hr><p><em>Source: Chex. From <a href="https://pointmongo.com/browse/achievements/white-knuckles-white-stone">Point Mongo</a>.</em></p>'
