    text:
      format: 1
      content: '<p><em>A post-apocalypse floor where the mobs are Raiders, Super Mutants, Brotherhood, and Enclave analogues — Crawlers must grab the water chip and give the NPCs a fighting chance.</em></p><p>Instead of a beautiful world ruined by the war, a post apocalypse world where the factions are all available mobs (instead of Raiders, Super Mutants, Brotherhood and Enclave). The goal for the Crawlers is to get the water chip and leave the level having given the NPCs a chance to improve their world, even though we know it''ll be immediately crushed.</p><hr><p><em>Source: Community submission — Ian O''H, Crawler #4207. From <a href="https://pointmongo.com/browse/floors/fallout-faction-wars-floor">Point Mongo</a>.</em></p>'
