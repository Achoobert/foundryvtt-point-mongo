      content: '<p><em>A Utility pet bound to a Chuuni Brooding Edgelord: a living shadow that glides across surfaces and speaks telepathically.</em></p><p>Pet, Magical Shadow</p><p>Role: Utility</p><p>A living shadow normally bound to a Chuuni Brooding Edgelord.</p><p>The Shadow Familiar normally appears as a vaguely humanoid silhouette made from darkness. Its exact appearance is up to its master, although glowing eyes, unsettling smiles and the general appearance of something that absolutely should not be standing in the corner of the room are strongly encouraged.</p><p>The familiar is intelligent enough to understand its master''s instructions and communicates telepathically using words, images and impressions. It is naturally sarcastic, disturbingly observant and considerably more socially competent than its master.</p><p>Despite being made from shadow, the familiar is a Pet and follows the normal rules for Pets unless an ability below states otherwise.</p><p>SHADOW FAMILIAR, LEVEL 1</p><p>Size: 2 (Small)</p><p>Evade: +1</p><p>Move: 20+S</p><p>DR: 0</p><p>Str 2 (+1)</p><p>Int 1 (+1)</p><p>Con 2 (+1)</p><p>Dex 2 (+1)</p><p>Cha 1 (+1)</p><p>Health Bar Slots: 2 initially, increasing normally as the Pet levels.</p><p>SHADOW STRIKE</p><p>d20 + F + Str to hit</p><p>Damage: 1d4 + Str Slashing</p><p>This is mechanically the standard Pet Slice Attack, reflavoured as the familiar forming claws, blades or tendrils from its shadowy body.</p><p>UTILITY PET SPECIAL ABILITIES</p><p>SHADOW GLIDE</p><p>Move: 50 feet</p><p>The Shadow Familiar moves by flowing across solid surfaces like a living shadow.</p><p>It may move freely across floors, walls, ceilings and other continuous solid surfaces without making climbing Checks. It must remain in contact with a surface throughout its movement.</p><p>The familiar may move through brightly lit areas, although doing so makes it plainly visible and prevents it from benefiting from Living Shadow until it reaches an area where a shadow could reasonably exist.</p><p>It cannot fly, leap across open gaps, pass through solid objects, or move from one disconnected surface to another without some physical route between them.</p><p>Corners, walls meeting ceilings, furniture touching a floor and similar connected surfaces provide a continuous route for Shadow Glide.</p><p>LIVING SHADOW</p><p>The Shadow Familiar can flatten itself against surfaces, stretch or distort its shape and disguise itself as an ordinary shadow.</p><p>This does not make the familiar automatically invisible.</p><p>When detection matters, resolve the situation using the normal appropriate Checks. The ability merely allows the familiar to attempt to hide in places where an ordinary physical creature could not plausibly hide.</p><p>The familiar cannot manipulate physical objects while completely flattened into a shadow.</p><p>SHADOW LINK</p><p>The Shadow Familiar and its master may communicate telepathically while they are on the same dungeon floor.</p><p>This communication does not allow the master to automatically see or hear through the familiar''s senses. The familiar must describe what it perceives.</p><p>PET RULES</p><p>The Shadow Familiar follows normal Pet advancement.</p><p>It begins at Level 1.</p><p>It gains levels whenever its crawler does, gaining two levels at a time until Level 15 and then levelling normally.</p><p>It gains 3 Stat Points per level, although Intelligence cannot normally be increased seek AI permission.</p><p>Its Attack and ability Ranks are equal to the current Floor Number.</p><p>Its attacks gain an additional base damage die at Ranks 5, 10 and 15.</p><p>The Shadow Familiar receives two Actions during combat when participating in the fight and may normally use those Actions to Evade, Move or Attack. It may only Attack once per round.</p><p>OPTIONAL LEVEL 15 MATURITY BENEFIT — WE ARE LEGION</p><p>When the Shadow Familiar reaches Level 15, it learns to manifest multiple bodies simultaneously.</p><p>It may maintain up to three Shadow Bodies.</p><p>These are not separate Pets.</p><p>All Shadow Bodies:</p><p>• Share one Health Bar.</p><p>• Share the same Stats, Evade and DR.</p><p>• Share the Pet''s two Actions each round.</p><p>• Collectively make no more than one Attack each round.</p><p>• Count as a single Pet for all abilities and effects.</p><p>When the familiar Moves, one Shadow Body may use that Move Action.</p><p>Damage suffered by any Shadow Body is suffered by the shared Health Bar.</p><p>An Area attack containing multiple Shadow Bodies only damages the familiar once.</p><p>If an ability allows the crawler to teleport to the Shadow Familiar, such as Path of Shadows, the crawler may choose any currently manifested Shadow Body as the destination.</p><p>Creating or dismissing a Shadow Body does not require an Action, but a newly created body must appear within 5 feet of an existing Shadow Body.</p><p>If only one Shadow Body remains, it functions exactly like the normal Shadow Familiar.</p><hr><p><em>Source: Community submission — TheSharp. From <a href="https://pointmongo.com/browse/pets/shadow-familiar">Point Mongo</a>.</em></p>'
