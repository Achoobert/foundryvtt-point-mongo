    name: We Shouldn't Be Alive
    type: text
    text:
      format: 1
      content: '<p><em>Triggered when an entire party survives a boss fight with everyone down to their last health bar.</em></p><p><strong>Scenario:</strong> Survive a boss fight where everyone is alive, but everyone is at one health bar left.</p><p>You really should be dead right now. You came this close to death... BUT YOU DIDN''T DIE! You know who pulls that off, badasses or dumbasses. I can''t tell which one you are yet.</p><p><strong>Suggested Rewards:</strong></p><p>Everyone in the party receives a Platinum Survivors Box.</p><hr><p><em>Source: Community submission — Kyton786 (Crawler #11890). From <a href="https://pointmongo.com/browse/achievements/we-shouldn-t-be-alive">Point Mongo</a>.</em></p>'
