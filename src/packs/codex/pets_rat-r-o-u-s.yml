      content: '<p><em>A first-floor rat grown to Petite size, whose bite poisons on an Amazing Success.</em></p><p>Those who see the small rats infesting the first level of the Dungeon might think of them as just janitor mobs.</p><p>But they can actually grow quite large, and, once fully grown, become Rodents of Unusual Size (Petite, Size 3).</p><p>Bonding: rats enjoy food and warmth.</p><p>Level 15 Benefit</p><p>R.O.U.S. bites are infectious. On an Amazing Success, the target becomes Poisoned.</p><hr><p><em>Source: Community submission — Gabe M. From <a href="https://pointmongo.com/browse/pets/rat-r-o-u-s">Point Mongo</a>.</em></p>'
