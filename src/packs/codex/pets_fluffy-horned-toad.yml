    text:
      format: 1
      content: '<p><em>A horned toad pet mage that shoots acid from its eyes and fires horns like a shotgun shell, with a Texas-sized ego.</em></p><p><strong>Species:</strong> Horny Toad · <strong>Stats:</strong> STR 14, CON 20, DEX 8, INT 5</p><p>A mage pet (and, like its owner, a bad speller) that shoots acid instead of blood and fires its horns with the power of a .959 JDJ round. Enjoys bragging that everything''s bigger in Texas, and has been banned from every club for uncomfortably repeating "Rub-it" instead of "Ribbit."</p><hr><p><em>Source: Community submission — Eva Propes (Crawler #628). From <a href="https://pointmongo.com/browse/pets/fluffy-horned-toad">Point Mongo</a>.</em></p>'
