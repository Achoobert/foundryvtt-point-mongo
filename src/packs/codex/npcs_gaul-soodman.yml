      content: '<p><em>A once-idealistic Weasel lawyer who now helps criminals walk free and profit, with mob-worthy connections.</em></p><p><strong>Type:</strong> Lawyer · <strong>Race:</strong> Weasel</p><p>Originally pursued law for positive reasons before getting drawn into the criminal underworld; now operates in a very gray area, helping criminals get off scot-free while turning a profit. Has enough shady contacts to make the mob nervous. Do not cross this man — er, rodent.</p><hr><p><em>Source: Community submission — Mark Harrison (Crawler #5937). From <a href="https://pointmongo.com/browse/npcs/gaul-soodman">Point Mongo</a>.</em></p>'
