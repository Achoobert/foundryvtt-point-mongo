      content: '<p><em>Triggered when you desecrate something in the dungeon purely because it was beautiful.</em></p><p>Oh yeah, we''ve all done it. Seen something beautiful and want to just destroy it. Stomp a flower, write your name in fresh concrete, beat the ever loving shit out of a Mercedes.</p><p>And now you''ve gone and done it. This dungeon was created by thousands of individuals over hundreds of solars. It is literally someone''s magnum opus. And you just whipped your dick out and pissed all over it. Bravo. Encore.</p><hr><p><em>Source: Community submission — Barry, Crawler #3779. From <a href="https://pointmongo.com/browse/achievements/pissing-on-a-picasso">Point Mongo</a>.</em></p>'
