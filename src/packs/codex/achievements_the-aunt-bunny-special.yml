    type: text
    text:
      format: 1
      content: '<p><em>Triggered when a crawler tumbles spectacularly down a flight of stairs.</em></p><p><strong>Scenario:</strong> Crawler falls down stairs</p><p>Congratulations!** You just completed a vertical descent at a velocity that defies both physics and basic motor skills. You didn''t just fall; you performed a rhythmic, percussive interpretive dance with every single wooden riser on your way down. I watched the whole thing. It was like watching a slinky made of regret.</p><p><strong>The flavor text:</strong> "Lord have mercy! My shoe!" You’ve successfully channeled the spirit of a legendary 1980s family gathering. Somewhere, in a purple leather jumpsuit, a man is laughing at your structural integrity. You’ve got the momentum of a runaway freight train and the grace of a bowling ball in a tumble dryer. Go ahead, lay there on the foyer floor. Just make sure you don''t lose a shoe, or we’ll have to start the whole routine over.</p><p><strong>Current Status:</strong> Embarrassed, but surprisingly aerodynamic.</p><p><strong>Suggested Rewards:</strong> You’ve received a **Bronze "Gooney Goo-Goo" Box.** Inside, you’ll find a **Celestial Ice Pack** and a single, slightly scuffed **High-Heeled Pump.** (Warning: Wearing the shoe provides a +5 to Charisma but a -20 to Dexterity. Use with caution around staircases.)</p><hr><p><em>Source: Community submission — David Brookhart (Crawler #25631). From <a href="https://pointmongo.com/browse/achievements/the-aunt-bunny-special">Point Mongo</a>.</em></p>'
