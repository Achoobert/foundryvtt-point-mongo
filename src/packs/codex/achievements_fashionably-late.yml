      content: '<p><em>Triggered when you arrive to save a party member in combat at the very last possible second.</em></p><p>You showed up right as your friend was about to eat dirt, and somehow made it look intentional. The timing was cinematic. The friend was not amused. Great TV, though. Genuinely great TV.</p><p>Reward: Silver Cutting It Close Box</p><hr><p><em>Source: Chex. From <a href="https://pointmongo.com/browse/achievements/fashionably-late">Point Mongo</a>.</em></p>'
