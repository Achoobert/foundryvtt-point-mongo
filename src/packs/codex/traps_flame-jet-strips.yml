    text:
      format: 1
      content: '<p><em>Applicable flame-jet trap modules, dealing fire damage per jet and often paired with oil or slippery-terrain traps.</em></p><p>Think spike strips, but with flame. Applied to any surface, triggering causes a 4'' gout of flame per level of the creator, dealing 1d8 fire damage per flame jet. Often paired with traps like Oilslick or Slippery Slope to create upgraded trap modules.</p><hr><p><em>Source: Community submission — DeaDPaN79 (Crawler #1942). From <a href="https://pointmongo.com/browse/traps/flame-jet-strips">Point Mongo</a>.</em></p>'
