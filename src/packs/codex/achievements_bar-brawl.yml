      content: '<p><em>Triggered when several Shit Faced crawlers start a fight with each other.</em></p><p>Triggered when multiple people with the shit faced debuff start a fight.</p><p>NEW ACHIEVEMENT: Bar Brawl</p><p>Nothing quite says pure chaos like a Bar Brawl. Congratulations, you started a fight with drunk people while drunk! There are few things I enjoy more than a bunch of stumbling idiots swinging at each other. Extra points if you crack a bottle over someone''s head!</p><p>If you survive this, then you truly are lucky.</p><p>Reward: Bronze lucky bastard box.</p><hr><p><em>Source: Community submission — Sketch. From <a href="https://pointmongo.com/browse/achievements/bar-brawl">Point Mongo</a>.</em></p>'
