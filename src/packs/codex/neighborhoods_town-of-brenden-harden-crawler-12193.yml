      content: '<p><em>A Witcher-themed floor crawling with leshies, ghouls, and drowners, centered on a heavily fortified keep.</em></p><p><strong>Population:</strong> Witcher Themed</p><p>Oh man, welcome to the world of the Witcher. More monsters than you know what to do with. Leshies, Ghouls, Fleshers, drowners, you name it we have it on this floor. I have a highly fortified keep, tall walls and defenses, top of the line (for the time period) equipment. This is one tough nut to crack. After all, with all the war going on around us, can''t be too safe.</p><hr><p><em>Source: Community submission — Brenden Harden (Crawler #12193). From <a href="https://pointmongo.com/browse/neighborhoods/town-of-brenden-harden-crawler-12193">Point Mongo</a>.</em></p>'
