    text:
      format: 1
      content: '<p><em>A continent-sized board game where Crawlers roll to move, collect gaudy fake money, solve a murder mystery, and spin the wheel of the game of life.</em></p><p>Each room is a square on a continent size map and the party must roll a dice every time they move forward to see where they land. They must collect painfully fake-looking, gaudily colored money to pay for essential bonuses, while solving a murder mystery quest, and periodically spinning a wheel to succeed at the game of life.</p><hr><p><em>Source: Community submission — PunchWizard. From <a href="https://pointmongo.com/browse/floors/board-game-maze-floor">Point Mongo</a>.</em></p>'
