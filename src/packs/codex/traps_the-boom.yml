    text:
      format: 1
      content: '<p><em>A level-1 alarm trap that immobilizes the victim in smoke before a delayed, disorienting boom — scarier than it is deadly.</em></p><p>Starts smoking on trigger, immobilizing the victim for 15 seconds; after 10 seconds it goes silent, then 2 seconds later releases a loud boom, inflicting dizziness and heart palpitations. Not especially deadly, but it takes years off your life. An Alarm-type trap — each additional level increases immobilization time, hissing/smoke duration, and boom volume.</p><hr><p><em>Source: Community submission — Alex (Crawler #1736). From <a href="https://pointmongo.com/browse/traps/the-boom">Point Mongo</a>.</em></p>'
