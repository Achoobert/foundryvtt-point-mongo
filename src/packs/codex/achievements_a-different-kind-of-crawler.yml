      content: '<p><em>Triggered when you enter the World Dungeon straight from a night of bar crawling.</em></p><p>You have descended into the World Dungeon after committing to a night of bar crawling and debauchery. 99% of the time, intoxicated humans will die within the first hour, but I''m sure you''re not like all the others, right?</p><p>Reward: Bronze Alcoholics Box</p><hr><p><em>Source: Community submission — JackWreckem. From <a href="https://pointmongo.com/browse/achievements/a-different-kind-of-crawler">Point Mongo</a>.</em></p>'
