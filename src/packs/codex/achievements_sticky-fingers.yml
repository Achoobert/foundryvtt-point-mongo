      content: '<p><em>Triggered when you steal from a Crawler in your party.</em></p><p>You have stolen something form another Crawler in your party that was not intended for you. There are no laws ''per say'' in the Dungeon that will land you to be put on trial, but let''s just hope that a jury of your peers decide not to go all vigilante justice on your ass.</p><p>Reward: You''ve received a Bronze Asshole''s Box</p><hr><p><em>Source: JackWreckem. From <a href="https://pointmongo.com/browse/achievements/sticky-fingers">Point Mongo</a>.</em></p>'
