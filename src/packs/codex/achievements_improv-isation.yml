      content: '<p><em>Triggered when you enter the World Dungeon with an improvised weapon.</em></p><p>You have entered the World Dungeon carrying objects that are...not exactly improvised, but not exactly normal either. You clearly have the ''I''ll do whatever it takes to survive'' mindset down pat, which is great because we''re gonna need to see some of that grit in the World Dungeon. Getting creative is what is needed when it comes to surviving the World Dungeon, so get in there champ and give it your all. Make daddy proud.</p><p>Reward: Bronze Adventurer Box</p><hr><p><em>Source: JackWreckem. From <a href="https://pointmongo.com/browse/achievements/improv-isation">Point Mongo</a>.</em></p>'
