      content: '<p><em>Triggered when you stumble across a stairwell to the next floor entirely by accident, out of sheer ignorance rather than skill or planning.</em></p><p>You weren''t looking for the stairwell. You were looking for literally anything else. Even a blind squirrel finds a nut sometimes. Consider this the dungeon''s way of rewarding pure, undiluted luck.</p><p>Reward: Bronze Blind Squirrel Box</p><hr><p><em>Source: Chex. From <a href="https://pointmongo.com/browse/achievements/stairmaster">Point Mongo</a>.</em></p>'
