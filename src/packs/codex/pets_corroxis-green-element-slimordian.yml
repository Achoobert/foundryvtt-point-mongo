      content: '<p><em>An acid-type Element Slimordian slime that dissolves nearly anything it touches and spits corrosive projectiles.</em></p><p><strong>Species:</strong> Element Slimordian (Green, Acid)</p><p>A toxic neon-green slime that constantly bubbles, releasing acidic fumes that hiss on contact with stone or metal. Leaves smoking trails and can spit concentrated acid projectiles strong enough to melt armor. Abilities: acid spray, corrosion, poison clouds, dissolving touch. Weaknesses: ice, alkaline substances. Personality: sadistic, cunning, territorial.</p><hr><p><em>Source: Community submission — Kyton786 (Crawler #11890). From <a href="https://pointmongo.com/browse/pets/corroxis-green-element-slimordian">Point Mongo</a>.</em></p>'
