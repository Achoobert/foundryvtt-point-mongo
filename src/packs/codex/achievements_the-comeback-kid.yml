      content: '<p><em>Triggered when you claw back from the edge of the Dying Debuff and go on to win the fight outright.</em></p><p>You were seconds from a very undignified death, and instead you turned the whole fight around. That''s not a comeback. That''s a resurrection with extra steps. The Mob that almost got you is, presumably, still processing what just happened.</p><p>Reward: Platinum Flatline Reversal Box</p><hr><p><em>Source: Chex. From <a href="https://pointmongo.com/browse/achievements/the-comeback-kid">Point Mongo</a>.</em></p>'
