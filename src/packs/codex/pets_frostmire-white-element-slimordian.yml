      content: '<p><em>An ice-type Element Slimordian slime that freezes the ground beneath it and can harden into spiked armor.</em></p><p><strong>Species:</strong> Element Slimordian (White, Ice)</p><p>A pale cyan slime with frozen crystals suspended inside, constantly forming frost around its movements. Can harden into sharp ice armor or burst into freezing shards when threatened. Abilities: ice spikes, freezing touch, snowstorm generation, defensive armor. Weaknesses: fire, sustained heat. Personality: quiet, patient, emotionless.</p><hr><p><em>Source: Community submission — Kyton786 (Crawler #11890). From <a href="https://pointmongo.com/browse/pets/frostmire-white-element-slimordian">Point Mongo</a>.</em></p>'
