    name: Carry the Team
    type: text
    text:
      format: 1
      content: '<p><em>Triggered when you solo an encounter intended for a full party, and survive it.</em></p><p>Your whole party went down, ran off, or otherwise stopped being useful, and you finished the job anyway. That''s not a compliment to them. That''s entirely a compliment to you. Somebody get this crawler a solo spin-off.</p><p>Reward: Gold One-Man-Army Box</p><hr><p><em>Source: Chex. From <a href="https://pointmongo.com/browse/achievements/carry-the-team">Point Mongo</a>.</em></p>'
