      content: '<p><em>An Orwell-inspired floor of malls, diners, and abandoned factories, where every mob speaks in passive-aggressive Midwest Nice Newspeak.</em></p><p>A nod to Orwell, this level has malls, supper clubs, diners, abandoned factories, dive bars, etc. Bosses lean on the authoritative characters from the book and mobs from the classes. You could do faction wars with the classes. Everyone speaks in a Midwest Nice Newspeak and is passive aggressive.</p><hr><p><em>Source: Community submission — "Rickles", Crawler #27220. From <a href="https://pointmongo.com/browse/floors/the-rust-belt-1984-floor">Point Mongo</a>.</em></p>'
