      content: '<p><em>A long, thin, wingless-flight-capable dragon pet in many colors, best suited to perching, grabbing, and light combat.</em></p><p><strong>Species:</strong> Asian Dragon</p><p>Comes in many colors, long and thin, mostly airborne. Has small arms and legs with sharp claws, used mainly for perching and grabbing. Abilities: wingless flight, hovering, mountable, limited speech, bite attack, highly intelligent. Weaknesses: low durability, stubborn, difficult to train.</p><hr><p><em>Source: Community submission — Rijken (Crawler #17193). From <a href="https://pointmongo.com/browse/pets/asian-dragon-pet">Point Mongo</a>.</em></p>'
