      content: '<p><em>Triggered when you survive three consecutive combat rounds under 10% Health without going down.</em></p><p>By all rights you should have been on the floor twice over. You just kept swinging. That''s either incredible willpower or a complete refusal to acknowledge basic math. Either way, the System AI respects the audacity.</p><p>Reward: Gold Flatline Box</p><hr><p><em>Source: Chex. From <a href="https://pointmongo.com/browse/achievements/unbreakable">Point Mongo</a>.</em></p>'
