    text:
      format: 1
      content: '<p><em>A non-combatant level-50 four-armed Veyr Game Guide, once a navigation officer aboard a colony ship that intercepted an alien signal.</em></p><p><strong>Type:</strong> Toyota Mechanic (Game Guide), Non-Combatant · <strong>Level:</strong> 50 · <strong>Race:</strong> Veyr · <strong>Guild:</strong> Mechanics Guild</p><p>A lean, four-armed alien in layered travel cloth and scavenged ship armor, communicating partly through subtle color shifts under translucent skin. Once a navigation officer on a long-range colony vessel that intercepted an unrecognized alien signal; landed and was accidentally entered into the world''s Dungeon Crawl. Survived and took a Floor 10 deal as a Game Guide.</p><hr><p><em>Source: Community submission — Kyton786 (Crawler #11890). From <a href="https://pointmongo.com/browse/npcs/vorren-ka-game-guide">Point Mongo</a>.</em></p>'
