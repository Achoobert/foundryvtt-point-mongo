    text:
      format: 1
      content: '<p><em>Triggered when you enter the World Dungeon with a fellow criminal.</em></p><p>You have entered the World Dungeon with another Crawler who, like you, has intentionally broken the law. How do we know this? Fuck you, that''s how, maybe you should be more focused on the fact that there is a literal fellow crime junkie in your party, sneaking, plotting, conniving. Or maybe they''re genuinely helpful, honor among thieves and all that jazz. Who knows, really. It''s a good thing you probably already know it is, right?</p><p>Reward: Bronze Naughty Boy Box</p><hr><p><em>Source: JackWreckem. From <a href="https://pointmongo.com/browse/achievements/less-than-reputable">Point Mongo</a>.</em></p>'
