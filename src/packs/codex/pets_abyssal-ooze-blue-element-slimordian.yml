      content: '<p><em>A water-type Element Slimordian slime with a fluid, shapeless body that hides by flattening into puddles.</em></p><p><strong>Species:</strong> Element Slimordian (Blue, Water)</p><p>A deep-blue aquatic slime with a fluid, wave-like body that never holds a fixed shape, containing drifting fish bones, pearls, and glowing algae. Moves silently like flowing water and can flatten into a puddle to hide or ambush prey. Abilities: water manipulation, healing regeneration, tidal waves, drowning grasp. Weaknesses: electricity, extreme dehydration. Personality: calm, observant, mysterious.</p><hr><p><em>Source: Community submission — Kyton786 (Crawler #11890). From <a href="https://pointmongo.com/browse/pets/abyssal-ooze-blue-element-slimordian">Point Mongo</a>.</em></p>'
