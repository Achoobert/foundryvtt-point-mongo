      content: '<p><em>The village''s theme stays whatever it was — it just gets renamed to something the System AI and Borant won''t notice, but other Crawlers might.</em></p><p><strong>Population:</strong> Nothing changed, just a messed-up name</p><p>I think I''d leave the village''s theme whatever it was, and just name it something messed up that the System AI and Borant wouldn''t notice, but that other Crawlers might recognize, like "Hasa Diga Eebowai" (a song from "The Book of Mormon" - IYKYK).</p><hr><p><em>Source: Community submission — Myles L.. From <a href="https://pointmongo.com/browse/neighborhoods/hasa-diga-eebowai">Point Mongo</a>.</em></p>'
