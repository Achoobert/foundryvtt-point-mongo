      content: '<p><em>A tiny settlement of blue-skinned, Gaelic warlock folk living in cozy mushroom houses, kilted and armed with massive claymores.</em></p><p><strong>Population:</strong> Savage, warlock people of Gaelic descent, skin dyed blue.</p><p>Small settlement, only 3 apples high. Cozy mushroom houses, with chimney''s wafting pleasant woodsmoke into the air. Residents are dressed in kilts, carrying massive Claymore swords and spoiling for a chance to use them. The music of fife and bagpipes drift lazily through the air.</p><hr><p><em>Source: Community submission — DeaDPaN79. From <a href="https://pointmongo.com/browse/neighborhoods/town-of-deadpan79">Point Mongo</a>.</em></p>'
