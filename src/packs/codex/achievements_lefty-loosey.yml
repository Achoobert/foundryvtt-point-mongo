    name: Lefty Loosey!
    type: text
    text:
      format: 1
      content: '<p><em>Triggered when a crawler correctly turns a bolt or nut in the right direction on the first try.</em></p><p><strong>Scenario:</strong> Crawler turns a nut/bolt in the correct direction</p><p>You correctly turned a fastener in the correct direction, on the very first try. Your dad would be soooo proud, too bad he''s likely dead, along with the rest of your loved ones, while you''re trapped here in this nightmare Dungeon.</p><p><strong>Suggested Rewards:</strong></p><p>A bronze loot box containing a white singlet (more commonly known in the past as a "wife beater") - +1 permanent buff to your skill rolls with tool / implement based attacks and checks.</p><hr><p><em>Source: Community submission — DeaDPaN79 (Crawler #1945). From <a href="https://pointmongo.com/browse/achievements/lefty-loosey">Point Mongo</a>.</em></p>'
