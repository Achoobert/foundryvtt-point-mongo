      content: '<p><em>Triggered when you rescue a crawler being held hostage by a boss.</em></p><p>You have successfully rescued another Crawler from being held hostage by a boss. Look at you, saving Crawlers in distress like that. Just a shame that your princess is in another castle, leaving you to deal with the giant fire-breathing turtle. But hey, at least you have back-up now!</p><p>Reward: Gold Savior Box</p><hr><p><em>Source: Community submission — JackWreckem. From <a href="https://pointmongo.com/browse/achievements/now-for-that-dragon">Point Mongo</a>.</em></p>'
