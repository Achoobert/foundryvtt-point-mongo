    text:
      format: 1
      content: '<p><em>A brilliant, arrogant High Elf lawyer who wins fairly but makes everyone involved regret ever meeting her.</em></p><p><strong>Type:</strong> Lawyer · <strong>Race:</strong> High Elf</p><p>An "I''m better than you at everything" lawyer who thrives on inflicting embarrassing courtroom defeats. Never lies, cheats, or scams to win, but her arrogance makes clients and opponents alike wish she would, just to justify how insufferable she is. She''ll win your case — at what personal cost to your patience is another matter.</p><hr><p><em>Source: Community submission — JackWreckem (Crawler #36320). From <a href="https://pointmongo.com/browse/npcs/katrina-goldstone">Point Mongo</a>.</em></p>'
