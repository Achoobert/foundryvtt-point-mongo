      content: '<p><em>Triggered when your first combat spell fizzles and does nothing.</em></p><p>You cast your first combat spell while fighting for your life, only for it to fizzle out and do absolutely nothing, which, you know, sucks. Perhaps if you live long enough to be able to read this, you''ll practice a little bit more so you won''t run into this problem again in the very, very near future.</p><p>Maybe.</p><p>Reward: Bronze Arcane Box</p><hr><p><em>Source: Community submission — JackWreckem. From <a href="https://pointmongo.com/browse/achievements/wizarding-101">Point Mongo</a>.</em></p>'
