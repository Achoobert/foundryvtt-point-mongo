    text:
      format: 1
      content: '<p><em>A squirrel companion sent out to loot corpses for its crawler, collecting "nuts" off defeated monsters.</em></p><dl class="stat-block"><dt>Species</dt><dd>Squirrel</dd><dt>Stats</dt><dd>Level 1</dd></dl><p>A squirrel pet that can loot for its crawler when there''s a lot of corpses (they collect nuts, why not loot corpses?). Sent out to collect the "Nuts" off the monsters being fought.</p><p><strong>Changes after entering the Dungeon:</strong> Perhaps his pet biscuit lets him get bigger, like wolf size, for short periods of time to fight.</p><hr><p><em>Source: Community submission — Socks (Crawler #4381). From <a href="https://pointmongo.com/browse/pets/skippy-the-wonder-squirrel">Point Mongo</a>.</em></p>'
