    text:
      format: 1
      content: '<p><img src="https://pointmongo.com/img/entries/pets-cactaur.jpg"></p><p><em>A cactus-horse with spines on every attack that fires back a needle blast at anything that hits it in melee.</em></p><p>They say it was created by a mad mage, but I asked and none of them admitted to this. Still, this cactus-horse abomination isn’t the sickest shit in the dungeon. In fact, it’s pretty tame. Just don’t be surprised if everyone laughs at you when you throw one of these at them.</p><p>Size: Infant - Medium, Adult - Huge</p><p>Bonded Role: Aggressive</p><p>Move 60ft</p><p>Spines: Adds an additional +F damage to all attacks</p><p>Back Claw and Bite</p><p>Level 15 Benefits:</p><p>Needle Blast: 60ft range, Fd10 Piercing damage. Note: The Cactaur will automatically cast Needle Blast, with advantage, against enemies that hit it in Melee.</p><hr><p><em>Source: Community submission — Drossithrax. From <a href="https://pointmongo.com/browse/pets/cactaur">Point Mongo</a>.</em></p>'
