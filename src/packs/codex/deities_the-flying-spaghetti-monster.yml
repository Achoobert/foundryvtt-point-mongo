    text:
      format: 1
      content: '<p><em>The noodly god of Pastafarianism, who rewards worshippers with Intelligence and a colander helmet and sends them on piratical, irreverent quests.</em></p><p>The deity of Pastafarianism, The Flying Spaghetti Monster is a tangle of noodles around meatballs with eyes on noodle stalks. Crawlers can gain a colander helmet dedicated to this deity, and worshippers gain Intelligence. Pirates are considered the original Pastafarians, and worshippers are expected to be rebellious and satirical, so crawlers may be given quests based around piracy, as well as protest and mockery of other religions.</p><hr><p><em>Source: Community submission — SuperBob. From <a href="https://pointmongo.com/browse/deities/the-flying-spaghetti-monster">Point Mongo</a>.</em></p>'
