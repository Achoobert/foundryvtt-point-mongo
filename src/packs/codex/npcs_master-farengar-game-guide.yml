    text:
      format: 1
      content: '<p><em>A level-50 half-elf mage Game Guide, sentenced by the Borant System to 50 seasons of guiding crawlers instead of facing execution.</em></p><p><strong>Type:</strong> Game Guide (Mage) · <strong>Level:</strong> 50 · <strong>Race:</strong> Half Elf · <strong>Guild:</strong> Potions</p><p>Has no idea how he ended up in the dungeon — one minute plane-hopping, the next facing the Borant System for unspecified crimes, given a choice of death or 50 seasons as a Game Guide. 32 seasons in, he''s no stranger to the dungeon and might just keep his crawlers alive.</p><hr><p><em>Source: Community submission — Brenden Harden (Crawler #12193). From <a href="https://pointmongo.com/browse/npcs/master-farengar-game-guide">Point Mongo</a>.</em></p>'
