    text:
      format: 1
      content: '<p><em>Triggered when a crawler tries to retreat back up the stairwell instead of descending, hurting themselves in the attempt.</em></p><p><strong>Scenario:</strong> Crawler balks while descending the stairwell</p><p>You had enough nerves to come into the stairway, but you tried so hard to go back up the stairs that you damaged yourself. That is not how this works, so F U.</p><p><strong>Suggested Rewards:</strong></p><p>You are compelled to go downstairs for the next three floors, and if you don''t, well, we will deal with that when you do that, you coward.</p><hr><p><em>Source: Community submission — Alex (Crawler #1736). From <a href="https://pointmongo.com/browse/achievements/back-tracker">Point Mongo</a>.</em></p>'
