    text:
      format: 1
      content: '<p><img src="https://pointmongo.com/img/entries/mounts-headless-mule.png"></p><p><em>A fire-necked mule that kicks, gallops and casts Fear, yours for 35,000 gold.</em></p><p>This odd creature has the body of a mule and fire shooting out of its neck. Legend tell of its speed, strong kicks and, despite the absence of a head, a terrifying neigh that can be heard from a distance.</p><p>Size: Large (5)</p><p>If purchased, it costs 35.000 gold.</p><p>- They have a Regular Trample attack</p><p>- They can cast Fear as a natural spell [Rank=F] with a 5 hour cooldown</p><hr><p><em>Source: Community submission — Gabe M. From <a href="https://pointmongo.com/browse/mounts/headless-mule">Point Mongo</a>.</em></p>'
