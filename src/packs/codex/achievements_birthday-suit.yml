    text:
      format: 1
      content: '<p><em>Triggered when a party of crawlers enters the World Dungeon completely naked.</em></p><p><strong>Scenario:</strong> Outside, skinny dipping at the time of collapse.</p><p>You, and your party of Crawlers entered the World Dungeon as a naked as the day you were born. Poor Little Stupid.</p><p><strong>Suggested Rewards:</strong></p><p>Here''s a towel. I''m told "It''s about the most massively useful thing an interstellar hitchhiker can have"...it''s a skirt, a toga, a shawl, a weapon, hell...just be thankful I''m feeling generous.</p><hr><p><em>Source: Community submission — DeaDPaN79 (Crawler #1945). From <a href="https://pointmongo.com/browse/achievements/birthday-suit">Point Mongo</a>.</em></p>'
