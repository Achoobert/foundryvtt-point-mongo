    name: Invincibility Frames
    type: text
    text:
      format: 1
      content: '<p><em>Triggered when you dodge a boss''s area of effect attack.</em></p><p>You have successfully dodged a boss''s area of effect attack. What do you think this is, Dark Souls or something? You can''t just dodge roll and expect to walk away scot-free every time. This is real life, you''re in real danger, and it''s really, really boring if you''re not swinging back at the boss. Get back in there and make the boss dodge you for once.</p><p>Reward: Silver Lucky Bastard Box</p><hr><p><em>Source: Community submission — JackWreckem. From <a href="https://pointmongo.com/browse/achievements/invincibility-frames">Point Mongo</a>.</em></p>'
