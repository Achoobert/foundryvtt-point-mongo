      content: '<p><em>Small, screaming rabbit-like rodents that build static charge and can be thrown for a stunning shock attack.</em></p><p><strong>Species:</strong> Pika Bomber</p><p>Small rodent-like members of the rabbit family known for sonic "eep" screams that fend off predators. Pocket-sized at 6-8" and 4-12 oz, they can build a static charge and be thrown at mobs for a devastating stun attack.</p><hr><p><em>Source: Community submission — Ogrekin (Crawler #30788). From <a href="https://pointmongo.com/browse/pets/pika-bombers">Point Mongo</a>.</em></p>'
