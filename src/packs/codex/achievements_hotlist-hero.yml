      content: '<p><em>Triggered when you save your own life or an ally''s using an item you had preloaded on your Hotlist.</em></p><p>All that time organizing your Hotlist instead of paying attention to the fight finally paid off. One thought, one lifesaving item, zero fumbling through your Inventory while dying. Efficiency. We love to see it.</p><p>Reward: Silver Speed Dial Box</p><hr><p><em>Source: Chex. From <a href="https://pointmongo.com/browse/achievements/hotlist-hero">Point Mongo</a>.</em></p>'
