    text:
      format: 1
      content: '<p><em>A pseudo-religious sponsor organization awaiting ''The Great Spit,'' funding crawlers who cause chaos without harming cameloid creatures.</em></p><p>A pseudo-religious organization preparing for what it calls "llamageddon" or "the alpacalypse," holding firm to a prophecy it believes leads to "The Great Spit." Sponsors crawlers who cause as much chaos and destruction as possible, so long as no cameloid (or semi-cameloid) creature is harmed in the process.</p><hr><p><em>Source: Community submission — John (Crawler #25497). From <a href="https://pointmongo.com/browse/sponsors/church-of-the-mad-llama">Point Mongo</a>.</em></p>'
