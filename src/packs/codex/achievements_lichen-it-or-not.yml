      content: '<p><em>Triggered when you eat, lick, or otherwise personally test the orange lichen growing along the Second Floor''s cinder block walls.</em></p><p>You looked at unidentified alien fungus growing on a dungeon wall and thought, "yeah, I''ll have a taste." Bold. Reckless. Weirdly on-brand for this floor. The System AI has added a content warning to the broadcast, purely for comedic effect.</p><p>Reward: Bronze Dietary Choices Box</p><hr><p><em>Source: Chex. From <a href="https://pointmongo.com/browse/achievements/lichen-it-or-not">Point Mongo</a>.</em></p>'
