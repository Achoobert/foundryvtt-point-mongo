      content: '<p><em>Triggered when you successfully navigate a meaningful portion of the dungeon without consulting the map or mini-map.</em></p><p>You navigated without relying on your map. Either you possess an incredible sense of direction, or you are spectacularly lost. The System AI has decided to reward your confidence.</p><p>Reward: Silver Lucky Bastard Box</p><hr><p><em>Source: Chex. From <a href="https://pointmongo.com/browse/achievements/maps-are-for-cowards">Point Mongo</a>.</em></p>'
