    text:
      format: 1
      content: '<p><em>A gem-skinned frog that must be gifted rather than bought, granting a daily dose of AI Favor at Level 15.</em></p><p>These small green frogs have an odd reflective skin, giving them the appearance of living gems or jewelry. They don''t grow much, always staying Tiny (Size 1)</p><p>Bonding: You must bathe and polish a Muiraquitã to get it to bond with you. Muiraquitã will never bond with someone who purchases it, but will instantly bond if given as gifts.</p><p>Level 15 Benefit</p><p>Muiraquitã is the bringer of good luck. Once per day it gives the benefits of using AI Favor.</p><hr><p><em>Source: Community submission — Gabe M. From <a href="https://pointmongo.com/browse/pets/muiraquit">Point Mongo</a>.</em></p>'
