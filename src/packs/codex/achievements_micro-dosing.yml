    text:
      format: 1
      content: '<p><em>Triggered when you let yourself get poisoned on purpose.</em></p><p>You intentionally allowed yourself to become poisoned, in what our viewers believe is an attempt to stave off future Poison effects by micro-dosing it in whatever form you took it in. Well here''s a newsflash for you, moron, that isn''t going to work down here. If you poison yourself on purpose, you''re just going to take damage on purpose, but you do you I guess.</p><p>Reward: You are alive to read this, so clearly you didn''t kill yourself. That''s reward enough.</p><hr><p><em>Source: Community submission — JackWreckem. From <a href="https://pointmongo.com/browse/achievements/micro-dosing">Point Mongo</a>.</em></p>'
