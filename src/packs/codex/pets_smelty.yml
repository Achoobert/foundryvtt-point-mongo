      content: '<p><em>A fire-backed sloth pet that helps with crafting by heating to melting temperatures.</em></p><p><strong>Species:</strong> Smelty</p><p>Like a sloth, but with fire coming off its back — hot enough to melt almost anything, making it useful for crafting. Can grow to prehistoric-ground-sloth size, so it can reduce its own heat for its crawler''s benefit, though oven mitts are still recommended.</p><hr><p><em>Source: Community submission — Alex (Crawler #1736). From <a href="https://pointmongo.com/browse/pets/smelty">Point Mongo</a>.</em></p>'
