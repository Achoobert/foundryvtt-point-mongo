    text:
      format: 1
      content: '<p><em>A Volkswagen-Beetle-sized, drivable narwhal-car hybrid pet that spears or runs over prey, complete with headlights.</em></p><p><strong>Suggested Name:</strong> n/a</p><p>This planet had a rare creature called a narwhal. These creatures lived in the sea but had a single horn. Like the unicorn of the ocean. They could swim, they could spear, and they could kill. The one thing that stopped them was they weren''t able to survive on land. That has changed. This pet is kind of like that. But it''s the size of a Beetle. Not the insect. The car. The suspension creaks and groans when it moves, but the horn still protrudes from the front, speaking anything that gets in the way. Just missed with the horn? The tires will get you. This pet, rather than being ridden, can be driven. And there''s a switch so you can turn the headlights off to creep around, then turn them on to blind your prey before either squishing or sticking. And after every kill, it stops and addresses the new roadkill: "Bye, buddy. Hope you find your dad!"</p><hr><p><em>Source: Community submission — Mark Harrison (Crawler #—). From <a href="https://pointmongo.com/browse/pets/carwhal">Point Mongo</a>.</em></p>'
