      content: '<p><em>Triggered when you survive a Boss Blitz: one boss fight with two or more bosses in it.</em></p><p>You have survived a Boss Blitz! What exactly is a Boss Blitz, you might ask? Well you see, actions you Crawlers makes have consequences, and these consequences line up in such a way that it causes the boss fight you just had to have not one, but two (or more) bosses in it making your job way, way harder than it needed to be in the first place! I mean, talk about incredible! Since I have absolutely zero faith in your ability to actually learn from the consequences of your actions, the odds are really good that you''ll likely encounter another one in the future, which, honestly, is great for our viewers.</p><p>Reward: Gold YOLO Box</p><hr><p><em>Source: Community submission — JackWreckem. From <a href="https://pointmongo.com/browse/achievements/ballroom-blitz">Point Mongo</a>.</em></p>'
