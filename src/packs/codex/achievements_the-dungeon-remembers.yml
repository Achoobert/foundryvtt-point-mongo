      content: '<p><em>Triggered when you return to an area on the 1st Floor after previously discovering something there and use that knowledge to avoid a trap, solve a puzzle, find a shortcut, or gain an advantage.</em></p><p>You remembered what the dungeon showed you. More importantly, you used that knowledge against it.</p><p>Reward: Bronze Dungeon Delvers Box</p><hr><p><em>Source: Chex. From <a href="https://pointmongo.com/browse/achievements/the-dungeon-remembers">Point Mongo</a>.</em></p>'
