    name: Mesmerized (Debuff)
    type: text
    text:
      format: 1
      content: '<p><em>Drawn helplessly toward the Mean Green Mother and unable to attack it, until taking damage snaps you out of it.</em></p><p>While Mesmerized, crawlers cannot attack the Mean Green Mother and must use all Movement action to move towards the Mean Green Mother. Each time a crawler takes any damage, they may make a DC 15+F+INT Check to end this Debuff.</p><hr><p><em>Source: Community submission — BlessedPsycho, Crawler #26,933. From <a href="https://pointmongo.com/browse/buffs-debuffs/mesmerized-debuff">Point Mongo</a>.</em></p>'
