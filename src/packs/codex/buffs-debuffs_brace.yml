      content: '<p><em>Halves non-magical damage from attackers who started the round more than 5 feet away.</em></p><p>While you have the Brace buff, you will reduce non-magical damage done to you by half if the enemy attacker did not start within a 5ft range at the start of this current Round of combat.</p><hr><p><em>Source: Community submission — JackWreckem. From <a href="https://pointmongo.com/browse/buffs-debuffs/brace">Point Mongo</a>.</em></p>'
