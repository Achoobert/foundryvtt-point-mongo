      content: '<p><em>A lightning-type Element Slimordian slime that moves in electric-current bursts and can unleash chain lightning.</em></p><p><strong>Species:</strong> Element Slimordian (Yellow, Lightning)</p><p>A bright yellow slime crackling with unstable electricity, arcing across its gelatinous body and sparking nearby objects. Moves in sudden bursts, almost teleporting through electrical currents. Abilities: electric shocks, speed bursts, EMP pulse, chain lightning. Weaknesses: grounding materials, water overload. Personality: hyperactive, chaotic, unpredictable.</p><hr><p><em>Source: Community submission — Kyton786 (Crawler #11890). From <a href="https://pointmongo.com/browse/pets/voltex-yellow-element-slimordian">Point Mongo</a>.</em></p>'
