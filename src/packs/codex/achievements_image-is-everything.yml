      content: '<p><em>Awarded for staying immaculately groomed while the world ends around you.</em></p><p>Not everyone has the sense of mind to dress for success when the world just pancaked. Good for you! You would not believe how much people let themselves go when "everything is gone".  Not you though it seems, dressed to the 9''s with a freshly trimmed beard, the ladies are gonna love you, and the fellas. But we can talk about passes to see your backstage later, for now see if there are any mobs that could.....use a trim. Gooood Luck</p><p>Reward: One Vanity Box</p><hr><p><em>Source: Community submission — AI Bogboi. From <a href="https://pointmongo.com/browse/achievements/image-is-everything">Point Mongo</a>.</em></p>'
