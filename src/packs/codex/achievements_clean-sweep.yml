      content: '<p><em>Triggered when you fully clear a Neighborhood in a single push, without retreating to a saferoom at any point.</em></p><p>Top to bottom, wall to wall, you cleared the whole Neighborhood without once running back to rest. That''s either impressive stamina or a genuine lack of self-preservation instinct. We''re choosing to believe it''s the former. For your sake.</p><p>Reward: Silver Overachiever''s Box</p><hr><p><em>Source: Chex. From <a href="https://pointmongo.com/browse/achievements/clean-sweep">Point Mongo</a>.</em></p>'
