      content: '<p><em>Triggered when a crawler bites into a mob to see what it tastes like.</em></p><p><strong>Scenario:</strong> Crawler bites another mob</p><p>You have taken a bite out of a mob; does the taste of uncooked flesh, slime, or any other type of viscera make you drool, or are you just that hungry? anyway you now know what taking a bite out of a mob that means to kill you tastes like.</p><p><strong>Reward:</strong></p><p>A bronze Oral hygiene Box</p><hr><p><em>Source: Community submission — Alex (Crawler #1736). From <a href="https://pointmongo.com/browse/achievements/chomper">Point Mongo</a>.</em></p>'
