      content: '<p><em>A fire-type Element Slimordian slime made of molten gel and embers that grows more aggressive the hotter it gets.</em></p><p><strong>Species:</strong> Element Slimordian (Red, Fire)</p><p>A blazing entity of molten gel and living embers, glowing orange and crimson with magma-like veins beneath its surface; flames flicker constantly from its shoulders. Grows larger and more aggressive when exposed to heat, feeding on sparks, lava, and burning materials. Abilities: fire blasts, heat aura, molten body, explosive splitting. Weaknesses: water, cold environments. Personality: aggressive, prideful, impatient.</p><hr><p><em>Source: Community submission — Kyton786 (Crawler #11890). From <a href="https://pointmongo.com/browse/pets/pyraxis-red-element-slimordian">Point Mongo</a>.</em></p>'
