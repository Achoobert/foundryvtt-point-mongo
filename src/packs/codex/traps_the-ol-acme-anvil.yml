    name: The Ol' Acme Anvil
    type: text
    text:
      format: 1
      content: '<p><em>A classic falling-anvil gag trap, triggerable via button, rope, or sticky pressure plate, for variable but likely heavy damage.</em></p><p>A classic of Earth cartoons, this gag has brought a smile to the faces of countless children (Earth has such a violent culture, doesn''t it? Good thing we annihilated most of their population and trapped the survivors inside the dungeon so they could really go wild!). Triggered by a red button too tantalizing to ignore, a rope to nowhere, or, my personal favorite, a sticky pressure plate, this trap is heralded by the ominous whistling and looming shadow of a 500lb anvil falling much faster and from much farther than should be possible inside the dungeon. You know what they say: if it ain''t broke, drop an anvil on it! (Note: anvil may be substituted for pianos, elephants, or boiling pots of tar followed by a bag of feathers) Damage: Variable, but probably a lot.</p><hr><p><em>Source: Community submission — Rijken (Crawler #17193). From <a href="https://pointmongo.com/browse/traps/the-ol-acme-anvil">Point Mongo</a>.</em></p>'
