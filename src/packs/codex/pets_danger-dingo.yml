      content: '<p><em>A kobold''s mistreated dingo that repays kindness, hitting for an extra 1d6 after a twenty-foot run-up.</em></p><p>Bonding: kobolds do not treat their Dingoes kindly. Danger Puppies will quickly respond to affection.</p><p>Level 15 benefit:</p><p>Ravager: if the Dagger Dingo moved at least 20ft before making an attack, add +1d6 to is base damage.</p><p>This increases by 1d6 every fifth floor.</p><hr><p><em>Source: Community submission — Gabe M. From <a href="https://pointmongo.com/browse/pets/danger-dingo">Point Mongo</a>.</em></p>'
