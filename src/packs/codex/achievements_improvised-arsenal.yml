      content: '<p><em>Triggered when you turn a piece of mundane Bronze-tier gear into an effective improvised weapon.</em></p><p>You looked at a canoe paddle, or a bicycle, or fifty feet of rope, and saw a weapon instead of a tool. That''s the kind of lateral thinking that keeps crawlers alive. Also the kind that makes insurance adjusters weep. Good thing there''s no insurance here.</p><p>Reward: Silver MacGyver Box</p><hr><p><em>Source: Chex. From <a href="https://pointmongo.com/browse/achievements/improvised-arsenal">Point Mongo</a>.</em></p>'
