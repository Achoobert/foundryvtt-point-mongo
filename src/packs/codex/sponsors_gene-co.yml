      content: '<p><em>A sponsor that finances organs, synthetic or organic, and sends the Repoman when the payments stop.</em></p><p>Health Subsidized company for ''legally'' lending out synthetic and organic organs to those who need or want. Finance the best organs today.</p><p>Notes: Generally their head of company will sponsor a god, usually one with renown for innovation and health practices, their sponsored gifts can upgrade or replace one of their current organs. Through their cycles of sponsorship they have a class that gets adapted, not always picked up. But through the god someone can reclaim their gifts if tithes are not paid. The Repoman.</p><hr><p><em>Source: Community submission — Bastionjack. From <a href="https://pointmongo.com/browse/sponsors/gene-co">Point Mongo</a>.</em></p>'
