    text:
      format: 1
      content: '<p><em>A puddle-disguised psychic trap that traps the mind in an infinite hall of mirrors unless the victim identifies the real reflection.</em></p><p>Looks like an ordinary puddle; stepping over it triggers vertigo and drops the crawler into an endless maze of mirrors and repeating images of themselves. The Puzzle: the crawler must identify the one reflection NOT in a mirror and say so — mirrors shatter and are replaced as they''re crashed through, stretching endlessly in both directions. Failing traps the crawler''s mind here indefinitely while their body stands motionless (with slightly wet feet) back in the dungeon. Psychic immunity or psychiatry skills help provide clues to escape.</p><hr><p><em>Source: Community submission — K8 (Crawler #71). From <a href="https://pointmongo.com/browse/traps/the-mirror-maze">Point Mongo</a>.</em></p>'
