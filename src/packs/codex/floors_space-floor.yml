      content: '<p><em>A zero-physics floor where Crawlers suit up and navigate spaceships and spacewalks — pop your suit and you''d better have repair options ready.</em></p><p>Completely breaking the law of physics, Crawlers are issued a space suit and forced to navigate the space-themed level via spaceships and spacewalks. Better fly carefully though, because if that suit pops, you only have so many repair options.</p><hr><p><em>Source: Community submission — Jessica Fates. From <a href="https://pointmongo.com/browse/floors/space-floor">Point Mongo</a>.</em></p>'
