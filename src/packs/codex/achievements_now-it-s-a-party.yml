      content: '<p><em>Triggered when you enter the World Dungeon with other humans.</em></p><p>You have descended into the World Dungeon to take on the many trials and tribulations that lay within with other humans! You know what they say, teamwork makes the dream work. Let''s hope your new party is completely trustworthy and not at all willing to sacrifice you in the sake of an extra stat point!</p><p>Reward: Teamwork. Companionship. Comradery. These are all rewarding in their own right.</p><hr><p><em>Source: JackWreckem. From <a href="https://pointmongo.com/browse/achievements/now-it-s-a-party">Point Mongo</a>.</em></p>'
