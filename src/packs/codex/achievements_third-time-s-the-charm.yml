    text:
      format: 1
      content: '<p><em>Triggered when you fail at the same task twice and then succeed spectacularly on the third attempt.</em></p><p>You failed twice and succeeded on the third attempt.</p><p>Statistically, this proves absolutely nothing.</p><p>Emotionally, however, it feels fantastic.</p><p>The System AI would also like to point out that most competent crawlers call this "getting it right the first time."</p><p>Reward: Silver Lucky Bastard Box</p><hr><p><em>Source: Chex. From <a href="https://pointmongo.com/browse/achievements/third-time-s-the-charm">Point Mongo</a>.</em></p>'
