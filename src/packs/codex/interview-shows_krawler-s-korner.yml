    text:
      format: 1
      content: '<p><em>Alright boys and girls, it is time for everyone''s favorite storytime segment! Join Nanny''s guests for stories, questions, and games on this popular tunnel show for kids!</em></p><p>A children’s show format where Crawlers interact with the small children of the galaxy by reading them stories, answering questions and playing games. Hosted by a disembodied former Crawl A.I. called “Nanny” who expects the format the be wholesome, child friendly and fun. Participation is mandatory.</p><hr><p><em>Source: Moonshadow Dark. From <a href="https://pointmongo.com/browse/interview-shows/krawler-s-korner">Point Mongo</a>.</em></p>'
