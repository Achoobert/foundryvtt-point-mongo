      content: '<p><em>One strange little detail an item has, with no effect on the rules.</em></p><p>Used by the <a href="/loot">Loot Generator</a> as a prompt for item descriptions: one odd detail with no effect on the rules. It hums near goblins, it is always slightly warm, it smells of popcorn. A few to start with; the rest is up to the community.</p><p>Have something to add? Press <strong>+ Suggest a row</strong> above the table, or the pencil beside a row to suggest a change. It comes to us for a quick look, then goes in with your name on it.</p><table><tbody><tr><th>unique</th><td>false</td></tr><tr><th>lootGenerator</th><td>quirks</td></tr></tbody></table><hr><p><em>Source: Point Mongo Team. From <a href="https://pointmongo.com/browse/roll-tables/loot-generator-odd-quirks">Point Mongo</a>.</em></p>'
