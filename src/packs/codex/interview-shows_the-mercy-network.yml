      content: '<p><em>A charity-framed tunnel series that turns the five lowest-ranked crawlers'' survival into a managed, monitored spectacle.</em></p><p>Brings the five lowest-ranked crawlers onto the show, shows them how they''re faring against the field, and grants "mercy drops." Framed as a charity program, but really turns survival itself into a monitored, adjusted, sustained-for-engagement spectacle.</p><hr><p><em>Source: Community submission — Kyton786 (Crawler #11890). From <a href="https://pointmongo.com/browse/interview-shows/the-mercy-network">Point Mongo</a>.</em></p>'
