      content: '<p><em>Crawlers pick a side in a war between raiding Vikings and defending Saxons, ending in a showdown with the opposing faction''s leader.</em></p><p>Crawlers must choose a side on this war between Vikings and Saxons. They can either help the Saxon Villages survive raids against the invaders, or join the Vikings in pillaging the towns. Choosing either side will likely put them against the opposing faction''s leader, like King Alfred and the Anglo-Saxon Fyrds.</p><hr><p><em>Source: Community submission — Brenden Harden (Crawler #12193). From <a href="https://pointmongo.com/browse/floors/vikings-vs-saxons">Point Mongo</a>.</em></p>'
