    text:
      format: 1
      content: '<p><em>A Shark Tank parody where inventive crawlers pitch dungeon inventions to five bickering intergalactic business tycoons.</em></p><p><strong>Panel:</strong> 5 "Octo-Sharks" — Zark Qban, Mori Greener, KhevN O''H''Lry, Cor Coran, Lubet Zky · <strong>Sponsor:</strong> The Squim Congoomerate</p><p>Inventive crawlers pitch new dungeon inventions to a panel of five intergalactic business tycoons who spend as much time sniping at each other as they do feigning interest. Hosts rarely engage for anything less than a controlling stake in the product.</p><hr><p><em>Source: Community submission — DeaDPaN79 (Crawler #1945). From <a href="https://pointmongo.com/browse/interview-shows/octo-shark-tank">Point Mongo</a>.</em></p>'
