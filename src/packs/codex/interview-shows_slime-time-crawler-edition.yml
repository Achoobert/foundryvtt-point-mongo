      content: '<p><em>A viewer-voted team competition among three jello-slime crawlers, with a consume-at-your-own-risk vial prize.</em></p><p><strong>Contestants:</strong> Swee Pea (Yellow), J. Fates (Red), Ashley (Green) · <strong>Sponsor:</strong> Self-Produced</p><p>Teams are voted for by adoring viewers; winners get their own vial of slime to do with as they wish. Small print: no liability for side effects if a crawler decides to consume it.</p><hr><p><em>Source: Community submission — The Royal Grumble (Crawler #9002). From <a href="https://pointmongo.com/browse/interview-shows/slime-time-crawler-edition">Point Mongo</a>.</em></p>'
