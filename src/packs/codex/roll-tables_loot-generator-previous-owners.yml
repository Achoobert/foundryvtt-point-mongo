      content: '<p><em>Who had the item before the crawler did. Waiting for its first rows.</em></p><p>Used by the <a href="/loot">Loot Generator</a> as a prompt for item descriptions: who owned this thing before it ended up in a loot box? A retired dentist, a mall Santa, a very small goblin. This one is for the community to fill.</p><p>Have something to add? Press <strong>+ Suggest a row</strong> above the table, or the pencil beside a row to suggest a change. It comes to us for a quick look, then goes in with your name on it.</p><table><tbody><tr><th>unique</th><td>false</td></tr><tr><th>lootGenerator</th><td>owners</td></tr></tbody></table><hr><p><em>Source: Point Mongo Team. From <a href="https://pointmongo.com/browse/roll-tables/loot-generator-previous-owners">Point Mongo</a>.</em></p>'
