      content: '<p><em>A second take on the rude-lawn-gnome village — same off-putting antics, this time from the Garden Gnome population.</em></p><p><strong>Population:</strong> Garden Gnomes</p><p>These ain''t your grandmas sweet innocent lawn gnomes holding pretty flowers. Everywhere you look, there is a lawn gnome doing something...a little off putting. There could be one pissing on a building, another fornicating on a balcony (or street). Maybe they are just disassembling the vehicle you just parked at the Saferoom. The strangest thing is they freeze in place when you look directly at them.</p><hr><p><em>Source: Community submission — Orion Kannan, Crawler #7729. From <a href="https://pointmongo.com/browse/neighborhoods/village-of-rude-lawn-gnomes-garden-gnome-variant">Point Mongo</a>.</em></p>'
