    name: Duneblazer Missile Scorpion
    type: text
    text:
      format: 1
      content: '<p><em>A Huge, tameable armored scorpion that fires magic missiles or self-crafted real missiles from its tail.</em></p><p>Size: Large</p><p>Price: 35,000g</p><p>Move: 30ft</p><p>Step: 10ft</p><p>An armor-plated scorpion the size of a tank. Its tail that curls up and over it has not a stinger, but a missilepod. It is capable of using mana to fire Magic Missiles, or actual Missiles. Its body can naturally build regular Missiles by consuming lots of scrap metals. Instead of poison, the Duneblazer Missile Scorpion instead processes fuel through its body, which allows it to fuel its bodily-crafted missiles. Don''t let this creature''s long-range ability fool you, it is just as dangerous up close as well, with its armor-plated carapace and pincers that can easily cleave a school bus in half. Though temperamental, these creatures can be tamed and used as mounts. They were once the chosen mounts of the nomadic Duneblazer Clan of Sandswept Goblins.</p><p>Actions:</p><p>-Magic Missile: This mount can cast Magic Missile (Rank 5) from its missile pod tail.</p><p>-Literal Missile: This mount can fire an actual short-range (120ft) missile if it has produced one from its tail. Roll to 1d20 + Riding Skill Rank to hit. Damage: 6d8+F Force Damage.</p><p>-Guillotine Pincers: This mount can crush many foes standing unfortunately within melee range of it with ease. Roll 1d20 + Riding Skill Rank to hit. Damage: 3d6+F Slashing Damage.</p><p>Notes:</p><p>-This Mount eats metal. If you feed it up to a ton (2000 lbs) of scrap metal, it can use the fuel in its body to generate a Literal Missile. Its body can store up to 6 Literal Missiles. -There is a 30 hour cooldown between Literal Missile production.</p><p>-This Mount''s multiple, powerful legs make it unimpeded by Difficult Terrain.</p><p>-This Mount cannot swim.</p><hr><p><em>Source: Community submission — JackWreckem (Crawler #36320). From <a href="https://pointmongo.com/browse/mounts/duneblazer-missile-scorpion">Point Mongo</a>.</em></p>'
