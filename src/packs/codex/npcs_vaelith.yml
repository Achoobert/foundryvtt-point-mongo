      content: '<p><em>A bioluminescent Kthyren historian-lawyer known as ''The Silence Before Verdict,'' defending marginalized species against corrupt galactic powers.</em></p><p><strong>Type:</strong> Lawyer · <strong>Race:</strong> The Kythyren</p><p>A bioluminescent extraterrestrial from the ocean-world Nerevos Prime, whose civilization evolved around perfect memory retention, producing legendary historians and negotiators. Specializes in defending marginalized species against megacorporations, corrupt planetary governors, and empires exploiting treaty loopholes. Wears a living-circuitry legal mantle that records every word spoken at trial; nicknamed "The Silence Before Verdict" for his calm, razor-sharp logic.</p><hr><p><em>Source: Community submission — Kyton786 (Crawler #11890). From <a href="https://pointmongo.com/browse/npcs/vaelith">Point Mongo</a>.</em></p>'
