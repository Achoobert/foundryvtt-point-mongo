    text:
      format: 1
      content: '<p><em>Triggered when you do something so unprecedented that the System AI has to invent a brand-new achievement on the spot, live, specifically for you.</em></p><p>There was no achievement for what you just did. We checked. We had to write one in real time. That doesn''t happen. There are millions of achievements. We thought we''d covered everything. Congratulations, you broke the categorization system. Someone in the back office is furious about the paperwork.</p><p>Reward: Legendary Off-The-Books Box</p><hr><p><em>Source: Chex. From <a href="https://pointmongo.com/browse/achievements/the-system-ai-has-notes">Point Mongo</a>.</em></p>'
