    name: Infernal Skeletal Charger
    type: text
    text:
      format: 1
      content: '<p><em>A high-tier undead, fire-breathing skeletal horse mount that trades stealth and comfort for a devastating breath attack and dread aura.</em></p><p><strong>Type:</strong> Undead / Fire-Aspected · <strong>Size:</strong> Large</p><p>Durability: High. Active — Sulphur Sneeze: blasts white-hot fire from its nasal cavity (high fire, low necrotic damage; risk of melting its own bridle). Passive — Terror Trot: hoofbeats inflict an Aura of Dread within 10 meters on low-level mobs. An elite mount for riders who find "living" horses too structurally sound — undead nature makes it terrible for stealth, and no skin makes long rides uncomfortable for everyone else nearby (it constantly smells like an active fire hazard).</p><hr><p><em>Source: Community submission — David Brookhart (Crawler #26531). From <a href="https://pointmongo.com/browse/mounts/infernal-skeletal-charger">Point Mongo</a>.</em></p>'
