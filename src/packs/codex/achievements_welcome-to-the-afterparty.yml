      content: '<p><em>Triggered when you enter the dungeon drunk.</em></p><p>Triggered when entering the dungeon drunk.</p><p>NEW ACHIEVEMENT: Welcome to the afterparty</p><p>You entered the dungeon drunk. Lucky you, you were out drinking once again when the dungeon collapsed. Your ex-girlfriend Becky hated when you drank, hence the ex part. But look at you now, you''re alive, and she''s squished. Now the real fun begins; welcome to the afterparty.</p><p>Reward: You''ve received a Bronze asshole box</p><hr><p><em>Source: Community submission — Sketch. From <a href="https://pointmongo.com/browse/achievements/welcome-to-the-afterparty">Point Mongo</a>.</em></p>'
