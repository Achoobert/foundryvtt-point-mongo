    text:
      format: 1
      content: '<p><em>A supposed non-profit sponsor collecting crawler stats for a sister trading-card company under the guise of memorializing them.</em></p><p>A non-profit corporation sponsoring as many crawlers as possible, top 10 downward. Publicly claims to memorialize as many crawlers as it can, but really harvests their stats and likeness to sell to a sister company producing a trading card game called Crawler Killer.</p><hr><p><em>Source: Community submission — JackWrekem (Crawler #36320). From <a href="https://pointmongo.com/browse/sponsors/the-crawler-memorial-project">Point Mongo</a>.</em></p>'
