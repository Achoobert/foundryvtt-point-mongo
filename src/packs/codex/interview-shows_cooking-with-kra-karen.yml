      content: '<p><em>A cooking show hosted by a clone of Kra-Karen, meant to soften the Apothecary''s public image with a hip, fun vibe.</em></p><p><strong>Host:</strong> Kra-Karen (Clone)</p><p><strong>Sponsor:</strong> The Apothecary</p><p>This is a cooking show Sponsored by The Apothecary, where a crawler prepares their favourite pre-crawl dish Hosted by the original Kra-Karen herself, well, if we''re being honest, it is a 98th generation clone, but whose counting. It has a "hip" "fun" vibe and is a vehicle to attempt to reform the Apothecary''s public image by making Kra-Karen seem more approachable, and humane.</p><hr><p><em>Source: Community submission — DeaDPaN79 (Crawler #1945). From <a href="https://pointmongo.com/browse/interview-shows/cooking-with-kra-karen">Point Mongo</a>.</em></p>'
