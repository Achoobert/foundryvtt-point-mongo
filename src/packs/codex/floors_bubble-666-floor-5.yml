    text:
      format: 1
      content: '<p><em>A four-quadrant hellscape Floor 5 bubble of fire dragons, imp-infested magma fields, demon nightlife dungeons, and a toxic, hallucinogenic ocean.</em></p><p><strong>Type:</strong> Floor 5 Bubble</p><p>A fiery hellscape of sulfur, demons, and dragons. Air: flying dragons living in villages on their boiling backs — get their attention and they''ll flame on. Land: geysers, magma, and obsidian underfoot, populated by small demonic imps. Subterranean: demon nightlife — dungeons, caves, and torture (or something like it) in small caverns. Water: the "nicest" quadrant is actually the most toxic — hallucinogenic fumes, and incubi, succubi, and sirens lurking throughout.</p><hr><p><em>Source: Community submission — Chewyz (Crawler #408) &amp; Jessica Fates (Crawler #2067). From <a href="https://pointmongo.com/browse/floors/bubble-666-floor-5">Point Mongo</a>.</em></p>'
