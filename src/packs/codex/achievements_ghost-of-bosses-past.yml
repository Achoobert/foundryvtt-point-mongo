      content: '<p><em>Triggered when you survive an encounter with a Neighborhood Boss without ever directly engaging it in combat.</em></p><p>You watched a Neighborhood Boss do its terrible work, kept your head down, and slipped away unnoticed. Discretion is, in fact, the better part of valor. Also cowardice. It''s mostly cowardice. Great instincts, though.</p><p>Reward: Silver Discretion Box</p><hr><p><em>Source: Chex. From <a href="https://pointmongo.com/browse/achievements/ghost-of-bosses-past">Point Mongo</a>.</em></p>'
