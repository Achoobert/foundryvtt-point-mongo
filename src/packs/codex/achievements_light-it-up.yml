    text:
      format: 1
      content: '<p><em>Triggered when a crawler successfully lights a torch for the very first time.</em></p><p><strong>Scenario:</strong> Crawler lights a torch for the first time</p><p>Have you seen the sun rise? The first glint of light from the darkness, you have created light in the dark, by using a torch for the first time. So yep, you figured out how light works, great for you.</p><p><strong>Suggested Rewards:</strong></p><p>You can see things around you and know that you have a light.</p><hr><p><em>Source: Community submission — Alex (Crawler #1736). From <a href="https://pointmongo.com/browse/achievements/light-it-up">Point Mongo</a>.</em></p>'
