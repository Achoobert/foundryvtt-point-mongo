      content: '<p><em>Triggered when you fill your Inventory entirely with Misc. Junk before picking up a single useful item.</em></p><p>You had your pick of an entire dungeon floor''s worth of loot and chose bottle caps, a broken spoon, and half a shoelace. There''s a kitchen drawer in every household exactly like your Inventory right now. We respect the commitment to clutter.</p><p>Reward: Bronze Kitchen Draw Box</p><hr><p><em>Source: Chex. From <a href="https://pointmongo.com/browse/achievements/misc-junk-drawer">Point Mongo</a>.</em></p>'
