      content: '<p><em>A sentient canine trio — a future-seeing queen, a soft-hearted prince, and a fierce assassin duchess — entering the dungeon together with their Royal Guard.</em></p><p><strong>The Royal Grumble:</strong></p><p><strong>Queen Annabelle:</strong> she is in charge and makes sure everyone knows it. What she lacks in physical stature she makes up for in her metaphorical one. She can see the future thanks to a magical ring she found on a dead pigeon but is so stubborn she believes she can change it.</p><p><strong>Rupert the prince:</strong> he is big but sensitive, Queen Annabelle expects him to serve as a tank but he is a little too soft inside so will need some encouragement. He is loyal to a fault, often resulting in him being the last to the food bowls, hard to believe based on him being a barrel!</p><p><strong>Duchess Evelyn:</strong> she is the fierce assassin, small but deadly. She knows how to get what she wants and won''t let anyone get in her way. She once took on a German Shepherd and won, he ran away with his tails between his legs, or so she says.</p><p>When they entered the dungeon with their Royal Guard (that''s me by the way) they were completely unaware of what the game would do to both themselves and their relationships. There has been laughter, tears and plenty of belly rubs and that''s all before leaving the first safe room.</p><hr><p><em>Source: Community submission — The Royal Grumble (Crawler #9002). From <a href="https://pointmongo.com/browse/npcs/the-royal-grumble">Point Mongo</a>.</em></p>'
