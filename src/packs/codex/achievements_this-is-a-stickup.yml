      content: '<p><em>Triggered when you enter the World Dungeon with a gun.</em></p><p>You have entered the World Dungeon with one of the strongest common weapon all Humans on Earth can find access to: a gun. I mean, it just makes sense to bring a firearm and use it to defend yourself. Kinetic projectiles will make short work of pretty much anything you come across here on the early floors. I just hope you''ve managed to bring enough ammo...</p><p>Reward: Bronze Armed and Dangerous Box</p><hr><p><em>Source: JackWreckem. From <a href="https://pointmongo.com/browse/achievements/this-is-a-stickup">Point Mongo</a>.</em></p>'
