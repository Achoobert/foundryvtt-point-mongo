      content: '<p><em>Triggered when a self-assured tabletop/video game veteran enters the dungeon, prompting the AI to raise the difficulty just for them.</em></p><p><strong>Trigger:</strong> A gamer enters the dungeon.</p><p><strong>Effect:</strong> every mob the crawler encounters has its level automatically increased by 5%, with no extra reward for the added difficulty — can''t have them getting bored.</p><hr><p><em>Source: Community submission — John (Crawler #24597). From <a href="https://pointmongo.com/browse/achievements/so-you-think-you-re-prepared">Point Mongo</a>.</em></p>'
