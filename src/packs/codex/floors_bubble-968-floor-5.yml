    text:
      format: 1
      content: '<p><em>A four-quadrant Hollywood-parody Floor 5 bubble — Holly-Weird — hiding corrupted celebrities, ash-crumbling city blocks, a coastal sea horror, and a forbidden underworld market.</em></p><p><strong>Type:</strong> Floor 5 Bubble</p><p>Air — Birdbank: mountain-perched bird-folk city given complimentary flight cloaks; prominent citizens have been kidnapped by a group called the Cytols and returned with changed personalities. Land — Holly-Weird proper: a rocky desert metropolis of blurred-together cities, now crumbling to ash from unchecked corruption and increasingly corrupt city guards. Water — Venison Beach: a coastal village terrorized nightly by something rising from ruins beneath the sea. Subterranean: Prohibition-era gambling halls turned into a sprawling, unsustainable black market for forbidden spells and outlawed potions, one bad night from destroying the whole bubble.</p><hr><p><em>Source: Community submission — Myles L (Crawler #26933). From <a href="https://pointmongo.com/browse/floors/bubble-968-floor-5">Point Mongo</a>.</em></p>'
