      content: '<p><em>Triggered when you take part in a boss fight without dealing the boss any damage.</em></p><p>You participated in a boss fight where you contributed absolutely no damage to the boss, letting your party do all the actual heavy lifting. Whatever you were doing, I sure hope the other Crawlers won''t hold you accountable to your lack of support.</p><p>Reward: Nice try.</p><hr><p><em>Source: Community submission — JackWreckem. From <a href="https://pointmongo.com/browse/achievements/go-my-minions">Point Mongo</a>.</em></p>'
